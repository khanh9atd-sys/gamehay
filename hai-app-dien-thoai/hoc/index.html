goài mặc thêm áo vào. Nữ: Biết rồi. Anh tìm giúp em cái mũ trắng được không? Nam: Ở cạnh cửa.","qs":[["外面天气怎么样？","Bên ngoài thời tiết thế nào?",["下雪了","下雨了","晴天"]],["帽子在哪儿？","Cái mũ ở đâu?",["门旁边","桌子上","床上"]]]},{"l":2,"s":0,"k":"Đoạn văn","t":"小王考试考得不好，他很不高兴。老师告诉他：“没关系，每天多练习，下次一定会更好。”","vi":"Tiểu Vương thi không tốt, cậu ấy rất buồn. Thầy giáo bảo: “Không sao, mỗi ngày luyện tập nhiều hơn, lần sau nhất định sẽ tốt hơn.”","qs":[["小王为什么不高兴？","Vì sao Tiểu Vương không vui?",["考试考得不好","生病了","手机丢了"]],["老师让他怎么做？","Thầy giáo bảo cậu ấy làm gì?",["每天多练习","休息一下","换学校"]]]},{"l":2,"s":1,"k":"Hội thoại","t":"女：服务员，我们要一个鱼，一个鸡蛋汤，再要两碗米饭。男：好的，还要别的吗？女：再来两杯咖啡。","vi":"Nữ: Phục vụ ơi, cho chúng tôi một món cá, một bát canh trứng, thêm hai bát cơm. Nam: Vâng, còn gì nữa không ạ? Nữ: Thêm hai cốc cà phê.","qs":[["他们点了什么汤？","Họ gọi canh gì?",["鸡蛋汤","鱼汤","羊肉汤"]],["他们要了几碗米饭？","Họ gọi mấy bát cơm?",["两碗","一碗","三碗"]]]},{"l":2,"s":1,"k":"Đoạn văn","t":"我住的地方离公司很远，坐公共汽车要一个多小时。所以我每天七点就出门，晚上八点才到家。","vi":"Chỗ tôi ở cách công ty rất xa, đi xe buýt mất hơn một tiếng. Vì vậy ngày nào tôi cũng bảy giờ đã ra khỏi nhà, tám giờ tối mới về đến nhà.","qs":[["他怎么去公司？","Anh ấy đến công ty bằng gì?",["坐公共汽车","开车","走路"]],["他每天几点出门？","Mỗi ngày anh ấy ra khỏi nhà lúc mấy giờ?",["七点","八点","六点"]]]},{"l":2,"s":1,"k":"Hội thoại","t":"男：你觉得这件红色的衣服怎么样？女：颜色很好看，但是有点儿大。男：那我们再看看小一点儿的吧。","vi":"Nam: Em thấy cái áo màu đỏ này thế nào? Nữ: Màu rất đẹp nhưng hơi rộng. Nam: Vậy mình xem thêm cái nhỏ hơn một chút nhé.","qs":[["女的觉得衣服怎么样？","Người nữ thấy cái áo thế nào?",["颜色好看，但是有点儿大","太贵了","颜色不好看"]],["他们接下来要做什么？","Tiếp theo họ định làm gì?",["看小一点儿的衣服","回家","买红色的"]]]},{"l":2,"s":1,"k":"Đoạn văn","t":"我妹妹非常喜欢唱歌和跳舞。每个星期六，她都去学习跳舞。她说长大以后想当一名老师。","vi":"Em gái tôi rất thích hát và nhảy múa. Thứ Bảy nào em cũng đi học múa. Em nói lớn lên muốn làm cô giáo.","qs":[["妹妹喜欢什么？","Em gái thích gì?",["唱歌和跳舞","踢足球","游泳"]],["妹妹以后想做什么？","Sau này em gái muốn làm gì?",["当老师","当医生","当歌手"]]]},{"l":2,"s":1,"k":"Hội thoại","t":"女：你明天能来我家吗？我们一起准备考试。男：明天上午我要去医院看奶奶，下午可以吗？女：没问题。","vi":"Nữ: Mai bạn đến nhà mình được không? Chúng ta cùng ôn thi. Nam: Sáng mai mình phải vào viện thăm bà, buổi chiều được không? Nữ: Không vấn đề gì.","qs":[["男的明天上午做什么？","Sáng mai người nam làm gì?",["去医院看奶奶","准备考试","上班"]],["他们什么时候一起准备考试？","Khi nào họ cùng ôn thi?",["明天下午","明天上午","今天晚上"]]]},{"l":2,"s":2,"k":"Đoạn văn","t":"上个星期我去旅游了。那里的天气很好，东西也不贵。我每天都去不同的地方，还认识了很多新朋友。","vi":"Tuần trước tôi đi du lịch. Thời tiết ở đó rất đẹp, đồ cũng không đắt. Ngày nào tôi cũng đi một nơi khác nhau, còn quen được nhiều bạn mới.","qs":[["那里的东西怎么样？","Đồ ở đó thế nào?",["不贵","很贵","不好吃"]],["旅游的时候他认识了什么人？","Khi đi du lịch anh ấy quen được ai?",["很多新朋友","一个老师","他的同事"]]]},{"l":2,"s":2,"k":"Hội thoại","t":"男：你的眼睛怎么红了？女：我昨天晚上看书看到两点，没怎么睡觉。男：你应该早点儿休息。","vi":"Nam: Sao mắt em đỏ vậy? Nữ: Tối qua em đọc sách đến hai giờ, gần như không ngủ. Nam: Em nên nghỉ ngơi sớm hơn.","qs":[["女的眼睛为什么红了？","Vì sao mắt người nữ đỏ?",["昨天晚上睡得太晚","她哭了","她生病了"]],["男的让她做什么？","Người nam bảo cô ấy làm gì?",["早点儿休息","多看书","去医院"]]]},{"l":2,"s":2,"k":"Đoạn văn","t":"这家饭店的菜又便宜又好吃，所以每天中午都有很多人来这儿吃饭。如果来晚了，就没有位子了。","vi":"Món ăn ở nhà hàng này vừa rẻ vừa ngon, nên trưa nào cũng có rất nhiều người đến ăn. Nếu đến muộn thì không còn chỗ ngồi.","qs":[["为什么很多人来这家饭店？","Vì sao nhiều người đến nhà hàng này?",["菜又便宜又好吃","离公司近","服务员很好"]],["来晚了会怎么样？","Đến muộn sẽ thế nào?",["没有位子","菜更便宜","饭店关门"]]]},{"l":2,"s":2,"k":"Hội thoại","t":"女：你知道去火车站怎么走吗？男：一直往前走，到第二个路口往右走，就能看到了。女：远吗？男：不远，走路十分钟。","vi":"Nữ: Bạn biết đường đến ga tàu không? Nam: Đi thẳng, đến ngã tư thứ hai rẽ phải là thấy. Nữ: Có xa không? Nam: Không xa, đi bộ mười phút.","qs":[["到第二个路口往哪边走？","Đến ngã tư thứ hai đi hướng nào?",["往右","往左","一直往前"]],["走路要多长时间？","Đi bộ mất bao lâu?",["十分钟","二十分钟","一个小时"]]]},{"l":2,"s":2,"k":"Đoạn văn","t":"我的同事小李很喜欢运动。他每天下班以后都去游泳，周末还和朋友踢足球。他说运动能让他忘记工作的累。","vi":"Đồng nghiệp Tiểu Lý của tôi rất thích thể thao. Ngày nào tan làm anh ấy cũng đi bơi, cuối tuần còn đá bóng với bạn. Anh ấy nói thể thao giúp anh quên đi mệt mỏi công việc.","qs":[["小李下班以后做什么？","Tan làm Tiểu Lý làm gì?",["去游泳","踢足球","回家睡觉"]],["小李为什么喜欢运动？","Vì sao Tiểu Lý thích thể thao?",["能忘记工作的累","为了比赛","老师让他去"]]]},{"l":2,"s":3,"k":"Hội thoại","t":"男：听说你要去中国留学了？女：是啊，下个月就走。男：太好了！到了那儿给我们打电话。女：我会每个星期给你们发信息的。","vi":"Nam: Nghe nói bạn sắp sang Trung Quốc du học? Nữ: Đúng vậy, tháng sau đi rồi. Nam: Tốt quá! Đến nơi nhớ gọi cho chúng mình. Nữ: Tuần nào mình cũng sẽ nhắn tin cho các bạn.","qs":[["女的要去中国做什么？","Người nữ sang Trung Quốc làm gì?",["留学","旅游","工作"]],["她什么时候走？","Khi nào cô ấy đi?",["下个月","下个星期","明天"]]]},{"l":2,"s":3,"k":"Đoạn văn","t":"以前我觉得汉字很难，所以不喜欢学汉语。后来老师告诉我，每个汉字都有自己的故事。从那以后，我开始喜欢上汉字了。","vi":"Trước đây tôi thấy chữ Hán rất khó nên không thích học tiếng Trung. Sau đó thầy giáo nói với tôi, mỗi chữ Hán đều có câu chuyện riêng. Từ đó, tôi bắt đầu thích chữ Hán.","qs":[["以前他为什么不喜欢学汉语？","Trước đây vì sao anh ấy không thích học tiếng Trung?",["觉得汉字很难","老师不好","没有时间"]],["老师告诉他什么？","Thầy giáo nói gì với anh ấy?",["每个汉字都有自己的故事","汉字很简单","要多写字"]]]},{"l":2,"s":3,"k":"Hội thoại","t":"女：这本书你看完了吗？男：还没有，还有一半。女：好看吗？男：非常好看，我看完了就借给你。","vi":"Nữ: Quyển sách này bạn đọc xong chưa? Nam: Chưa, còn một nửa. Nữ: Có hay không? Nam: Rất hay, đọc xong mình cho bạn mượn.","qs":[["男的书看了多少？","Người nam đọc được bao nhiêu?",["一半","全部","一点儿"]],["男的看完了要做什么？","Đọc xong người nam định làm gì?",["把书借给女的","买新书","还给图书馆"]]]},{"l":2,"s":3,"k":"Đoạn văn","t":"今天是我第一天上班，我有点儿紧张。但是同事们都对我很好，还教我怎么用新电脑。下班的时候，我觉得很快乐。","vi":"Hôm nay là ngày đầu tiên tôi đi làm, tôi hơi căng thẳng. Nhưng các đồng nghiệp đều rất tốt với tôi, còn dạy tôi cách dùng máy tính mới. Lúc tan làm, tôi thấy rất vui.","qs":[["第一天上班他觉得怎么样？","Ngày đầu đi làm anh ấy thấy thế nào?",["有点儿紧张","很累","很生气"]],["同事们教他什么？","Đồng nghiệp dạy anh ấy gì?",["怎么用新电脑","怎么做饭","怎么开车"]]]},{"l":2,"s":3,"k":"Hội thoại","t":"男：你最近为什么总是笑？女：因为我考上大学了！男：真的吗？太好了，祝贺你！我们晚上去吃饭庆祝一下吧。","vi":"Nam: Dạo này sao bạn cứ cười mãi thế? Nữ: Vì mình đỗ đại học rồi! Nam: Thật à? Tuyệt quá, chúc mừng bạn! Tối nay mình đi ăn ăn mừng nhé.","qs":[["女的为什么总是笑？","Vì sao người nữ cứ cười mãi?",["考上大学了","找到工作了","要结婚了"]],["他们晚上要做什么？","Tối nay họ định làm gì?",["去吃饭庆祝","去看电影","去学校"]]]},{"l":3,"s":0,"k":"Đoạn văn","t":"我的邻居是一位八十岁的老人。他每天早上都会在公园里打太极拳，下午就坐在门口和孩子们聊天。大家都说，他看起来比实际年龄年轻很多。","vi":"Hàng xóm của tôi là một cụ già tám mươi tuổi. Sáng nào cụ cũng tập Thái cực quyền trong công viên, buổi chiều ngồi trước cửa trò chuyện với bọn trẻ. Mọi người đều nói trông cụ trẻ hơn tuổi thật nhiều.","qs":[["老人每天早上做什么？","Sáng nào cụ già cũng làm gì?",["在公园里打太极拳","去超市买菜","在家看电视"]],["大家觉得老人怎么样？","Mọi người thấy cụ thế nào?",["看起来比实际年龄年轻","身体不太好","很少说话"]]]},{"l":3,"s":0,"k":"Hội thoại","t":"女：这个周末你有什么安排？男：我打算去爬山，听说山上的风景特别美。女：我可以跟你一起去吗？男：当然可以，不过要早点儿出发。","vi":"Nữ: Cuối tuần này bạn có kế hoạch gì? Nam: Mình định đi leo núi, nghe nói phong cảnh trên núi rất đẹp. Nữ: Mình đi cùng được không? Nam: Tất nhiên rồi, nhưng phải xuất phát sớm.","qs":[["男的周末打算做什么？","Cuối tuần người nam định làm gì?",["去爬山","去游泳","在家休息"]],["男的提醒女的什么？","Người nam nhắc người nữ điều gì?",["要早点儿出发","多带衣服","别忘了带钱"]]]},{"l":3,"s":0,"k":"Đoạn văn","t":"为了学好汉语，我每天晚上都会花一个小时复习当天学过的生词。刚开始觉得很累，但是坚持了一个月以后，我发现自己的进步非常大。","vi":"Để học tốt tiếng Trung, tối nào tôi cũng dành một tiếng ôn lại từ mới đã học trong ngày. Lúc đầu thấy rất mệt, nhưng kiên trì một tháng, tôi thấy mình tiến bộ rất nhiều.","qs":[["他每天晚上花多长时间复习？","Mỗi tối anh ấy ôn bao lâu?",["一个小时","半个小时","两个小时"]],["坚持一个月以后他发现了什么？","Kiên trì một tháng anh ấy nhận ra gì?",["自己的进步非常大","汉语太难了","生词太多"]]]},{"l":3,"s":0,"k":"Hội thoại","t":"男：你的行李箱怎么这么重？女：里面都是给朋友带的礼物。男：要不要我帮你拿？女：太感谢了，我的手已经很累了。","vi":"Nam: Sao vali của bạn nặng thế? Nữ: Bên trong toàn quà mang cho bạn bè. Nam: Có cần mình xách giúp không? Nữ: Cảm ơn nhiều, tay mình mỏi lắm rồi.","qs":[["行李箱里面有什么？","Trong vali có gì?",["给朋友的礼物","衣服","书"]],["男的想做什么？","Người nam muốn làm gì?",["帮她拿行李箱","买礼物","送她回家"]]]},{"l":3,"s":0,"k":"Đoạn văn","t":"昨天我去超市买东西，结账的时候发现钱包忘在家里了。正在我着急的时候，后面一位阿姨主动帮我付了钱，还说不用还了。","vi":"Hôm qua tôi đi siêu thị, lúc thanh toán mới phát hiện để quên ví ở nhà. Đang lúc cuống lên thì một cô phía sau chủ động trả tiền giúp tôi, còn bảo không cần trả lại.","qs":[["结账的时候他发现了什么？","Lúc thanh toán anh ấy phát hiện ra gì?",["钱包忘在家里了","东西太贵了","超市关门了"]],["阿姨做了什么？","Cô ấy đã làm gì?",["帮他付了钱","借给他手机","送他回家"]]]},{"l":3,"s":1,"k":"Hội thoại","t":"女：你最近怎么瘦了这么多？男：我每天晚上都去健身房锻炼，而且不吃甜的东西了。女：坚持得真好！男：主要是为了身体健康。","vi":"Nữ: Dạo này sao bạn gầy đi nhiều thế? Nam: Tối nào mình cũng đến phòng gym, lại không ăn đồ ngọt nữa. Nữ: Kiên trì giỏi thật! Nam: Chủ yếu là vì sức khỏe.","qs":[["男的为什么瘦了？","Vì sao người nam gầy đi?",["每天锻炼，不吃甜的","生病了","工作太忙"]],["男的锻炼主要是为了什么？","Người nam tập luyện chủ yếu vì gì?",["身体健康","参加比赛","好看"]]]},{"l":3,"s":1,"k":"Đoạn văn","t":"我们公司附近新开了一家咖啡馆，环境安静，咖啡也很香。很多同事中午都喜欢去那儿休息一会儿，有时候也在那儿开会。","vi":"Gần công ty chúng tôi mới mở một quán cà phê, không gian yên tĩnh, cà phê cũng rất thơm. Nhiều đồng nghiệp buổi trưa thích đến đó nghỉ một lát, đôi khi còn họp ở đó.","qs":[["新咖啡馆怎么样？","Quán cà phê mới thế nào?",["环境安静，咖啡很香","很吵","很贵"]],["同事们中午去那儿做什么？","Buổi trưa đồng nghiệp đến đó làm gì?",["休息一会儿","吃午饭","买书"]]]},{"l":3,"s":1,"k":"Hội thoại","t":"男：请问，去博物馆坐几路公共汽车？女：坐十八路，在第三站下车。男：大概要多长时间？女：如果不堵车的话，二十分钟就到了。","vi":"Nam: Xin hỏi, đến bảo tàng đi xe buýt số mấy? Nữ: Đi số mười tám, xuống ở trạm thứ ba. Nam: Khoảng bao lâu? Nữ: Nếu không tắc đường thì hai mươi phút là tới.","qs":[["去博物馆坐几路车？","Đến bảo tàng đi xe số mấy?",["十八路","八路","三路"]],["不堵车的话要多长时间？","Không tắc đường thì mất bao lâu?",["二十分钟","十分钟","半个小时"]]]},{"l":3,"s":1,"k":"Đoạn văn","t":"小时候，我最怕的就是打针。每次去医院，我都会大哭。现在我自己成了一名护士，每天给别人打针，我总是先跟孩子们讲个故事，让他们不那么害怕。","vi":"Hồi nhỏ, điều tôi sợ nhất là tiêm. Lần nào đi bệnh viện tôi cũng khóc to. Giờ tôi trở thành y tá, ngày nào cũng tiêm cho người khác, tôi luôn kể cho bọn trẻ một câu chuyện trước để chúng bớt sợ.","qs":[["他小时候最怕什么？","Hồi nhỏ người này sợ nhất điều gì?",["打针","上学","黑夜"]],["他现在是做什么的？","Bây giờ người này làm nghề gì?",["护士","老师","医生"]]]},{"l":3,"s":1,"k":"Hội thoại","t":"女：你的汉语说得真流利，学了多长时间？男：差不多三年了。女：有什么好方法吗？男：多听、多说，还要多和中国人交朋友。","vi":"Nữ: Bạn nói tiếng Trung lưu loát thật, học bao lâu rồi? Nam: Khoảng ba năm. Nữ: Có cách gì hay không? Nam: Nghe nhiều, nói nhiều, và kết bạn nhiều với người Trung Quốc.","qs":[["男的学了多长时间汉语？","Người nam học tiếng Trung bao lâu?",["差不多三年","一年","五年"]],["男的学汉语的方法是什么？","Cách học của người nam là gì?",["多听、多说、多交中国朋友","只看书","上网课"]]]},{"l":3,"s":2,"k":"Đoạn văn","t":"爷爷奶奶住在农村，那里空气新鲜，环境很好。每年放暑假，我都会去他们家住一个月，帮他们种菜、喂鸡，过得非常开心。","vi":"Ông bà tôi sống ở nông thôn, không khí trong lành, môi trường rất tốt. Mỗi kỳ nghỉ hè tôi đều đến nhà ông bà ở một tháng, giúp trồng rau, cho gà ăn, rất vui vẻ.","qs":[["爷爷奶奶住在哪儿？","Ông bà sống ở đâu?",["农村","城市","国外"]],["放暑假时他在那儿做什么？","Nghỉ hè người này làm gì ở đó?",["帮忙种菜、喂鸡","学习","打工"]]]},{"l":3,"s":2,"k":"Hội thoại","t":"男：明天的会议改到下午三点了，你通知大家了吗？女：已经发了电子邮件。男：经理也知道了吗？女：放心吧，我刚才也给他打了电话。","vi":"Nam: Cuộc họp ngày mai dời sang ba giờ chiều rồi, bạn đã báo mọi người chưa? Nữ: Đã gửi email rồi. Nam: Giám đốc cũng biết chưa? Nữ: Yên tâm, vừa nãy tôi cũng gọi điện cho ông ấy rồi.","qs":[["会议改到什么时候？","Cuộc họp dời sang lúc nào?",["明天下午三点","明天上午","今天下午"]],["女的怎么通知经理的？","Người nữ báo giám đốc bằng cách nào?",["打电话","发邮件","写信"]]]},{"l":3,"s":2,"k":"Đoạn văn","t":"现在很多年轻人喜欢在网上买东西，因为又方便又便宜。但是也有人觉得，在商店里买可以亲自看看东西的质量，更让人放心。","vi":"Bây giờ nhiều người trẻ thích mua đồ trên mạng vì vừa tiện vừa rẻ. Nhưng cũng có người cho rằng mua ở cửa hàng được tự xem chất lượng, yên tâm hơn.","qs":[["年轻人为什么喜欢在网上买东西？","Vì sao người trẻ thích mua online?",["又方便又便宜","质量更好","可以看到东西"]],["有人为什么喜欢在商店买？","Vì sao có người thích mua ở cửa hàng?",["可以亲自看质量","更便宜","更快"]]]},{"l":3,"s":2,"k":"Hội thoại","t":"女：我的电脑突然不能上网了。男：你检查过网线了吗？女：检查了，没问题。男：那可能是网络出了问题，我帮你打电话问问。","vi":"Nữ: Máy tính của tôi bỗng không vào mạng được. Nam: Bạn kiểm tra dây mạng chưa? Nữ: Kiểm tra rồi, không sao cả. Nam: Vậy có thể mạng có vấn đề, để tôi gọi điện hỏi giúp.","qs":[["女的电脑有什么问题？","Máy tính người nữ bị gì?",["不能上网","开不了机","屏幕坏了"]],["男的打算做什么？","Người nam định làm gì?",["打电话问问","买新电脑","检查网线"]]]},{"l":3,"s":2,"k":"Đoạn văn","t":"我的同屋来自日本，她做饭做得特别好。每个周末，她都会做几个日本菜请我们吃。作为感谢，我也教她做越南菜，我们成了很好的朋友。","vi":"Bạn cùng phòng của tôi đến từ Nhật Bản, nấu ăn rất giỏi. Cuối tuần nào cô ấy cũng nấu vài món Nhật mời chúng tôi. Để cảm ơn, tôi cũng dạy cô ấy nấu món Việt, chúng tôi thành bạn thân.","qs":[["同屋来自哪个国家？","Bạn cùng phòng đến từ nước nào?",["日本","中国","韩国"]],["他教同屋做什么？","Người này dạy bạn cùng phòng làm gì?",["越南菜","中国菜","日本菜"]]]},{"l":3,"s":3,"k":"Hội thoại","t":"男：这次比赛你得了第一名，真了不起！女：谢谢，其实我很紧张，差点儿忘了要说什么。男：可是你看起来一点儿也不紧张。女：那是因为我准备了很长时间。","vi":"Nam: Lần thi này bạn đạt giải nhất, giỏi thật! Nữ: Cảm ơn, thật ra mình rất hồi hộp, suýt quên mất phải nói gì. Nam: Nhưng trông bạn chẳng hồi hộp chút nào. Nữ: Vì mình đã chuẩn bị rất lâu.","qs":[["女的比赛得了第几名？","Người nữ đạt giải mấy?",["第一名","第二名","第三名"]],["为什么她看起来不紧张？","Vì sao trông cô ấy không hồi hộp?",["准备了很长时间","她不在乎","比赛很简单"]]]},{"l":3,"s":3,"k":"Đoạn văn","t":"很多人认为，早上吃得好对身体很重要。可是现在很多上班族因为起得晚，经常不吃早饭就去上班。医生提醒大家，长时间不吃早饭容易生病。","vi":"Nhiều người cho rằng ăn sáng đầy đủ rất quan trọng với sức khỏe. Nhưng nhiều người đi làm vì dậy muộn nên thường không ăn sáng mà đi làm luôn. Bác sĩ nhắc nhở, nhịn ăn sáng lâu ngày dễ sinh bệnh.","qs":[["很多上班族为什么不吃早饭？","Vì sao nhiều người đi làm không ăn sáng?",["起得晚","不饿","没有钱"]],["医生提醒什么？","Bác sĩ nhắc nhở điều gì?",["长时间不吃早饭容易生病","早饭要少吃","要多喝咖啡"]]]},{"l":3,"s":3,"k":"Hội thoại","t":"女：你上次借我的那本词典用完了吗？男：哎呀，我忘了还你，对不起！女：没关系，我下周考试要用。男：我明天一定带给你。","vi":"Nữ: Quyển từ điển lần trước bạn mượn mình dùng xong chưa? Nam: Ôi, mình quên trả bạn, xin lỗi nhé! Nữ: Không sao, tuần sau mình thi cần dùng. Nam: Mai mình nhất định mang đến.","qs":[["男的借了女的什么？","Người nam mượn người nữ cái gì?",["词典","电脑","雨伞"]],["女的什么时候要用？","Khi nào người nữ cần dùng?",["下周考试","明天","今天晚上"]]]},{"l":3,"s":3,"k":"Đoạn văn","t":"这座城市最有名的是它的夜景。晚上八点以后，河两边的灯全都亮了，像一条发光的河。很多游客专门坐船在河上看夜景，觉得非常浪漫。","vi":"Thành phố này nổi tiếng nhất là cảnh đêm. Sau tám giờ tối, đèn hai bên sông đều sáng, như một dòng sông phát sáng. Nhiều du khách đặc biệt đi thuyền ngắm cảnh đêm trên sông, thấy rất lãng mạn.","qs":[["这座城市最有名的是什么？","Thành phố này nổi tiếng nhất về gì?",["夜景","小吃","博物馆"]],["游客怎么看夜景？","Du khách ngắm cảnh đêm bằng cách nào?",["坐船在河上看","爬山看","在饭店看"]]]},{"l":3,"s":3,"k":"Hội thoại","t":"男：你怎么还没下班？女：经理让我把这份报告写完再走。男：需要我帮忙吗？女：不用了，还有一点儿就写完了，你先走吧。","vi":"Nam: Sao bạn vẫn chưa về? Nữ: Giám đốc bảo tôi viết xong báo cáo này rồi mới về. Nam: Có cần tôi giúp không? Nữ: Không cần đâu, còn một chút nữa là xong, bạn về trước đi.","qs":[["女的为什么还没下班？","Vì sao người nữ chưa về?",["要写完报告","在等朋友","在开会"]],["女的报告写了多少了？","Báo cáo của người nữ viết đến đâu rồi?",["还有一点儿就写完了","刚开始写","一半"]]]},{"l":4,"s":0,"k":"Đoạn văn","t":"心理学家发现，人们在心情好的时候，更愿意帮助别人；而帮助别人以后，心情又会变得更好。所以，如果你今天心情不太好，不妨试着帮别人做一件小事。","vi":"Các nhà tâm lý học phát hiện, khi tâm trạng tốt, người ta sẵn lòng giúp người khác hơn; và sau khi giúp người khác, tâm trạng lại càng tốt hơn. Vì vậy nếu hôm nay bạn không vui, hãy thử giúp ai đó một việc nhỏ.","qs":[["心理学家发现人们什么时候更愿意帮助别人？","Khi nào người ta sẵn lòng giúp người khác hơn?",["心情好的时候","工作累的时候","有钱的时候"]],["心情不好时作者建议做什么？","Khi buồn, tác giả khuyên làm gì?",["帮别人做一件小事","好好睡一觉","去旅游"]]]},{"l":4,"s":0,"k":"Hội thoại","t":"女：听说你辞职了？男：是的，我想去上海发展。女：可是你在这儿的工资不是挺高的吗？男：工资是不错，但我觉得在这儿学不到新东西了，想换个环境挑战一下自己。","vi":"Nữ: Nghe nói bạn nghỉ việc rồi? Nam: Đúng, mình muốn đến Thượng Hải phát triển. Nữ: Nhưng lương ở đây chẳng phải khá cao sao? Nam: Lương thì tốt, nhưng mình thấy ở đây không học được gì mới nữa, muốn đổi môi trường thử thách bản thân.","qs":[["男的为什么辞职？","Vì sao người nam nghỉ việc?",["想换个环境挑战自己","工资太低","和同事关系不好"]],["男的打算去哪儿？","Người nam định đi đâu?",["上海","北京","国外"]]]},{"l":4,"s":0,"k":"Đoạn văn","t":"堵车是大城市的普遍问题。为了减少堵车，很多城市鼓励人们坐地铁或者骑自行车上班。这样既能节约时间，又能保护环境，还能锻炼身体。","vi":"Tắc đường là vấn đề phổ biến ở thành phố lớn. Để giảm tắc đường, nhiều thành phố khuyến khích người dân đi tàu điện ngầm hoặc đạp xe đi làm. Như vậy vừa tiết kiệm thời gian, vừa bảo vệ môi trường, lại rèn luyện sức khỏe.","qs":[["堵车是什么样的问题？","Tắc đường là vấn đề thế nào?",["大城市的普遍问题","只有小城市才有","很少见"]],["坐地铁或骑车上班有什么好处？","Đi tàu điện hoặc đạp xe đi làm có lợi gì?",["节约时间、保护环境、锻炼身体","更便宜","更舒服"]]]},{"l":4,"s":0,"k":"Hội thoại","t":"男：这家餐厅的服务态度怎么这么差？女：可能是今天客人太多了，服务员忙不过来。男：那也不能让我们等四十分钟啊。女：别生气了，我们换一家吧。","vi":"Nam: Sao thái độ phục vụ của nhà hàng này tệ thế? Nữ: Có lẽ hôm nay khách đông quá, phục vụ làm không xuể. Nam: Thì cũng không thể để chúng ta đợi bốn mươi phút chứ. Nữ: Đừng giận nữa, mình đổi quán khác đi.","qs":[["他们等了多长时间？","Họ đã đợi bao lâu?",["四十分钟","十分钟","一个小时"]],["女的建议怎么做？","Người nữ đề nghị làm gì?",["换一家餐厅","找经理","继续等"]]]},{"l":4,"s":0,"k":"Đoạn văn","t":"小李第一次参加面试的时候非常紧张，说话的声音都在发抖。面试官笑着对他说：“别紧张，就像和朋友聊天一样。”听了这句话，小李慢慢放松下来，最后顺利地通过了面试。","vi":"Lần đầu đi phỏng vấn, Tiểu Lý vô cùng căng thẳng, giọng nói run run. Người phỏng vấn cười bảo: “Đừng căng thẳng, cứ như trò chuyện với bạn bè thôi.” Nghe vậy, Tiểu Lý dần thả lỏng, cuối cùng vượt qua phỏng vấn suôn sẻ.","qs":[["小李第一次面试时怎么样？","Lần phỏng vấn đầu Tiểu Lý thế nào?",["非常紧张","很轻松","迟到了"]],["面试结果怎么样？","Kết quả phỏng vấn ra sao?",["顺利通过了","没有通过","还不知道"]]]},{"l":4,"s":1,"k":"Hội thoại","t":"女：你周末一般怎么过？男：如果天气好，我会去郊区骑车；如果下雨，就在家看看电影、整理房间。女：听起来很不错。男：工作太忙了，周末就应该好好放松一下。","vi":"Nữ: Cuối tuần bạn thường làm gì? Nam: Trời đẹp thì mình ra ngoại ô đạp xe; trời mưa thì ở nhà xem phim, dọn phòng. Nữ: Nghe hay đấy. Nam: Công việc bận quá, cuối tuần phải thư giãn cho tốt.","qs":[["天气好的时候男的周末做什么？","Trời đẹp cuối tuần người nam làm gì?",["去郊区骑车","在家看电影","加班"]],["男的认为周末应该怎么样？","Người nam cho rằng cuối tuần nên thế nào?",["好好放松","继续工作","去学习"]]]},{"l":4,"s":1,"k":"Đoạn văn","t":"很多父母希望孩子从小就开始学习各种技能，比如钢琴、画画、游泳等等。但是教育专家认为，最重要的是让孩子找到自己真正感兴趣的东西，而不是让他们什么都学。","vi":"Nhiều cha mẹ muốn con học đủ thứ kỹ năng từ nhỏ như piano, vẽ, bơi… Nhưng chuyên gia giáo dục cho rằng quan trọng nhất là giúp con tìm ra điều mình thật sự yêu thích, chứ không phải bắt con học mọi thứ.","qs":[["很多父母希望孩子怎么样？","Nhiều cha mẹ mong con thế nào?",["从小学习各种技能","多玩游戏","早点儿工作"]],["专家认为最重要的是什么？","Chuyên gia cho rằng điều quan trọng nhất là gì?",["让孩子找到真正感兴趣的东西","什么都学","学钢琴"]]]},{"l":4,"s":1,"k":"Hội thoại","t":"男：你觉得网上购物和去商场买，哪个更好？女：各有各的好处。网上购物方便，价格也低；但商场里可以试穿，质量更有保证。男：你说得有道理。","vi":"Nam: Bạn thấy mua online và đi trung tâm thương mại, cái nào tốt hơn? Nữ: Mỗi cái có cái lợi riêng. Mua online tiện, giá lại rẻ; nhưng ở trung tâm thương mại được mặc thử, chất lượng đảm bảo hơn. Nam: Bạn nói có lý.","qs":[["女的认为网上购物有什么好处？","Người nữ cho rằng mua online có lợi gì?",["方便，价格低","质量好","可以试穿"]],["商场购物的好处是什么？","Mua ở trung tâm thương mại có lợi gì?",["可以试穿，质量更有保证","更便宜","更方便"]]]},{"l":4,"s":1,"k":"Đoạn văn","t":"这家公司规定，员工每工作一个小时，就要站起来活动五分钟。经理说，这样做不仅对身体有好处，还能提高工作效率。员工们刚开始不习惯，后来都觉得这个办法很好。","vi":"Công ty này quy định nhân viên cứ làm việc một tiếng phải đứng dậy vận động năm phút. Giám đốc nói làm vậy không chỉ tốt cho sức khỏe mà còn nâng cao hiệu suất. Ban đầu nhân viên không quen, sau đều thấy cách này rất hay.","qs":[["公司规定员工每工作一小时要做什么？","Công ty quy định cứ làm một tiếng phải làm gì?",["站起来活动五分钟","喝一杯水","休息半小时"]],["员工们后来怎么看这个规定？","Về sau nhân viên thấy quy định này thế nào?",["觉得这个办法很好","很不喜欢","觉得浪费时间"]]]},{"l":4,"s":1,"k":"Hội thoại","t":"女：你这次去云南旅游怎么样？男：太棒了！那里的风景美极了，少数民族的文化也特别有意思。女：吃的东西呢？男：有些菜很辣，不过非常好吃。","vi":"Nữ: Chuyến du lịch Vân Nam lần này thế nào? Nam: Tuyệt lắm! Phong cảnh đẹp vô cùng, văn hóa các dân tộc thiểu số cũng rất thú vị. Nữ: Còn đồ ăn? Nam: Có món rất cay, nhưng rất ngon.","qs":[["男的去哪儿旅游了？","Người nam đi du lịch ở đâu?",["云南","上海","海南"]],["男的觉得那里的菜怎么样？","Người nam thấy món ăn ở đó thế nào?",["有些很辣，但非常好吃","不好吃","太贵"]]]},{"l":4,"s":2,"k":"Đoạn văn","t":"有人说：“读万卷书，不如行万里路。”意思是说，只读书是不够的，还要到外面去看看真实的世界。不过，我认为读书和旅行同样重要，读书能让我们在旅行中看到更多东西。","vi":"Có người nói: “Đọc vạn quyển sách không bằng đi vạn dặm đường.” Ý là chỉ đọc sách thôi chưa đủ, còn phải ra ngoài xem thế giới thật. Nhưng tôi cho rằng đọc sách và du lịch quan trọng như nhau, đọc sách giúp ta thấy được nhiều hơn khi đi.","qs":[["“读万卷书，不如行万里路”是什么意思？","Câu “đọc vạn quyển sách không bằng đi vạn dặm đường” nghĩa là gì?",["只读书不够，还要去看真实的世界","读书没有用","旅行很贵"]],["作者认为读书和旅行怎么样？","Tác giả nghĩ gì về đọc sách và du lịch?",["同样重要","读书更重要","旅行更重要"]]]},{"l":4,"s":2,"k":"Đoạn văn","t":"研究表明，每天睡七到八个小时最有利于健康。睡得太少，第二天容易注意力不集中；睡得太多，人反而会觉得更累。所以，保持规律的作息时间非常重要。","vi":"Nghiên cứu cho thấy ngủ bảy đến tám tiếng mỗi ngày là tốt cho sức khỏe nhất. Ngủ quá ít thì hôm sau dễ mất tập trung; ngủ quá nhiều lại càng thấy mệt. Vì vậy giữ giờ giấc sinh hoạt điều độ rất quan trọng.","qs":[["每天睡多长时间最有利于健康？","Ngủ bao lâu mỗi ngày tốt cho sức khỏe nhất?",["七到八个小时","五个小时","十个小时"]],["睡得太多会怎么样？","Ngủ quá nhiều sẽ thế nào?",["反而觉得更累","更精神","更健康"]]]},{"l":4,"s":2,"k":"Hội thoại","t":"女：明天的面试你准备好了吗？男：基本上准备好了，就是不知道该穿什么衣服。女：穿得正式一点儿，给面试官留下好印象。男：好，那我穿那套黑色的西服吧。","vi":"Nữ: Buổi phỏng vấn ngày mai bạn chuẩn bị xong chưa? Nam: Cơ bản là xong rồi, chỉ không biết nên mặc gì. Nữ: Mặc trang trọng một chút, để lại ấn tượng tốt với người phỏng vấn. Nam: Được, vậy mình mặc bộ vest đen.","qs":[["男的不知道什么？","Người nam không biết điều gì?",["该穿什么衣服","面试的时间","面试的地点"]],["男的最后决定穿什么？","Cuối cùng người nam quyết định mặc gì?",["黑色的西服","白色的衬衫","运动服"]]]},{"l":4,"s":2,"k":"Đoạn văn","t":"我的爷爷是一名普通的邮递员，他工作了四十年，每天骑着自行车给村里人送信。虽然现在大家都用手机联系，很少写信了，但村里的老人们还是常常提起他，说他是最让人放心的人。","vi":"Ông tôi là một người đưa thư bình thường, làm việc bốn mươi năm, ngày nào cũng đạp xe đưa thư cho dân làng. Dù giờ mọi người liên lạc bằng điện thoại, ít viết thư, các cụ trong làng vẫn hay nhắc đến ông, nói ông là người đáng tin cậy nhất.","qs":[["爷爷做了多少年邮递员？","Ông làm người đưa thư bao nhiêu năm?",["四十年","二十年","十年"]],["村里的老人怎么评价爷爷？","Các cụ trong làng đánh giá ông thế nào?",["最让人放心的人","很严格的人","很少说话的人"]]]},{"l":4,"s":3,"k":"Hội thoại","t":"男：你为什么选择当老师？女：因为我小时候遇到了一位好老师，是她让我对学习产生了兴趣。男：所以你也想成为那样的老师？女：对，我希望能影响更多的孩子。","vi":"Nam: Vì sao bạn chọn làm giáo viên? Nữ: Vì hồi nhỏ mình gặp được một cô giáo tốt, chính cô khiến mình hứng thú với việc học. Nam: Nên bạn cũng muốn trở thành người thầy như vậy? Nữ: Đúng, mình mong có thể ảnh hưởng đến nhiều đứa trẻ hơn.","qs":[["女的为什么选择当老师？","Vì sao người nữ chọn làm giáo viên?",["小时候遇到了一位好老师","工资高","父母要求"]],["女的希望做什么？","Người nữ mong muốn điều gì?",["影响更多的孩子","换个工作","出国留学"]]]},{"l":4,"s":3,"k":"Đoạn văn","t":"很多人以为，成功的人都是天才。其实，大部分成功的人只是比别人更努力、更有耐心。他们遇到困难时不会轻易放弃，而是不断地寻找解决问题的方法。","vi":"Nhiều người nghĩ người thành công đều là thiên tài. Thật ra phần lớn người thành công chỉ chăm chỉ và kiên nhẫn hơn người khác. Gặp khó khăn họ không dễ bỏ cuộc, mà không ngừng tìm cách giải quyết vấn đề.","qs":[["很多人以为成功的人是什么样的？","Nhiều người nghĩ người thành công là thế nào?",["天才","很有钱","运气好"]],["作者认为成功的人有什么特点？","Theo tác giả người thành công có đặc điểm gì?",["更努力、更有耐心、不轻易放弃","更聪明","朋友更多"]]]},{"l":4,"s":3,"k":"Hội thoại","t":"女：这个房子离地铁站近，交通方便，就是房租有点儿贵。男：每个月多少钱？女：四千五。男：确实不便宜，不过上班能节约很多时间，我觉得值得。","vi":"Nữ: Căn nhà này gần ga tàu điện, đi lại tiện, chỉ có tiền thuê hơi đắt. Nam: Mỗi tháng bao nhiêu? Nữ: Bốn nghìn rưỡi. Nam: Đúng là không rẻ, nhưng đi làm tiết kiệm được nhiều thời gian, mình thấy đáng.","qs":[["这个房子的优点是什么？","Ưu điểm của căn nhà là gì?",["离地铁站近，交通方便","房子很大","很便宜"]],["男的觉得怎么样？","Người nam thấy thế nào?",["值得","太贵了","不想租"]]]},{"l":4,"s":3,"k":"Đoạn văn","t":"春节是中国最重要的传统节日。春节前，人们会打扫房间、贴春联、买新衣服。除夕晚上，一家人坐在一起吃年夜饭、看电视，到了十二点还要放鞭炮，热闹极了。","vi":"Tết Nguyên Đán là lễ truyền thống quan trọng nhất của Trung Quốc. Trước Tết, người ta dọn nhà, dán câu đối, mua quần áo mới. Đêm giao thừa, cả nhà quây quần ăn bữa cơm tất niên, xem tivi, đến mười hai giờ còn đốt pháo, vô cùng náo nhiệt.","qs":[["春节前人们会做什么？","Trước Tết người ta làm gì?",["打扫房间、贴春联、买新衣服","去旅游","上班"]],["除夕晚上一家人做什么？","Đêm giao thừa cả nhà làm gì?",["一起吃年夜饭、看电视","去朋友家","早点儿睡觉"]]]},{"l":4,"s":3,"k":"Hội thoại","t":"男：我发现你最近总是在看关于做饭的书。女：是啊，我打算下个月开一家小饭馆。男：真的吗？你以前不是在银行工作吗？女：对，但做饭才是我真正的爱好，我想试一试。","vi":"Nam: Mình thấy dạo này bạn toàn đọc sách nấu ăn. Nữ: Đúng vậy, mình định tháng sau mở một quán ăn nhỏ. Nam: Thật à? Trước đây bạn làm ngân hàng mà? Nữ: Ừ, nhưng nấu ăn mới là sở thích thật sự của mình, mình muốn thử.","qs":[["女的下个月打算做什么？","Tháng sau người nữ định làm gì?",["开一家小饭馆","去银行工作","出国旅游"]],["女的以前在哪儿工作？","Trước đây người nữ làm ở đâu?",["银行","饭馆","学校"]]]},{"l":5,"s":0,"k":"Đoạn văn","t":"随着智能手机的普及，越来越多的人习惯在网上阅读新闻和小说。有人担心纸质书会因此消失，但事实上，很多读者仍然喜欢拿着一本真正的书，享受翻页时那种特别的感觉。","vi":"Cùng với sự phổ biến của điện thoại thông minh, ngày càng nhiều người quen đọc tin tức và tiểu thuyết trên mạng. Có người lo sách giấy sẽ vì thế mà biến mất, nhưng thực tế nhiều độc giả vẫn thích cầm một cuốn sách thật, tận hưởng cảm giác đặc biệt khi lật trang.","qs":[["越来越多的人习惯在哪里阅读？","Ngày càng nhiều người quen đọc ở đâu?",["网上","图书馆","书店"]],["很多读者为什么仍然喜欢纸质书？","Vì sao nhiều độc giả vẫn thích sách giấy?",["享受翻页的感觉","纸质书更便宜","网上书太少"]]]},{"l":5,"s":0,"k":"Hội thoại","t":"女：你这个项目的方案改了好几次了，还没定下来吗？男：客户的要求一直在变，我们只好不断调整。女：那你得跟他们好好沟通一下，把需求确定下来。男：你说得对，明天我就约他们开个会。","vi":"Nữ: Phương án dự án của anh sửa mấy lần rồi mà vẫn chưa chốt à? Nam: Yêu cầu của khách hàng cứ thay đổi, chúng tôi đành phải liên tục điều chỉnh. Nữ: Vậy anh phải trao đổi kỹ với họ, chốt lại yêu cầu. Nam: Chị nói đúng, mai tôi sẽ hẹn họ họp.","qs":[["方案为什么改了好几次？","Vì sao phương án sửa nhiều lần?",["客户的要求一直在变","同事不认真","经理不满意"]],["男的打算怎么做？","Người nam định làm gì?",["约客户开会沟通","放弃项目","换一个方案"]]]},{"l":5,"s":0,"k":"Đoạn văn","t":"中国有句俗话叫“三人行，必有我师”，意思是几个人在一起，其中一定有值得我学习的人。这句话告诉我们，要虚心向别人学习，每个人身上都有自己的长处。","vi":"Trung Quốc có câu “ba người cùng đi, ắt có thầy ta”, ý là vài người ở cùng nhau thì nhất định có người đáng để ta học hỏi. Câu này dạy chúng ta khiêm tốn học hỏi người khác, ai cũng có điểm mạnh riêng.","qs":[["“三人行，必有我师”是什么意思？","Câu “ba người cùng đi, ắt có thầy ta” nghĩa là gì?",["几个人中一定有值得学习的人","三个人一起走路","老师很多"]],["这句话告诉我们要怎么做？","Câu này dạy chúng ta làm gì?",["虚心向别人学习","多交朋友","少说话"]]]},{"l":5,"s":0,"k":"Hội thoại","t":"男：听说你们小区最近在搞垃圾分类？女：对，每家要把垃圾分成四类，扔错了还会被提醒。男：刚开始会不会很麻烦？女：习惯了就好了，而且对环境确实有好处。","vi":"Nam: Nghe nói khu nhà bạn dạo này đang phân loại rác? Nữ: Đúng, mỗi nhà phải chia rác thành bốn loại, bỏ sai còn bị nhắc. Nam: Lúc đầu có phiền không? Nữ: Quen rồi thì không sao, mà thật sự tốt cho môi trường.","qs":[["小区最近在搞什么？","Khu nhà dạo này đang làm gì?",["垃圾分类","打扫卫生","种树"]],["女的觉得垃圾分类怎么样？","Người nữ thấy phân loại rác thế nào?",["习惯了就好，对环境有好处","太麻烦了","没有用"]]]},{"l":5,"s":0,"k":"Đoạn văn","t":"很多人在面对困难时，第一反应是抱怨。可是抱怨并不能解决问题，反而会让人越来越消极。与其抱怨，不如冷静下来分析原因，寻找解决的办法。","vi":"Nhiều người khi gặp khó khăn, phản ứng đầu tiên là than phiền. Nhưng than phiền không giải quyết được vấn đề, ngược lại còn khiến người ta ngày càng tiêu cực. Thay vì than phiền, chi bằng bình tĩnh phân tích nguyên nhân, tìm cách giải quyết.","qs":[["很多人面对困难时第一反应是什么？","Phản ứng đầu tiên của nhiều người khi gặp khó là gì?",["抱怨","放弃","求助"]],["作者建议面对困难时怎么做？","Tác giả khuyên gặp khó nên làm gì?",["冷静分析原因，寻找办法","大哭一场","请别人帮忙"]]]},{"l":5,"s":1,"k":"Hội thoại","t":"女：恭喜你，听说你升职了！男：谢谢，不过压力也更大了，要管理一个十几个人的团队。女：你能力强，一定没问题的。男：希望如此吧，我会尽力的。","vi":"Nữ: Chúc mừng anh, nghe nói anh được thăng chức! Nam: Cảm ơn, nhưng áp lực cũng lớn hơn, phải quản lý một đội hơn mười người. Nữ: Anh có năng lực, chắc chắn không sao. Nam: Mong là vậy, tôi sẽ cố hết sức.","qs":[["男的最近有什么变化？","Người nam gần đây có thay đổi gì?",["升职了","换工作了","结婚了"]],["男的现在要管理多少人？","Người nam giờ phải quản lý bao nhiêu người?",["十几个人","几个人","一百多人"]]]},{"l":5,"s":1,"k":"Đoạn văn","t":"熊猫是中国的国宝，它们主要生活在四川的山区，以竹子为主要食物。由于栖息地减少，熊猫的数量曾经一度下降。经过多年的保护，现在野生熊猫的数量已经有所增加。","vi":"Gấu trúc là quốc bảo của Trung Quốc, sống chủ yếu ở vùng núi Tứ Xuyên, thức ăn chính là tre. Do môi trường sống bị thu hẹp, số lượng gấu trúc từng có thời giảm sút. Qua nhiều năm bảo tồn, số gấu trúc hoang dã nay đã tăng lên.","qs":[["熊猫主要吃什么？","Gấu trúc chủ yếu ăn gì?",["竹子","水果","鱼"]],["现在野生熊猫的数量怎么样？","Số gấu trúc hoang dã hiện nay thế nào?",["有所增加","继续下降","没有变化"]]]},{"l":5,"s":1,"k":"Hội thoại","t":"男：这次旅行你为什么选择坐火车，不坐飞机？女：坐火车可以一路看风景，而且高铁也很快。男：价格呢？女：比飞机便宜一些，还不用提前那么早去机场。","vi":"Nam: Chuyến này sao bạn chọn đi tàu chứ không đi máy bay? Nữ: Đi tàu được ngắm cảnh suốt đường, tàu cao tốc cũng rất nhanh. Nam: Còn giá? Nữ: Rẻ hơn máy bay một chút, lại không phải ra sân bay sớm như vậy.","qs":[["女的为什么选择坐火车？","Vì sao người nữ chọn đi tàu?",["可以看风景，高铁也快","飞机票卖完了","她怕坐飞机"]],["坐火车有什么好处？","Đi tàu có lợi gì?",["比飞机便宜，不用早去机场","更舒服","更安全"]]]},{"l":5,"s":1,"k":"Đoạn văn","t":"有一个年轻人去拜访一位著名的画家，问他怎样才能画得好。画家没有回答，只是拿出一个旧箱子，里面装满了他年轻时画的几千张草图。年轻人终于明白：成功没有捷径，只有不断练习。","vi":"Một chàng trai đến thăm một họa sĩ nổi tiếng, hỏi làm sao để vẽ đẹp. Họa sĩ không trả lời, chỉ lấy ra một chiếc rương cũ đựng đầy mấy nghìn bản phác thảo ông vẽ hồi trẻ. Chàng trai cuối cùng hiểu ra: thành công không có đường tắt, chỉ có luyện tập không ngừng.","qs":[["画家拿出了什么？","Họa sĩ lấy ra thứ gì?",["装满草图的旧箱子","一幅名画","一支笔"]],["年轻人明白了什么？","Chàng trai hiểu ra điều gì?",["成功没有捷径，只有不断练习","画画很难","画家很有钱"]]]},{"l":5,"s":1,"k":"Hội thoại","t":"女：你看起来很累，昨晚又加班了？男：是啊，最近公司在赶一个重要的项目。女：再忙也要注意身体，别把自己累坏了。男：知道了，项目结束后我打算好好休个假。","vi":"Nữ: Trông anh mệt quá, tối qua lại tăng ca à? Nam: Ừ, dạo này công ty đang gấp rút một dự án quan trọng. Nữ: Bận mấy cũng phải giữ sức khỏe, đừng để kiệt sức. Nam: Biết rồi, xong dự án tôi định nghỉ phép thật đã.","qs":[["男的为什么很累？","Vì sao người nam mệt?",["昨晚加班了","生病了","没睡好觉"]],["项目结束后男的打算做什么？","Xong dự án người nam định làm gì?",["好好休个假","换工作","出国留学"]]]},{"l":5,"s":2,"k":"Đoạn văn","t":"在中国，茶不仅是一种饮料，更是一种文化。人们喝茶讲究茶叶的品种、水的温度和泡茶的时间。招待客人时，主人通常会先倒一杯茶，表示对客人的尊重和欢迎。","vi":"Ở Trung Quốc, trà không chỉ là đồ uống mà còn là một nền văn hóa. Người ta uống trà chú trọng loại lá trà, nhiệt độ nước và thời gian pha. Khi tiếp khách, chủ nhà thường rót một chén trà trước, thể hiện sự tôn trọng và chào đón.","qs":[["在中国，茶是什么？","Ở Trung Quốc, trà là gì?",["一种饮料，更是一种文化","一种药","一种食物"]],["主人先给客人倒茶表示什么？","Chủ nhà rót trà trước để thể hiện gì?",["尊重和欢迎","希望客人早走","自己很口渴"]]]},{"l":5,"s":2,"k":"Hội thoại","t":"男：你觉得在大城市工作好，还是回老家工作好？女：大城市机会多，收入也高，但是生活压力大。男：老家呢？女：生活节奏慢，离父母近，不过发展机会比较少。","vi":"Nam: Bạn thấy làm ở thành phố lớn tốt hay về quê làm tốt? Nữ: Thành phố lớn nhiều cơ hội, thu nhập cao, nhưng áp lực cuộc sống lớn. Nam: Còn quê? Nữ: Nhịp sống chậm, gần bố mẹ, nhưng ít cơ hội phát triển.","qs":[["女的认为大城市有什么好处？","Người nữ cho rằng thành phố lớn có lợi gì?",["机会多，收入高","生活节奏慢","离父母近"]],["回老家工作的缺点是什么？","Về quê làm việc có nhược điểm gì?",["发展机会比较少","压力太大","收入太高"]]]},{"l":5,"s":2,"k":"Đoạn văn","t":"研究发现，经常笑的人比不爱笑的人更健康。笑可以减轻压力，增强免疫力，还能让人与人之间的关系更加融洽。所以有人说：“笑一笑，十年少。”","vi":"Nghiên cứu phát hiện người hay cười khỏe mạnh hơn người ít cười. Cười giúp giảm căng thẳng, tăng sức đề kháng, còn khiến quan hệ giữa người với người hòa hợp hơn. Vì vậy có người nói: “Một nụ cười bằng mười thang thuốc bổ.”","qs":[["笑有什么好处？","Cười có lợi gì?",["减轻压力，增强免疫力","让人变瘦","让人更聪明"]],["“笑一笑，十年少”是什么意思？","Câu “cười một cái, trẻ mười tuổi” nghĩa là gì?",["常笑让人显得年轻","笑十年","少笑一点"]]]},{"l":5,"s":2,"k":"Hội thoại","t":"女：你的论文写得怎么样了？男：资料基本收集完了，就是还没想好结论怎么写。女：可以先列个提纲，把主要观点理清楚。男：好主意，我今晚就试试。","vi":"Nữ: Luận văn của bạn viết đến đâu rồi? Nam: Tư liệu cơ bản thu thập xong, chỉ chưa nghĩ ra viết kết luận thế nào. Nữ: Có thể lập dàn ý trước, sắp xếp rõ các luận điểm chính. Nam: Ý hay, tối nay mình thử luôn.","qs":[["男的论文进展到哪一步了？","Luận văn của người nam đến bước nào?",["资料收集完了，结论还没想好","已经写完了","还没开始"]],["女的建议怎么做？","Người nữ đề nghị làm gì?",["先列个提纲","换个题目","问老师"]]]},{"l":5,"s":2,"k":"Đoạn văn","t":"过去，人们出门要带很多现金。如今，在中国的很多城市，买东西、坐车、吃饭都可以用手机支付，很多人出门甚至不带钱包。不过，一些老年人还不太习惯这种新方式。","vi":"Trước đây ra ngoài phải mang nhiều tiền mặt. Ngày nay ở nhiều thành phố Trung Quốc, mua đồ, đi xe, ăn uống đều có thể thanh toán bằng điện thoại, nhiều người ra đường thậm chí không mang ví. Tuy nhiên một số người cao tuổi vẫn chưa quen cách này.","qs":[["如今在中国很多城市人们怎么付钱？","Ngày nay ở nhiều thành phố người ta trả tiền thế nào?",["用手机支付","只用现金","用信用卡"]],["哪些人还不太习惯手机支付？","Ai vẫn chưa quen thanh toán bằng điện thoại?",["一些老年人","年轻人","学生"]]]},{"l":5,"s":3,"k":"Hội thoại","t":"男：这次的志愿者活动你参加吗？女：参加，我们要去山区给孩子们上课。男：你准备教什么？女：我打算教他们画画，让他们知道山外面的世界有多美。","vi":"Nam: Hoạt động tình nguyện lần này bạn có tham gia không? Nữ: Có, chúng mình lên vùng núi dạy học cho trẻ em. Nam: Bạn định dạy gì? Nữ: Mình định dạy các em vẽ, để các em biết thế giới ngoài núi đẹp thế nào.","qs":[["志愿者活动是去做什么？","Hoạt động tình nguyện là đi làm gì?",["给山区孩子上课","打扫公园","种树"]],["女的打算教孩子们什么？","Người nữ định dạy các em gì?",["画画","唱歌","数学"]]]},{"l":5,"s":3,"k":"Đoạn văn","t":"一个人的性格在很大程度上影响着他的命运。乐观的人遇到挫折时，会把它看成是成长的机会；而悲观的人则容易被困难打倒。因此，培养积极的心态非常重要。","vi":"Tính cách của một người ảnh hưởng rất lớn đến số phận của họ. Người lạc quan gặp thất bại sẽ coi đó là cơ hội trưởng thành; còn người bi quan dễ bị khó khăn quật ngã. Vì vậy, rèn luyện tâm thái tích cực rất quan trọng.","qs":[["乐观的人怎么看挫折？","Người lạc quan nhìn thất bại thế nào?",["看成是成长的机会","看成是失败","不在乎"]],["作者认为什么非常重要？","Tác giả cho rằng điều gì rất quan trọng?",["培养积极的心态","赚很多钱","有很多朋友"]]]},{"l":5,"s":3,"k":"Hội thoại","t":"女：这家公司的待遇不错，你为什么不去？男：工资是挺高，但是每天上下班要花三个小时。女：那确实太辛苦了。男：我宁愿少拿一点儿钱，也想多点儿时间陪家人。","vi":"Nữ: Công ty này đãi ngộ tốt, sao anh không đến? Nam: Lương thì cao, nhưng mỗi ngày đi về mất ba tiếng. Nữ: Thế thì vất vả thật. Nam: Tôi thà nhận ít tiền hơn một chút, để có thêm thời gian ở bên gia đình.","qs":[["男的为什么不去那家公司？","Vì sao người nam không đến công ty đó?",["上下班时间太长","工资太低","工作太难"]],["男的更看重什么？","Người nam coi trọng điều gì hơn?",["多点儿时间陪家人","高工资","好的职位"]]]},{"l":5,"s":3,"k":"Hội thoại","t":"男：我想学一门乐器，你觉得学什么好？女：你可以试试吉他，入门比较容易，也方便携带。男：钢琴呢？女：钢琴也不错，但是价格贵，而且需要更多的时间练习。","vi":"Nam: Mình muốn học một nhạc cụ, bạn thấy học gì hay? Nữ: Bạn thử guitar xem, nhập môn tương đối dễ, lại tiện mang theo. Nam: Còn piano? Nữ: Piano cũng hay, nhưng giá đắt, lại cần nhiều thời gian luyện tập hơn.","qs":[["女的为什么推荐吉他？","Vì sao người nữ gợi ý guitar?",["入门容易，方便携带","声音好听","很便宜"]],["学钢琴有什么缺点？","Học piano có nhược điểm gì?",["价格贵，需要更多时间练习","太难听","不能带走"]]]},{"l":5,"s":4,"k":"Đoạn văn","t":"互联网的发展改变了人们的工作方式。越来越多的公司允许员工在家办公，这样不仅节省了通勤时间，也让员工可以更灵活地安排生活。但也有人反映，在家工作很难把工作和生活分开。","vi":"Sự phát triển của Internet đã thay đổi cách làm việc của con người. Ngày càng nhiều công ty cho phép nhân viên làm việc tại nhà, vừa tiết kiệm thời gian đi lại, vừa giúp nhân viên sắp xếp cuộc sống linh hoạt hơn. Nhưng cũng có người cho biết làm việc ở nhà khó tách bạch công việc và cuộc sống.","qs":[["在家办公有什么好处？","Làm việc tại nhà có lợi gì?",["节省通勤时间，安排更灵活","工资更高","不用工作"]],["有人反映在家工作有什么问题？","Có người phản ánh làm ở nhà có vấn đề gì?",["很难把工作和生活分开","网络不好","太安静"]]]},{"l":5,"s":4,"k":"Hội thoại","t":"女：你听说了吗？咱们公司打算在越南开分公司。男：真的？那需要会汉语和越南语的人啊。女：对，我觉得这是你的好机会。男：我得好好准备一下，争取被派过去。","vi":"Nữ: Anh nghe chưa? Công ty mình định mở chi nhánh ở Việt Nam. Nam: Thật à? Vậy cần người biết cả tiếng Trung và tiếng Việt. Nữ: Đúng, tôi nghĩ đây là cơ hội tốt của anh. Nam: Tôi phải chuẩn bị kỹ, cố gắng được cử sang.","qs":[["公司打算做什么？","Công ty định làm gì?",["在越南开分公司","裁员","搬家"]],["男的打算怎么做？","Người nam định làm gì?",["好好准备，争取被派过去","辞职","学英语"]]]},{"l":5,"s":4,"k":"Đoạn văn","t":"古代有个人叫匡衡，家里很穷，买不起蜡烛。为了晚上读书，他在墙上凿了一个小洞，借邻居家的灯光读书。后来他成了很有学问的人。这就是成语“凿壁偷光”的故事。","vi":"Thời xưa có một người tên Khuông Hành, nhà rất nghèo, không mua nổi nến. Để đọc sách ban đêm, ông đục một lỗ nhỏ trên tường, mượn ánh đèn nhà hàng xóm để đọc. Về sau ông trở thành người rất uyên bác. Đó là điển tích thành ngữ “đục vách mượn ánh sáng”.","qs":[["匡衡为什么在墙上凿洞？","Vì sao Khuông Hành đục lỗ trên tường?",["借邻居家的灯光读书","看邻居在做什么","让房间通风"]],["“凿壁偷光”说明了什么？","Điển tích này nói lên điều gì?",["刻苦学习的精神","偷东西不好","邻居很有钱"]]]},{"l":5,"s":4,"k":"Hội thoại","t":"男：最近空气质量太差了，出门都要戴口罩。女：是啊，听说跟附近的几家工厂有关。男：政府应该采取措施了。女：已经在处理了，有两家工厂被要求停产整改。","vi":"Nam: Dạo này chất lượng không khí kém quá, ra đường phải đeo khẩu trang. Nữ: Ừ, nghe nói liên quan đến mấy nhà máy gần đây. Nam: Chính quyền nên có biện pháp rồi. Nữ: Đang xử lý rồi, có hai nhà máy bị yêu cầu dừng sản xuất để chấn chỉnh.","qs":[["最近出门为什么要戴口罩？","Vì sao dạo này ra đường phải đeo khẩu trang?",["空气质量太差","天气太冷","流行感冒"]],["政府采取了什么措施？","Chính quyền đã có biện pháp gì?",["要求两家工厂停产整改","关闭所有工厂","让大家在家"]]]},{"l":5,"s":4,"k":"Đoạn văn","t":"很多人喜欢在睡前看手机，但专家指出，手机屏幕发出的蓝光会影响大脑分泌帮助睡眠的物质，使人难以入睡。建议睡前一个小时放下手机，可以看看书或听听轻音乐。","vi":"Nhiều người thích xem điện thoại trước khi ngủ, nhưng chuyên gia chỉ ra ánh sáng xanh từ màn hình ảnh hưởng đến việc não tiết ra chất giúp ngủ, khiến khó ngủ. Nên bỏ điện thoại xuống một tiếng trước khi ngủ, có thể đọc sách hoặc nghe nhạc nhẹ.","qs":[["睡前看手机有什么问题？","Xem điện thoại trước khi ngủ có vấn đề gì?",["蓝光让人难以入睡","浪费电","伤害手指"]],["专家建议睡前做什么？","Chuyên gia khuyên làm gì trước khi ngủ?",["看书或听轻音乐","玩游戏","喝咖啡"]]]},{"l":5,"s":5,"k":"Hội thoại","t":"女：你们这次谈判怎么样？男：对方要求降价百分之十，我们最多只能降五个点。女：那最后结果呢？男：双方各让一步，最后定在百分之七。","vi":"Nữ: Cuộc đàm phán lần này thế nào? Nam: Đối phương đòi giảm giá mười phần trăm, chúng tôi tối đa chỉ giảm được năm phần trăm. Nữ: Thế kết quả cuối cùng? Nam: Hai bên mỗi bên nhường một bước, chốt ở bảy phần trăm.","qs":[["对方一开始要求降价多少？","Ban đầu đối phương đòi giảm bao nhiêu?",["百分之十","百分之五","百分之七"]],["最后结果是什么？","Kết quả cuối cùng là gì?",["双方各让一步，定在百分之七","谈判失败","降价百分之十"]]]},{"l":5,"s":5,"k":"Đoạn văn","t":"在快节奏的现代生活中，越来越多的人开始重视“慢生活”。他们不再一味追求速度和效率，而是学会放慢脚步，花时间陪伴家人、欣赏自然、做自己喜欢的事情。","vi":"Trong cuộc sống hiện đại nhịp độ nhanh, ngày càng nhiều người coi trọng “sống chậm”. Họ không còn chỉ chạy theo tốc độ và hiệu suất, mà học cách chậm lại, dành thời gian bên gia đình, thưởng thức thiên nhiên, làm điều mình thích.","qs":[["“慢生活”的人重视什么？","Người “sống chậm” coi trọng điều gì?",["陪伴家人、欣赏自然","赚更多钱","工作更快"]],["他们不再一味追求什么？","Họ không còn chỉ chạy theo điều gì?",["速度和效率","健康","快乐"]]]},{"l":5,"s":5,"k":"Hội thoại","t":"男：你为什么喜欢一个人旅行？女：一个人旅行很自由，想去哪儿就去哪儿，而且会遇到很多有意思的人。男：不担心安全问题吗？女：只要提前做好准备，注意安全，一般没什么问题。","vi":"Nam: Sao bạn thích đi du lịch một mình? Nữ: Đi một mình rất tự do, muốn đi đâu thì đi, lại gặp được nhiều người thú vị. Nam: Không lo chuyện an toàn sao? Nữ: Chỉ cần chuẩn bị trước, chú ý an toàn thì thường không có vấn đề gì.","qs":[["女的为什么喜欢一个人旅行？","Vì sao người nữ thích đi một mình?",["自由，能遇到有意思的人","省钱","没有朋友"]],["女的怎么看安全问题？","Người nữ nhìn vấn đề an toàn thế nào?",["提前准备、注意安全就没问题","非常危险","从来不考虑"]]]},{"l":5,"s":5,"k":"Đoạn văn","t":"一项调查显示，超过百分之六十的大学生在毕业后选择的工作与所学专业不完全对口。专家认为，这并不一定是坏事，大学教育最重要的是培养学习能力和思考能力。","vi":"Một khảo sát cho thấy hơn sáu mươi phần trăm sinh viên sau khi tốt nghiệp chọn công việc không hoàn toàn đúng chuyên ngành. Chuyên gia cho rằng điều này chưa chắc là xấu, quan trọng nhất của giáo dục đại học là rèn năng lực học tập và tư duy.","qs":[["调查显示了什么？","Khảo sát cho thấy điều gì?",["超过60%的毕业生工作和专业不完全对口","大学生找不到工作","大学生都想读研"]],["专家认为大学教育最重要的是什么？","Chuyên gia cho rằng điều quan trọng nhất của đại học là gì?",["培养学习能力和思考能力","找好工作","学好专业知识"]]]},{"l":5,"s":5,"k":"Hội thoại","t":"女：这件衣服质量这么差，才穿了一次就破了。男：你可以去商场退货。女：我已经把小票扔了。男：没关系，你有付款记录也可以，去试试吧。","vi":"Nữ: Cái áo này chất lượng tệ quá, mới mặc một lần đã rách. Nam: Bạn có thể ra trung tâm thương mại trả hàng. Nữ: Mình vứt hóa đơn rồi. Nam: Không sao, có lịch sử thanh toán cũng được, cứ thử đi.","qs":[["衣服有什么问题？","Cái áo có vấn đề gì?",["穿了一次就破了","颜色不好看","太大了"]],["男的建议怎么做？","Người nam đề nghị làm gì?",["凭付款记录去退货","再买一件","自己缝一下"]]]},{"l":5,"s":6,"k":"Hội thoại","t":"男：你觉得人工智能会取代人类的工作吗？女：一些重复性的工作可能会被取代，但需要创造力和情感的工作很难被取代。男：那我们应该怎么办？女：不断学习新技能，提高自己的竞争力。","vi":"Nam: Bạn nghĩ trí tuệ nhân tạo có thay thế công việc của con người không? Nữ: Một số công việc lặp lại có thể bị thay thế, nhưng công việc cần sáng tạo và cảm xúc thì khó thay. Nam: Vậy chúng ta nên làm gì? Nữ: Không ngừng học kỹ năng mới, nâng cao năng lực cạnh tranh.","qs":[["女的认为哪些工作很难被取代？","Người nữ cho rằng công việc nào khó bị thay thế?",["需要创造力和情感的工作","重复性工作","所有工作"]],["女的建议怎么应对？","Người nữ khuyên ứng phó thế nào?",["不断学习新技能","换工作","什么都不做"]]]},{"l":5,"s":6,"k":"Đoạn văn","t":"俗话说：“台上一分钟，台下十年功。”这句话的意思是，演员在舞台上精彩的表演，背后是多年的辛苦练习。其实，不仅是演员，做任何事情想要成功，都需要付出长期的努力。","vi":"Tục ngữ nói: “Một phút trên sân khấu, mười năm công dưới sân khấu.” Nghĩa là màn trình diễn đặc sắc của diễn viên là kết quả của nhiều năm khổ luyện. Thật ra không chỉ diễn viên, làm việc gì muốn thành công cũng cần nỗ lực lâu dài.","qs":[["“台上一分钟，台下十年功”是什么意思？","Câu tục ngữ này nghĩa là gì?",["精彩表演背后是多年练习","演出只有一分钟","演员要工作十年"]],["作者认为想成功需要什么？","Tác giả cho rằng muốn thành công cần gì?",["长期的努力","运气","天赋"]]]},{"l":5,"s":6,"k":"Đoạn văn","t":"越来越多的城市开始建设“海绵城市”。所谓海绵城市，就是让城市像海绵一样，下雨时能吸收和储存雨水，需要时再把水释放出来。这样既可以减少城市内涝，又能节约水资源。","vi":"Ngày càng nhiều thành phố xây dựng “thành phố bọt biển”. Thành phố bọt biển là thành phố giống miếng bọt biển, khi mưa có thể hấp thụ và trữ nước mưa, khi cần lại giải phóng ra. Như vậy vừa giảm ngập úng đô thị, vừa tiết kiệm tài nguyên nước.","qs":[["什么是海绵城市？","Thành phố bọt biển là gì?",["能像海绵一样吸收和储存雨水的城市","海边的城市","很软的城市"]],["海绵城市有什么好处？","Thành phố bọt biển có lợi gì?",["减少内涝，节约水资源","吸引游客","降低房价"]]]},{"l":5,"s":7,"k":"Hội thoại","t":"男：你为什么决定辞掉稳定的工作去创业？女：我一直有个梦想，想开一家自己的设计工作室。男：不怕失败吗？女：怕，但如果不试一试，我会后悔一辈子。","vi":"Nam: Sao bạn quyết định bỏ công việc ổn định để khởi nghiệp? Nữ: Mình luôn có một ước mơ, muốn mở một studio thiết kế của riêng mình. Nam: Không sợ thất bại sao? Nữ: Sợ chứ, nhưng nếu không thử, mình sẽ hối hận cả đời.","qs":[["女的为什么去创业？","Vì sao người nữ khởi nghiệp?",["想实现开设计工作室的梦想","工资太低","被公司辞退"]],["女的怎么看待失败？","Người nữ nhìn nhận thất bại thế nào?",["怕，但不试会后悔一辈子","一点儿也不怕","一定会成功"]]]},{"l":5,"s":7,"k":"Hội thoại","t":"女：你最近在读什么书？男：一本关于时间管理的书，讲怎么把重要的事情放在第一位。女：有用吗？男：很有用，我现在每天早上先列出三件最重要的事，效率提高了不少。","vi":"Nữ: Dạo này bạn đọc sách gì? Nam: Một cuốn về quản lý thời gian, nói cách đặt việc quan trọng lên hàng đầu. Nữ: Có ích không? Nam: Rất có ích, giờ mỗi sáng mình liệt kê trước ba việc quan trọng nhất, hiệu suất tăng lên đáng kể.","qs":[["男的在读什么书？","Người nam đang đọc sách gì?",["关于时间管理的书","小说","历史书"]],["男的现在每天早上做什么？","Mỗi sáng người nam làm gì?",["列出三件最重要的事","跑步","读书"]]]},{"l":5,"s":7,"k":"Đoạn văn","t":"随着人口老龄化，养老问题越来越受到社会的关注。除了政府提供的养老服务，很多社区也开始组织志愿者定期看望独居老人，陪他们聊天、帮他们做家务，让老人感受到温暖。","vi":"Cùng với già hóa dân số, vấn đề dưỡng lão ngày càng được xã hội quan tâm. Ngoài dịch vụ dưỡng lão của nhà nước, nhiều khu dân cư bắt đầu tổ chức tình nguyện viên thường xuyên thăm người già sống một mình, trò chuyện, giúp việc nhà, để các cụ cảm nhận được sự ấm áp.","qs":[["什么问题越来越受到关注？","Vấn đề gì ngày càng được quan tâm?",["养老问题","教育问题","交通问题"]],["社区志愿者为独居老人做什么？","Tình nguyện viên làm gì cho người già sống một mình?",["陪聊天、帮做家务","送钱","带他们旅游"]]]},{"l":5,"s":7,"k":"Hội thoại","t":"男：明天的演讲你紧张吗？女：有一点儿。我已经练习了很多遍，就怕到时候忘词。男：别担心，把要点写在卡片上，忘了就看一眼。女：好主意，谢谢你！","vi":"Nam: Bài thuyết trình ngày mai bạn có hồi hộp không? Nữ: Hơi hơi. Mình luyện nhiều lần rồi, chỉ sợ lúc đó quên lời. Nam: Đừng lo, ghi ý chính lên thẻ, quên thì liếc qua. Nữ: Ý hay đấy, cảm ơn bạn!","qs":[["女的担心什么？","Người nữ lo điều gì?",["忘词","迟到","没人听"]],["男的给了什么建议？","Người nam gợi ý gì?",["把要点写在卡片上","多喝水","不去演讲"]]]},{"l":6,"s":0,"k":"Đoạn văn","t":"在信息爆炸的时代，我们每天都会接收大量信息，但真正有价值的却并不多。学会筛选信息、独立思考，比盲目地接受一切更加重要。否则，我们很容易被虚假信息误导。","vi":"Trong thời đại bùng nổ thông tin, mỗi ngày ta tiếp nhận vô số thông tin, nhưng thứ thật sự có giá trị không nhiều. Biết sàng lọc thông tin, tư duy độc lập quan trọng hơn tiếp nhận mù quáng mọi thứ. Nếu không, ta rất dễ bị tin giả dẫn dắt.","qs":[["在信息爆炸的时代，什么更加重要？","Trong thời đại bùng nổ thông tin, điều gì quan trọng hơn?",["学会筛选信息、独立思考","接收更多信息","相信所有消息"]],["不会筛选信息容易怎么样？","Không biết sàng lọc thông tin dễ bị gì?",["被虚假信息误导","变得更聪明","节省时间"]]]},{"l":6,"s":0,"k":"Hội thoại","t":"女：这次合作方案，对方提出要提前付款，你怎么看？男：风险太大了。我建议先付百分之三十的定金，剩下的按交货进度支付。女：他们会同意吗？男：可以试着谈判，毕竟这是行业惯例。","vi":"Nữ: Phương án hợp tác lần này, phía đối tác yêu cầu thanh toán trước, anh thấy sao? Nam: Rủi ro quá lớn. Tôi đề nghị đặt cọc trước ba mươi phần trăm, phần còn lại trả theo tiến độ giao hàng. Nữ: Họ có đồng ý không? Nam: Có thể thử đàm phán, dù sao đây cũng là thông lệ ngành.","qs":[["男的建议怎么付款？","Người nam đề nghị thanh toán thế nào?",["先付三成定金，按交货进度付余款","一次性全部付款","交货后再付全部"]],["男的认为提前付款怎么样？","Người nam thấy thanh toán trước thế nào?",["风险太大","很合理","无所谓"]]]},{"l":6,"s":0,"k":"Đoạn văn","t":"古人云：“授人以鱼，不如授人以渔。”与其直接给别人鱼，不如教他捕鱼的方法。这句话常被用在教育上，意思是培养学生解决问题的能力，比直接告诉他们答案更有意义。","vi":"Người xưa nói: “Cho cá không bằng dạy cách câu cá.” Thay vì đưa cá cho người khác, chi bằng dạy họ cách bắt cá. Câu này thường dùng trong giáo dục, nghĩa là rèn năng lực giải quyết vấn đề cho học sinh có ý nghĩa hơn nói thẳng đáp án.","qs":[["“授人以鱼，不如授人以渔”是什么意思？","Câu “cho cá không bằng dạy câu cá” nghĩa là gì?",["教方法比直接给东西更有用","要多吃鱼","钓鱼很难"]],["这句话在教育上指什么？","Trong giáo dục câu này chỉ điều gì?",["培养解决问题的能力","让学生背答案","多做练习"]]]},{"l":6,"s":0,"k":"Hội thoại","t":"男：你们公司为什么这么重视员工培训？女：行业变化太快了，员工如果不持续学习，很快就会被淘汰。男：培训费用不低吧？女：从长远来看，这是一种投资，员工能力提高了，公司的效益自然会提升。","vi":"Nam: Sao công ty bạn coi trọng đào tạo nhân viên vậy? Nữ: Ngành thay đổi quá nhanh, nhân viên không học liên tục sẽ sớm bị đào thải. Nam: Chi phí đào tạo không thấp nhỉ? Nữ: Về lâu dài đây là một khoản đầu tư, năng lực nhân viên tăng thì hiệu quả công ty tự nhiên tăng.","qs":[["公司为什么重视员工培训？","Vì sao công ty coi trọng đào tạo?",["行业变化快，员工需要持续学习","政府要求","培训很便宜"]],["女的怎么看培训费用？","Người nữ nhìn chi phí đào tạo thế nào?",["是一种长远的投资","太浪费钱","应该员工自己出"]]]},{"l":6,"s":0,"k":"Đoạn văn","t":"失败并不可怕，可怕的是失败以后不去反思。很多成功的人都经历过无数次失败，但他们每次都会总结经验教训，避免重复同样的错误。正如俗话所说：“吃一堑，长一智。”","vi":"Thất bại không đáng sợ, đáng sợ là thất bại rồi không chịu suy ngẫm. Nhiều người thành công đã trải qua vô số thất bại, nhưng lần nào họ cũng rút kinh nghiệm, tránh lặp lại sai lầm. Đúng như tục ngữ: “Ngã một lần, khôn một chút.”","qs":[["作者认为什么最可怕？","Tác giả cho rằng điều gì đáng sợ nhất?",["失败以后不去反思","经历失败","成功太快"]],["“吃一堑，长一智”是什么意思？","Câu “ăn một vố, khôn một chút” nghĩa là gì?",["受一次挫折，长一分见识","多吃东西会变聪明","失败一次就放弃"]]]},{"l":6,"s":1,"k":"Hội thoại","t":"女：你这次出差去了哪几个城市？男：上海、杭州和苏州，主要是考察那边的市场。女：有什么收获吗？男：发现南方的消费者更注重产品的设计和品牌，我们得调整营销策略了。","vi":"Nữ: Chuyến công tác này anh đi những thành phố nào? Nam: Thượng Hải, Hàng Châu và Tô Châu, chủ yếu khảo sát thị trường ở đó. Nữ: Có thu hoạch gì không? Nam: Phát hiện người tiêu dùng miền Nam chú trọng thiết kế và thương hiệu hơn, chúng ta phải điều chỉnh chiến lược marketing.","qs":[["男的出差的主要目的是什么？","Mục đích chính chuyến công tác là gì?",["考察市场","旅游","参加会议"]],["男的发现南方消费者更注重什么？","Người tiêu dùng miền Nam chú trọng gì hơn?",["产品设计和品牌","价格","数量"]]]},{"l":6,"s":1,"k":"Đoạn văn","t":"中医认为，人体是一个有机的整体，疾病的产生与生活习惯、情绪变化都有密切关系。因此，中医治病不仅针对症状，更注重调理身体的平衡，达到“治本”的目的。","vi":"Đông y cho rằng cơ thể là một chỉnh thể hữu cơ, bệnh tật sinh ra liên quan mật thiết đến thói quen sinh hoạt và biến đổi cảm xúc. Vì vậy Đông y chữa bệnh không chỉ nhắm vào triệu chứng, mà chú trọng điều hòa cân bằng cơ thể, đạt mục đích “trị tận gốc”.","qs":[["中医认为疾病的产生和什么有关？","Đông y cho rằng bệnh sinh ra liên quan đến gì?",["生活习惯和情绪变化","只和天气有关","只和年龄有关"]],["中医治病更注重什么？","Đông y chữa bệnh chú trọng điều gì hơn?",["调理身体的平衡","只治症状","做手术"]]]},{"l":6,"s":1,"k":"Hội thoại","t":"男：最近房价又涨了，你还打算买房吗？女：我在犹豫，买的话压力很大，租房又觉得不稳定。男：其实租房也有好处，比较灵活，可以根据工作换地方。女：你说得也有道理，我再考虑考虑。","vi":"Nam: Dạo này giá nhà lại tăng, bạn còn định mua nhà không? Nữ: Mình đang phân vân, mua thì áp lực lớn, thuê lại thấy không ổn định. Nam: Thật ra thuê nhà cũng có cái lợi, linh hoạt hơn, có thể đổi chỗ theo công việc. Nữ: Bạn nói cũng có lý, để mình cân nhắc thêm.","qs":[["女的为什么犹豫？","Vì sao người nữ phân vân?",["买房压力大，租房不稳定","不喜欢那个城市","没有时间"]],["男的认为租房有什么好处？","Người nam cho rằng thuê nhà có lợi gì?",["比较灵活","更便宜","更舒服"]]]},{"l":6,"s":1,"k":"Đoạn văn","t":"据统计，全世界每年浪费的粮食约占粮食总产量的三分之一。与此同时，仍有许多人吃不饱饭。节约粮食不仅是个人的美德，也是全社会共同的责任。","vi":"Theo thống kê, lương thực bị lãng phí mỗi năm trên thế giới chiếm khoảng một phần ba tổng sản lượng. Cùng lúc đó vẫn còn nhiều người không đủ ăn. Tiết kiệm lương thực không chỉ là đức tính cá nhân mà còn là trách nhiệm chung của toàn xã hội.","qs":[["全世界每年浪费的粮食约占多少？","Lương thực bị lãng phí chiếm khoảng bao nhiêu?",["三分之一","一半","十分之一"]],["作者认为节约粮食是什么？","Tác giả cho rằng tiết kiệm lương thực là gì?",["个人美德和社会责任","政府的事","不重要"]]]},{"l":6,"s":1,"k":"Hội thoại","t":"女：你的演讲稿写得很生动，是怎么做到的？男：我在开头讲了一个真实的小故事，一下子就吸引了听众。女：难怪大家听得那么认真。男：而且我尽量少用专业术语，让每个人都能听懂。","vi":"Nữ: Bài diễn văn của anh rất sinh động, làm thế nào vậy? Nam: Tôi mở đầu bằng một câu chuyện nhỏ có thật, lập tức thu hút người nghe. Nữ: Thảo nào mọi người nghe chăm chú thế. Nam: Hơn nữa tôi cố dùng ít thuật ngữ chuyên môn, để ai cũng hiểu.","qs":[["男的演讲开头用了什么方法？","Người nam mở đầu bằng cách nào?",["讲一个真实的小故事","提问题","放音乐"]],["男的为什么少用专业术语？","Vì sao người nam ít dùng thuật ngữ?",["让每个人都能听懂","他不懂术语","时间不够"]]]},{"l":6,"s":2,"k":"Đoạn văn","t":"人工智能在医疗领域的应用越来越广泛。它能够快速分析大量病例，帮助医生更准确地诊断疾病。不过，专家强调，人工智能只是辅助工具，最终的判断仍需由医生作出。","vi":"Trí tuệ nhân tạo ngày càng được ứng dụng rộng rãi trong y tế. Nó có thể phân tích nhanh lượng lớn ca bệnh, giúp bác sĩ chẩn đoán chính xác hơn. Tuy nhiên chuyên gia nhấn mạnh AI chỉ là công cụ hỗ trợ, phán đoán cuối cùng vẫn do bác sĩ đưa ra.","qs":[["人工智能在医疗领域能做什么？","AI trong y tế có thể làm gì?",["分析病例，帮助诊断","代替医生","做手术"]],["专家强调什么？","Chuyên gia nhấn mạnh điều gì?",["人工智能只是辅助工具","人工智能比医生好","医生不需要学习"]]]},{"l":6,"s":2,"k":"Hội thoại","t":"男：听说你们在搞一个环保项目？女：对，我们要在社区推广旧衣服回收，把还能穿的捐给山区，不能穿的再加工利用。男：这个想法太好了！女：欢迎你也来当志愿者。","vi":"Nam: Nghe nói các bạn đang làm một dự án môi trường? Nữ: Đúng, chúng mình phổ biến thu gom quần áo cũ trong khu dân cư, cái còn mặc được thì quyên góp cho vùng núi, cái không mặc được thì tái chế. Nam: Ý tưởng hay quá! Nữ: Mời bạn cũng tham gia làm tình nguyện viên.","qs":[["女的在搞什么项目？","Người nữ đang làm dự án gì?",["旧衣服回收","植树","垃圾分类"]],["不能穿的旧衣服怎么处理？","Quần áo cũ không mặc được xử lý thế nào?",["再加工利用","扔掉","烧掉"]]]},{"l":6,"s":2,"k":"Đoạn văn","t":"有人做过一个实验，让两组孩子分别得到“你真聪明”和“你真努力”的表扬。结果发现，被夸努力的孩子更愿意接受有挑战的任务。这说明，表扬孩子的努力比表扬天赋更有利于成长。","vi":"Có người làm thí nghiệm, cho hai nhóm trẻ lần lượt nhận lời khen “con thông minh quá” và “con chăm chỉ quá”. Kết quả phát hiện trẻ được khen chăm chỉ sẵn sàng nhận nhiệm vụ thử thách hơn. Điều này cho thấy khen sự nỗ lực có lợi cho sự trưởng thành hơn khen thiên phú.","qs":[["被夸“努力”的孩子有什么特点？","Trẻ được khen “chăm chỉ” có đặc điểm gì?",["更愿意接受有挑战的任务","更骄傲","学习成绩更差"]],["这个实验说明什么？","Thí nghiệm cho thấy điều gì?",["表扬努力比表扬天赋更好","不要表扬孩子","孩子都很聪明"]]]},{"l":6,"s":2,"k":"Hội thoại","t":"女：这家老字号已经有一百多年的历史了吧？男：是的，他们一直坚持用传统工艺做点心。女：现在年轻人还喜欢吗？男：他们推出了很多新口味，还在网上开了店，生意比以前更好了。","vi":"Nữ: Tiệm lâu đời này có lịch sử hơn trăm năm rồi nhỉ? Nam: Đúng vậy, họ luôn kiên trì làm bánh theo công nghệ truyền thống. Nữ: Giới trẻ bây giờ còn thích không? Nam: Họ ra nhiều vị mới, còn mở cửa hàng online, buôn bán còn tốt hơn trước.","qs":[["这家老字号坚持什么？","Tiệm lâu đời kiên trì điều gì?",["用传统工艺做点心","只卖给老人","不开网店"]],["现在生意为什么更好了？","Vì sao bây giờ buôn bán tốt hơn?",["推出新口味，开了网店","降价了","换了老板"]]]},{"l":6,"s":2,"k":"Đoạn văn","t":"城市化进程加快，越来越多的农村年轻人涌入城市打工，留在村里的多是老人和孩子。为了解决“空心村”问题，一些地方开始发展乡村旅游和特色农业，吸引年轻人回乡创业。","vi":"Đô thị hóa tăng tốc, ngày càng nhiều thanh niên nông thôn đổ về thành phố làm thuê, ở lại làng phần lớn là người già và trẻ em. Để giải quyết vấn đề “làng rỗng”, một số nơi phát triển du lịch nông thôn và nông nghiệp đặc sản, thu hút thanh niên về quê khởi nghiệp.","qs":[["“空心村”是指什么？","“Làng rỗng” là gì?",["年轻人离开，只剩老人和孩子的村子","没有房子的村子","很大的村子"]],["一些地方怎么解决这个问题？","Một số nơi giải quyết thế nào?",["发展乡村旅游和特色农业","建更多工厂","禁止外出打工"]]]},{"l":6,"s":3,"k":"Hội thoại","t":"男：我总是控制不住自己玩手机，怎么办？女：你可以试试把手机放在另一个房间，或者设置使用时间限制。男：会有用吗？女：刚开始可能不习惯，坚持一段时间就会好很多。","vi":"Nam: Mình cứ không kiềm chế được việc chơi điện thoại, làm sao đây? Nữ: Bạn thử để điện thoại ở phòng khác, hoặc cài giới hạn thời gian sử dụng. Nam: Có hiệu quả không? Nữ: Lúc đầu có thể chưa quen, kiên trì một thời gian sẽ đỡ nhiều.","qs":[["男的有什么问题？","Người nam có vấn đề gì?",["控制不住玩手机","睡不着觉","工作太忙"]],["女的建议怎么做？","Người nữ khuyên làm gì?",["把手机放远一点或设置时间限制","换新手机","不用管它"]]]},{"l":6,"s":3,"k":"Đoạn văn","t":"敦煌莫高窟是中国古代艺术的宝库，保存着大量精美的壁画和雕塑。由于游客数量不断增加，壁画受到了一定的损害。为此，管理部门采取了限制游客人数、建设数字展厅等措施。","vi":"Hang Mạc Cao ở Đôn Hoàng là kho báu nghệ thuật cổ đại Trung Quốc, lưu giữ vô số bích họa và tượng điêu khắc tinh xảo. Do lượng du khách không ngừng tăng, bích họa đã bị tổn hại nhất định. Vì thế ban quản lý áp dụng các biện pháp như giới hạn số du khách, xây phòng trưng bày kỹ thuật số.","qs":[["敦煌莫高窟保存着什么？","Hang Mạc Cao lưu giữ gì?",["大量壁画和雕塑","古代钱币","恐龙化石"]],["管理部门采取了什么措施？","Ban quản lý áp dụng biện pháp gì?",["限制游客人数，建数字展厅","关闭景区","提高门票"]]]},{"l":6,"s":3,"k":"Hội thoại","t":"女：我们团队这次的方案被客户否定了。男：客户给出具体原因了吗？女：他们觉得创意不够新颖。男：那我们重新开个会，大家一起头脑风暴，这次一定要拿出让人眼前一亮的方案。","vi":"Nữ: Phương án lần này của đội mình bị khách hàng bác rồi. Nam: Khách có nói lý do cụ thể không? Nữ: Họ thấy ý tưởng chưa đủ mới mẻ. Nam: Vậy chúng ta họp lại, cùng động não, lần này nhất định phải đưa ra phương án khiến người ta sáng mắt.","qs":[["方案为什么被否定了？","Vì sao phương án bị bác?",["创意不够新颖","价格太高","时间太晚"]],["男的打算怎么做？","Người nam định làm gì?",["重新开会头脑风暴","换一个客户","放弃这个项目"]]]},{"l":6,"s":3,"k":"Hội thoại","t":"男：你学汉语这么多年，觉得最难的是什么？女：刚开始是声调，后来是成语。很多成语背后都有一个故事，不了解故事就很难用对。男：那你是怎么学的？女：我每天读一个成语故事，然后试着用它造句。","vi":"Nam: Bạn học tiếng Trung nhiều năm vậy, thấy khó nhất là gì? Nữ: Ban đầu là thanh điệu, sau là thành ngữ. Nhiều thành ngữ có câu chuyện phía sau, không hiểu chuyện thì khó dùng đúng. Nam: Vậy bạn học thế nào? Nữ: Mỗi ngày mình đọc một điển tích thành ngữ rồi thử đặt câu.","qs":[["女的觉得学汉语后来最难的是什么？","Về sau người nữ thấy khó nhất là gì?",["成语","声调","写字"]],["女的怎么学成语？","Người nữ học thành ngữ thế nào?",["每天读成语故事并造句","只背意思","看电视"]]]},{"l":6,"s":4,"k":"Đoạn văn","t":"一个国家的竞争力，归根结底取决于人才。而人才的培养离不开教育。因此，加大对教育的投入，不仅关系到个人的前途，更关系到民族的未来。","vi":"Sức cạnh tranh của một quốc gia, xét cho cùng phụ thuộc vào nhân tài. Mà đào tạo nhân tài không thể tách rời giáo dục. Vì vậy tăng đầu tư cho giáo dục không chỉ liên quan đến tiền đồ cá nhân, mà còn đến tương lai của dân tộc.","qs":[["一个国家的竞争力归根结底取决于什么？","Sức cạnh tranh quốc gia xét cho cùng phụ thuộc gì?",["人才","资源","土地"]],["加大教育投入关系到什么？","Tăng đầu tư giáo dục liên quan đến gì?",["个人前途和民族未来","只是个人的事","经济发展速度"]]]},{"l":6,"s":4,"k":"Hội thoại","t":"女：你怎么看待“躺平”这种现象？男：我觉得有些年轻人选择“躺平”，是因为压力太大，看不到希望。女：那社会应该做些什么？男：应该提供更多公平的机会，让努力的人能得到应有的回报。","vi":"Nữ: Anh nhìn hiện tượng “nằm thẳng” thế nào? Nam: Tôi nghĩ một số người trẻ chọn “nằm thẳng” vì áp lực quá lớn, không thấy hy vọng. Nữ: Vậy xã hội nên làm gì? Nam: Nên tạo thêm nhiều cơ hội công bằng, để người nỗ lực nhận được sự đền đáp xứng đáng.","qs":[["男的认为一些年轻人为什么“躺平”？","Vì sao một số người trẻ “nằm thẳng”?",["压力太大，看不到希望","太懒","太有钱"]],["男的认为社会应该做什么？","Người nam cho rằng xã hội nên làm gì?",["提供更多公平的机会","批评年轻人","不用管"]]]},{"l":6,"s":4,"k":"Đoạn văn","t":"丝绸之路不仅是一条贸易之路，也是一条文化交流之路。通过这条路，中国的丝绸、瓷器传到了西方，西方的宗教、艺术也传入了中国，促进了东西方文明的相互了解。","vi":"Con đường tơ lụa không chỉ là con đường thương mại mà còn là con đường giao lưu văn hóa. Qua con đường này, tơ lụa, đồ sứ Trung Quốc truyền sang phương Tây, tôn giáo và nghệ thuật phương Tây cũng truyền vào Trung Quốc, thúc đẩy hiểu biết lẫn nhau giữa văn minh Đông Tây.","qs":[["丝绸之路是一条什么样的路？","Con đường tơ lụa là con đường thế nào?",["贸易和文化交流之路","军事之路","旅游之路"]],["通过丝绸之路传入中国的有什么？","Qua con đường tơ lụa, thứ gì truyền vào Trung Quốc?",["西方的宗教和艺术","丝绸","瓷器"]]]},{"l":6,"s":4,"k":"Hội thoại","t":"男：这部电影的票房很高，可是评价两极分化。女：是啊，有人觉得特效震撼，有人认为剧情空洞。男：你看了吗？女：看了，我觉得视觉效果确实不错，但故事缺乏深度，看完没留下什么印象。","vi":"Nam: Bộ phim này doanh thu rất cao nhưng đánh giá phân cực. Nữ: Đúng vậy, có người thấy kỹ xảo choáng ngợp, có người cho rằng cốt truyện rỗng. Nam: Bạn xem chưa? Nữ: Xem rồi, hiệu ứng hình ảnh đúng là tốt, nhưng câu chuyện thiếu chiều sâu, xem xong chẳng đọng lại gì.","qs":[["这部电影的评价怎么样？","Phim được đánh giá thế nào?",["两极分化","都很好","都很差"]],["女的认为电影的问题是什么？","Người nữ cho rằng phim có vấn đề gì?",["故事缺乏深度","特效不好","演员不好"]]]},{"l":6,"s":4,"k":"Đoạn văn","t":"所谓“匠人精神”，就是对自己的工作精益求精、一丝不苟的态度。在追求速度的今天，这种精神显得尤为珍贵。一件好的作品，往往凝聚着匠人多年的心血和坚持。","vi":"Cái gọi là “tinh thần người thợ” là thái độ tỉ mỉ, cầu toàn với công việc của mình. Trong thời đại chạy theo tốc độ hôm nay, tinh thần này càng đáng quý. Một tác phẩm tốt thường kết tinh nhiều năm tâm huyết và kiên trì của người thợ.","qs":[["“匠人精神”指的是什么态度？","“Tinh thần người thợ” là thái độ gì?",["精益求精、一丝不苟","追求速度","随便应付"]],["为什么这种精神显得尤为珍贵？","Vì sao tinh thần này đặc biệt đáng quý?",["在追求速度的今天越来越少","因为很便宜","因为很容易做到"]]]},{"l":6,"s":5,"k":"Hội thoại","t":"女：你们公司今年为什么要大幅度增加研发投入？男：市场竞争越来越激烈，只有掌握核心技术，才能在竞争中立于不败之地。女：短期内会影响利润吧？男：会，但这是为了长远发展。","vi":"Nữ: Sao năm nay công ty anh tăng mạnh đầu tư nghiên cứu phát triển? Nam: Cạnh tranh thị trường ngày càng khốc liệt, chỉ có nắm công nghệ lõi mới đứng vững trong cạnh tranh. Nữ: Ngắn hạn sẽ ảnh hưởng lợi nhuận nhỉ? Nam: Có, nhưng là vì phát triển lâu dài.","qs":[["公司为什么增加研发投入？","Vì sao công ty tăng đầu tư R&D?",["掌握核心技术，立于不败之地","政府要求","钱太多"]],["增加研发投入短期内会怎样？","Ngắn hạn tăng đầu tư R&D sẽ thế nào?",["影响利润","增加利润","没有影响"]]]},{"l":6,"s":5,"k":"Đoạn văn","t":"汉字是世界上历史最悠久的文字之一。与拼音文字不同，汉字往往是“形、音、义”的结合，一个字本身就可能包含丰富的文化信息。学习汉字，也是在了解中华文化。","vi":"Chữ Hán là một trong những văn tự có lịch sử lâu đời nhất thế giới. Khác với chữ ghi âm, chữ Hán thường kết hợp “hình, âm, nghĩa”, bản thân một chữ có thể chứa đựng nhiều thông tin văn hóa. Học chữ Hán cũng là tìm hiểu văn hóa Trung Hoa.","qs":[["汉字和拼音文字有什么不同？","Chữ Hán khác chữ ghi âm ở điểm nào?",["是形、音、义的结合","没有声音","很少使用"]],["作者认为学习汉字也是在做什么？","Tác giả cho rằng học chữ Hán cũng là làm gì?",["了解中华文化","学习数学","学画画"]]]},{"l":6,"s":5,"k":"Hội thoại","t":"男：最近很多家长让孩子学编程，你觉得有必要吗？女：编程能锻炼孩子的逻辑思维，但关键要看孩子是否感兴趣。男：如果孩子不喜欢呢？女：那就不要勉强，兴趣才是最好的老师。","vi":"Nam: Gần đây nhiều phụ huynh cho con học lập trình, bạn thấy có cần thiết không? Nữ: Lập trình rèn tư duy logic cho trẻ, nhưng quan trọng là trẻ có hứng thú không. Nam: Nếu trẻ không thích thì sao? Nữ: Thì đừng ép, hứng thú mới là người thầy tốt nhất.","qs":[["女的认为编程能锻炼什么？","Người nữ cho rằng lập trình rèn luyện gì?",["逻辑思维","身体","记忆力"]],["如果孩子不喜欢编程，女的建议怎么做？","Nếu trẻ không thích, người nữ khuyên gì?",["不要勉强","一定要学","换个老师"]]]},{"l":6,"s":5,"k":"Đoạn văn","t":"气候变化已经成为全人类共同面临的挑战。极端天气频繁出现，海平面不断上升，许多物种面临灭绝的威胁。应对气候变化，需要每个国家、每个人都承担起相应的责任。","vi":"Biến đổi khí hậu đã trở thành thách thức chung của toàn nhân loại. Thời tiết cực đoan xuất hiện thường xuyên, mực nước biển không ngừng dâng, nhiều loài đứng trước nguy cơ tuyệt chủng. Ứng phó biến đổi khí hậu cần mỗi quốc gia, mỗi người gánh trách nhiệm tương ứng.","qs":[["气候变化带来了哪些问题？","Biến đổi khí hậu gây ra vấn đề gì?",["极端天气、海平面上升、物种灭绝","经济发展加快","人口增加"]],["应对气候变化需要什么？","Ứng phó biến đổi khí hậu cần gì?",["每个国家、每个人都承担责任","只靠科学家","只靠政府"]]]},{"l":6,"s":5,"k":"Hội thoại","t":"女：你为什么放弃了高薪的工作，去山区当老师？男：我曾经也是山里的孩子，是老师改变了我的命运。女：生活上不会觉得苦吗？男：条件确实艰苦，但看到孩子们渴望知识的眼神，我觉得一切都值得。","vi":"Nữ: Sao anh bỏ công việc lương cao lên vùng núi dạy học? Nam: Tôi từng là đứa trẻ vùng núi, chính thầy giáo đã thay đổi số phận tôi. Nữ: Cuộc sống không thấy khổ sao? Nam: Điều kiện đúng là gian khổ, nhưng nhìn ánh mắt khát khao tri thức của bọn trẻ, tôi thấy mọi thứ đều xứng đáng.","qs":[["男的为什么去山区当老师？","Vì sao người nam lên núi dạy học?",["老师曾经改变了他的命运","工资高","被公司派去"]],["男的觉得怎么样？","Người nam cảm thấy thế nào?",["条件艰苦但一切都值得","很后悔","很轻松"]]]},{"l":6,"s":6,"k":"Đoạn văn","t":"苏轼是中国北宋著名的文学家，一生经历了许多坎坷，多次被贬到偏远的地方。但他始终保持乐观豁达的心态，在困境中写下了许多流传千古的诗词，至今仍被人们广为传诵。","vi":"Tô Thức là văn hào nổi tiếng thời Bắc Tống, cả đời trải qua nhiều trắc trở, nhiều lần bị biếm đến nơi xa xôi. Nhưng ông luôn giữ tâm thế lạc quan, rộng lượng, trong nghịch cảnh viết nên nhiều bài thơ từ lưu truyền nghìn năm, đến nay vẫn được người đời truyền tụng.","qs":[["苏轼的一生怎么样？","Cuộc đời Tô Thức thế nào?",["经历了许多坎坷","一直很顺利","很少写诗"]],["苏轼在困境中保持了什么心态？","Trong nghịch cảnh Tô Thức giữ tâm thế gì?",["乐观豁达","悲观失望","愤怒不满"]]]},{"l":6,"s":6,"k":"Hội thoại","t":"男：你们的产品为什么在海外市场这么受欢迎？女：我们根据不同国家的文化和消费习惯，对产品进行了本地化调整。男：能举个例子吗？女：比如在越南，我们推出了更适合当地口味的产品，还用越南语做广告。","vi":"Nam: Sao sản phẩm của các bạn được ưa chuộng ở thị trường nước ngoài vậy? Nữ: Chúng tôi điều chỉnh bản địa hóa sản phẩm theo văn hóa và thói quen tiêu dùng từng nước. Nam: Cho ví dụ được không? Nữ: Ví dụ ở Việt Nam, chúng tôi ra sản phẩm hợp khẩu vị địa phương hơn, còn quảng cáo bằng tiếng Việt.","qs":[["产品为什么在海外受欢迎？","Vì sao sản phẩm được ưa chuộng ở nước ngoài?",["进行了本地化调整","价格最低","质量最好"]],["在越南他们做了什么？","Ở Việt Nam họ đã làm gì?",["推出适合当地口味的产品，用越南语做广告","降价","开工厂"]]]},{"l":6,"s":6,"k":"Đoạn văn","t":"有一种说法叫“木桶效应”：一只木桶能装多少水，不取决于最长的那块木板，而取决于最短的那块。这告诉我们，一个团队或一个人，要想全面发展，就必须重视并弥补自己的短板。","vi":"Có một cách nói gọi là “hiệu ứng thùng gỗ”: một thùng gỗ chứa được bao nhiêu nước không phụ thuộc tấm ván dài nhất mà phụ thuộc tấm ngắn nhất. Điều này cho thấy một đội nhóm hay một người muốn phát triển toàn diện phải coi trọng và bù đắp điểm yếu của mình.","qs":[["木桶能装多少水取决于什么？","Thùng gỗ chứa được bao nhiêu nước phụ thuộc gì?",["最短的那块木板","最长的木板","木桶的颜色"]],["“木桶效应”告诉我们什么？","“Hiệu ứng thùng gỗ” cho ta biết điều gì?",["要重视并弥补短板","只发展长处","木桶很重要"]]]},{"l":6,"s":6,"k":"Hội thoại","t":"女：这次危机处理得很及时，你是怎么做到的？男：问题一出现，我们就第一时间公开道歉，并说明了解决方案。女：没有试图隐瞒吗？男：没有。在信息时代，隐瞒只会让事情更糟，诚实才是最好的策略。","vi":"Nữ: Lần khủng hoảng này xử lý rất kịp thời, anh làm thế nào vậy? Nam: Vấn đề vừa xuất hiện, chúng tôi lập tức công khai xin lỗi và nêu phương án giải quyết. Nữ: Không định che giấu sao? Nam: Không. Trong thời đại thông tin, che giấu chỉ khiến mọi việc tệ hơn, thành thật mới là chiến lược tốt nhất.","qs":[["男的问题出现后第一时间做了什么？","Vấn đề xuất hiện, người nam lập tức làm gì?",["公开道歉并说明解决方案","隐瞒消息","开除员工"]],["男的认为最好的策略是什么？","Người nam cho rằng chiến lược tốt nhất là gì?",["诚实","隐瞒","沉默"]]]},{"l":6,"s":6,"k":"Đoạn văn","t":"随着生活水平的提高，人们对精神文化的需求也日益增长。各地的博物馆、图书馆、剧院等文化场所越来越受欢迎，“文化消费”逐渐成为新的消费热点。","vi":"Cùng với mức sống nâng cao, nhu cầu về đời sống tinh thần, văn hóa của con người cũng ngày càng tăng. Bảo tàng, thư viện, nhà hát… ở các nơi ngày càng được ưa chuộng, “tiêu dùng văn hóa” dần trở thành điểm nóng tiêu dùng mới.","qs":[["随着生活水平提高，人们对什么的需求增长了？","Mức sống tăng, nhu cầu gì tăng lên?",["精神文化","食物","房子"]],["什么成为新的消费热点？","Điều gì trở thành điểm nóng tiêu dùng mới?",["文化消费","汽车消费","服装消费"]]]},{"l":6,"s":7,"k":"Hội thoại","t":"男：你觉得成功最重要的因素是什么？女：我认为是坚持。很多人不是没有能力，而是在离成功只差一步的时候放弃了。男：那如果方向错了呢？女：那就要及时调整，坚持不等于固执。","vi":"Nam: Bạn thấy yếu tố quan trọng nhất để thành công là gì? Nữ: Mình nghĩ là kiên trì. Nhiều người không phải không có năng lực, mà bỏ cuộc khi chỉ còn cách thành công một bước. Nam: Nếu đi sai hướng thì sao? Nữ: Thì phải kịp thời điều chỉnh, kiên trì không có nghĩa là cố chấp.","qs":[["女的认为成功最重要的因素是什么？","Người nữ cho rằng yếu tố quan trọng nhất là gì?",["坚持","天赋","运气"]],["女的认为坚持和固执有什么关系？","Theo người nữ, kiên trì và cố chấp liên quan thế nào?",["坚持不等于固执","一样的","固执更好"]]]},{"l":6,"s":7,"k":"Đoạn văn","t":"“己所不欲，勿施于人”是孔子提出的重要思想，意思是自己不愿意的事情，不要强加给别人。这句话体现了尊重他人、换位思考的精神，在今天仍然具有重要的现实意义。","vi":"“Điều mình không muốn, chớ làm cho người” là tư tưởng quan trọng do Khổng Tử đề ra, nghĩa là việc mình không muốn thì đừng áp đặt lên người khác. Câu này thể hiện tinh thần tôn trọng người khác, đặt mình vào vị trí người khác, đến nay vẫn có ý nghĩa thực tiễn quan trọng.","qs":[["“己所不欲，勿施于人”是谁提出的？","Ai đề ra câu “kỷ sở bất dục, vật thi ư nhân”?",["孔子","老子","孟子"]],["这句话体现了什么精神？","Câu này thể hiện tinh thần gì?",["尊重他人、换位思考","努力学习","勤俭节约"]]]},{"l":6,"s":7,"k":"Hội thoại","t":"女：这本小说你看完了吗？结局怎么样？男：看完了，结局出人意料，主人公最后放弃了财富，选择回到家乡。女：为什么？男：作者想表达的是，真正的幸福不在于拥有多少，而在于内心的满足。","vi":"Nữ: Cuốn tiểu thuyết này bạn đọc xong chưa? Kết thúc thế nào? Nam: Xong rồi, kết thúc bất ngờ, nhân vật chính cuối cùng từ bỏ của cải, chọn trở về quê hương. Nữ: Tại sao? Nam: Tác giả muốn nói hạnh phúc thật sự không nằm ở việc sở hữu bao nhiêu, mà ở sự mãn nguyện trong lòng.","qs":[["小说的主人公最后做了什么？","Cuối cùng nhân vật chính làm gì?",["放弃财富回到家乡","成了富翁","出国了"]],["作者想表达什么？","Tác giả muốn nói điều gì?",["真正的幸福在于内心的满足","钱最重要","要离开家乡"]]]},{"l":6,"s":7,"k":"Đoạn văn","t":"中国古代的科举制度延续了一千三百多年。它打破了贵族对官职的垄断，为普通人提供了通过读书改变命运的机会。不过，后期的科举过于注重死记硬背，限制了人们的创造力。","vi":"Chế độ khoa cử thời cổ đại Trung Quốc kéo dài hơn một nghìn ba trăm năm. Nó phá vỡ sự độc quyền chức quan của quý tộc, cho người bình thường cơ hội đổi đời nhờ đọc sách. Tuy nhiên khoa cử giai đoạn sau quá chú trọng học vẹt, hạn chế sức sáng tạo.","qs":[["科举制度有什么积极作用？","Chế độ khoa cử có tác dụng tích cực gì?",["为普通人提供改变命运的机会","让贵族更有权力","增加税收"]],["后期的科举有什么问题？","Khoa cử giai đoạn sau có vấn đề gì?",["过于注重死记硬背","考试太简单","没有人参加"]]]},{"l":6,"s":7,"k":"Hội thoại","t":"男：退休以后你打算做什么？女：我想去学书法和古筝，这些都是我年轻时想学却没时间学的。男：真好，活到老学到老。女：是啊，学习是一辈子的事，什么时候开始都不晚。","vi":"Nam: Nghỉ hưu rồi bạn định làm gì? Nữ: Mình muốn học thư pháp và đàn tranh, đều là những thứ hồi trẻ muốn học mà không có thời gian. Nam: Hay quá, học đến già. Nữ: Đúng vậy, học là việc cả đời, bắt đầu lúc nào cũng không muộn.","qs":[["女的退休后打算学什么？","Nghỉ hưu người nữ định học gì?",["书法和古筝","英语","电脑"]],["女的认为学习是什么？","Người nữ cho rằng học tập là gì?",["一辈子的事","年轻人的事","浪费时间"]]]},{"l":6,"s":4,"k":"Đoạn văn","t":"中国的“二十四节气”是古人根据太阳的运行规律总结出来的，用来指导农业生产。2016年，它被列入联合国教科文组织人类非物质文化遗产代表作名录，体现了中国古人的智慧。","vi":"“Hai mươi bốn tiết khí” của Trung Quốc được người xưa đúc kết theo quy luật vận hành của mặt trời, dùng để chỉ đạo sản xuất nông nghiệp. Năm 2016, nó được UNESCO đưa vào danh sách di sản văn hóa phi vật thể đại diện của nhân loại, thể hiện trí tuệ của người xưa.","qs":[["二十四节气是根据什么总结出来的？","Hai mươi bốn tiết khí được đúc kết dựa trên gì?",["太阳的运行规律","月亮的变化","动物的习性"]],["二十四节气最初用来做什么？","Ban đầu tiết khí dùng để làm gì?",["指导农业生产","安排节日","预测天气"]]]},{"l":6,"s":4,"k":"Hội thoại","t":"男：你们部门这次的业绩为什么提升得这么快？女：我们调整了激励机制，让每个人的收入和团队目标挂钩。男：大家的积极性提高了？女：对，而且彼此之间的合作也更紧密了。","vi":"Nam: Sao thành tích phòng chị lần này tăng nhanh vậy? Nữ: Chúng tôi điều chỉnh cơ chế khuyến khích, gắn thu nhập mỗi người với mục tiêu của cả đội. Nam: Mọi người tích cực hơn à? Nữ: Đúng, mà hợp tác với nhau cũng chặt chẽ hơn.","qs":[["女的部门做了什么调整？","Phòng của người nữ đã điều chỉnh gì?",["调整了激励机制","换了经理","增加了人手"]],["调整后有什么变化？","Sau điều chỉnh có thay đổi gì?",["积极性提高，合作更紧密","收入降低","人员减少"]]]},{"l":6,"s":4,"k":"Đoạn văn","t":"在网络时代，个人隐私的保护越来越受到关注。很多应用程序在用户不知情的情况下收集个人信息，甚至将其出售给第三方。专家提醒大家，安装软件时要仔细阅读权限说明，不要随意授权。","vi":"Trong thời đại mạng, việc bảo vệ quyền riêng tư ngày càng được quan tâm. Nhiều ứng dụng thu thập thông tin cá nhân khi người dùng không hay biết, thậm chí bán cho bên thứ ba. Chuyên gia nhắc mọi người khi cài phần mềm phải đọc kỹ phần cấp quyền, đừng tùy tiện cho phép.","qs":[["很多应用程序存在什么问题？","Nhiều ứng dụng có vấn đề gì?",["在用户不知情时收集个人信息","收费太高","运行太慢"]],["专家提醒大家注意什么？","Chuyên gia nhắc mọi người chú ý điều gì?",["仔细阅读权限说明，不随意授权","不用手机","多下载软件"]]]},{"l":6,"s":4,"k":"Hội thoại","t":"女：听说你最近在学做陶瓷？男：是的，每周末去一个工作室。从和泥、拉坯到上釉，每一步都很讲究。女：难吗？男：刚开始总是失败，但亲手做出一个杯子的时候，那种成就感是买不来的。","vi":"Nữ: Nghe nói dạo này anh học làm gốm? Nam: Đúng, cuối tuần nào tôi cũng đến một xưởng. Từ nhào đất, vuốt phôi đến tráng men, bước nào cũng rất cầu kỳ. Nữ: Có khó không? Nam: Lúc đầu toàn hỏng, nhưng khi tự tay làm ra một cái cốc, cảm giác thành tựu ấy không mua được.","qs":[["男的最近在学什么？","Người nam đang học gì?",["做陶瓷","画画","做饭"]],["男的觉得亲手做出杯子时怎么样？","Tự tay làm được cốc, người nam thấy thế nào?",["有买不来的成就感","很失望","很累"]]]},{"l":6,"s":4,"k":"Đoạn văn","t":"“塞翁失马，焉知非福”出自一个古代故事：一位老人丢了一匹马，邻居们来安慰他，他却说这未必是坏事。不久，那匹马带着一群好马回来了。这个成语告诉我们，坏事在一定条件下可以变成好事。","vi":"“Tái ông mất ngựa, sao biết chẳng phải phúc” xuất phát từ một câu chuyện cổ: một ông lão mất con ngựa, hàng xóm đến an ủi, ông lại nói chưa chắc là chuyện xấu. Không lâu sau, con ngựa dẫn về cả một đàn ngựa tốt. Thành ngữ này cho thấy trong điều kiện nhất định, chuyện xấu có thể thành chuyện tốt.","qs":[["老人丢了马以后怎么说？","Mất ngựa, ông lão nói gì?",["这未必是坏事","太倒霉了","要去找马"]],["这个成语告诉我们什么？","Thành ngữ này nói lên điều gì?",["坏事在一定条件下可以变成好事","不要养马","邻居很热情"]]]},{"l":6,"s":5,"k":"Hội thoại","t":"男：这次国际会议你负责翻译，压力大吗？女：挺大的，有很多专业术语，而且发言人说话速度很快。男：你是怎么准备的？女：提前一个月研究相关资料，把常用术语整理成表格，每天练习。","vi":"Nam: Hội nghị quốc tế lần này chị phụ trách phiên dịch, áp lực lớn không? Nữ: Khá lớn, có nhiều thuật ngữ chuyên môn, người phát biểu lại nói rất nhanh. Nam: Chị chuẩn bị thế nào? Nữ: Nghiên cứu tài liệu liên quan trước một tháng, sắp xếp thuật ngữ thường dùng thành bảng, ngày nào cũng luyện.","qs":[["女的在会议上负责什么？","Người nữ phụ trách gì ở hội nghị?",["翻译","发言","主持"]],["女的是怎么准备的？","Người nữ đã chuẩn bị thế nào?",["提前一个月研究资料，整理术语","临时准备","请别人帮忙"]]]},{"l":6,"s":5,"k":"Đoạn văn","t":"有研究表明，经常阅读的人更善于理解他人的情绪。这是因为在阅读小说时，读者会站在人物的角度去思考和感受，这种练习能提高人的共情能力，使人在现实生活中更懂得关心别人。","vi":"Có nghiên cứu cho thấy người hay đọc sách giỏi thấu hiểu cảm xúc người khác hơn. Vì khi đọc tiểu thuyết, người đọc đặt mình vào vị trí nhân vật để suy nghĩ và cảm nhận; sự luyện tập này nâng cao khả năng đồng cảm, giúp người ta biết quan tâm người khác hơn ngoài đời thực.","qs":[["经常阅读的人有什么特点？","Người hay đọc sách có đặc điểm gì?",["更善于理解他人的情绪","更喜欢独处","说话更快"]],["为什么阅读能提高共情能力？","Vì sao đọc sách nâng cao khả năng đồng cảm?",["读者会站在人物角度思考和感受","书里有很多知识","阅读需要很长时间"]]]},{"l":6,"s":5,"k":"Hội thoại","t":"女：你们的产品价格比同类产品高不少，为什么还卖得这么好？男：因为我们注重品质和售后服务，顾客买得放心。女：口碑很重要啊。男：没错，一个满意的顾客会带来十个新顾客。","vi":"Nữ: Sản phẩm của anh giá cao hơn hàng cùng loại khá nhiều, sao vẫn bán chạy vậy? Nam: Vì chúng tôi chú trọng chất lượng và dịch vụ hậu mãi, khách mua yên tâm. Nữ: Uy tín truyền miệng quan trọng thật. Nam: Đúng vậy, một khách hàng hài lòng sẽ mang đến mười khách hàng mới.","qs":[["男的产品为什么卖得好？","Vì sao sản phẩm người nam bán chạy?",["注重品质和售后服务","价格最低","广告多"]],["男的认为一个满意的顾客会怎样？","Người nam cho rằng một khách hài lòng sẽ thế nào?",["带来十个新顾客","再也不来","只买一次"]]]},{"l":6,"s":5,"k":"Đoạn văn","t":"太极拳是一种动作缓慢、柔和的传统武术，讲究“以柔克刚”。练习太极拳不仅可以强身健体，还能让人心情平静。如今，太极拳已经传播到世界各地，受到许多外国人的喜爱。","vi":"Thái cực quyền là môn võ truyền thống với động tác chậm rãi, mềm mại, chú trọng “lấy nhu thắng cương”. Tập Thái cực quyền không chỉ rèn luyện sức khỏe mà còn giúp tâm trạng bình yên. Ngày nay Thái cực quyền đã lan rộng khắp thế giới, được nhiều người nước ngoài yêu thích.","qs":[["太极拳讲究什么？","Thái cực quyền chú trọng điều gì?",["以柔克刚","速度快","力量大"]],["练习太极拳有什么好处？","Tập Thái cực quyền có lợi gì?",["强身健体，心情平静","赚钱","变高"]]]},{"l":6,"s":5,"k":"Hội thoại","t":"男：我发现你说话越来越有说服力了。女：我最近在学习辩论的技巧，比如先听懂对方的观点，再用事实和数据来回应。男：不会显得太强势吗？女：关键是尊重对方，讨论问题而不是攻击人。","vi":"Nam: Mình thấy bạn nói chuyện ngày càng có sức thuyết phục. Nữ: Dạo này mình học kỹ năng tranh biện, ví dụ trước tiên hiểu rõ quan điểm đối phương, rồi dùng sự thật và số liệu để đáp lại. Nam: Không sợ trông quá áp đảo sao? Nữ: Quan trọng là tôn trọng đối phương, bàn vấn đề chứ không công kích con người.","qs":[["女的最近在学什么？","Người nữ đang học gì?",["辩论的技巧","唱歌","写作"]],["女的认为辩论的关键是什么？","Người nữ cho rằng mấu chốt của tranh biện là gì?",["尊重对方，讨论问题而不攻击人","声音要大","一定要赢"]]]},{"l":6,"s":6,"k":"Đoạn văn","t":"共享经济的出现改变了人们的消费观念。从共享单车到共享充电宝，人们越来越倾向于“使用而不拥有”。这种模式提高了资源的利用率，但也带来了管理和维护方面的新问题。","vi":"Kinh tế chia sẻ ra đời đã thay đổi quan niệm tiêu dùng. Từ xe đạp công cộng đến sạc dự phòng dùng chung, người ta ngày càng thiên về “sử dụng chứ không sở hữu”. Mô hình này nâng cao hiệu suất sử dụng tài nguyên, nhưng cũng đặt ra vấn đề mới về quản lý và bảo trì.","qs":[["共享经济让人们越来越倾向于什么？","Kinh tế chia sẻ khiến người ta thiên về điều gì?",["使用而不拥有","买更多东西","只用现金"]],["共享经济带来了什么新问题？","Kinh tế chia sẻ đặt ra vấn đề mới gì?",["管理和维护","价格太高","没有人使用"]]]},{"l":6,"s":6,"k":"Hội thoại","t":"女：你决定去哪所大学读研究生了吗？男：有两所学校录取了我，一所排名高，另一所的导师在我的研究领域很有名。女：你倾向哪一个？男：我更看重导师，跟着好的导师能学到更多。","vi":"Nữ: Anh đã quyết định học cao học trường nào chưa? Nam: Có hai trường nhận tôi, một trường xếp hạng cao, trường kia có giáo sư hướng dẫn rất nổi tiếng trong lĩnh vực của tôi. Nữ: Anh nghiêng về bên nào? Nam: Tôi coi trọng người hướng dẫn hơn, theo thầy giỏi học được nhiều hơn.","qs":[["男的被几所学校录取了？","Người nam được mấy trường nhận?",["两所","一所","三所"]],["男的更看重什么？","Người nam coi trọng điều gì hơn?",["导师","学校排名","学费"]]]},{"l":6,"s":6,"k":"Đoạn văn","t":"古代有个叫曾子的人，他的妻子为了哄孩子，随口说回来后杀猪给他吃。妻子回来后，曾子真的要杀猪，他说：“对孩子不能说谎，否则孩子就会学着说谎。”这个故事告诉我们，父母要言而有信，以身作则。","vi":"Thời xưa có người tên Tăng Tử, vợ ông để dỗ con đã buột miệng hứa về sẽ giết lợn cho con ăn. Vợ về, Tăng Tử thật sự định giết lợn, ông nói: “Không được nói dối trẻ con, nếu không con sẽ học theo mà nói dối.” Câu chuyện dạy cha mẹ phải giữ lời, làm gương cho con.","qs":[["曾子为什么真的要杀猪？","Vì sao Tăng Tử thật sự giết lợn?",["对孩子不能说谎","家里没有肉","孩子生日"]],["这个故事告诉父母什么？","Câu chuyện dạy cha mẹ điều gì?",["要言而有信，以身作则","要多吃肉","要多陪孩子玩"]]]},{"l":6,"s":6,"k":"Hội thoại","t":"男：你们团队的远程合作效率怎么这么高？女：我们有明确的分工，每天早上开十分钟视频会议，及时沟通进度。男：用什么工具管理任务？女：一个在线项目管理软件，每个人的任务和截止时间都一目了然。","vi":"Nam: Sao đội chị làm việc từ xa hiệu quả vậy? Nữ: Chúng tôi phân công rõ ràng, sáng nào cũng họp video mười phút, trao đổi tiến độ kịp thời. Nam: Dùng công cụ gì để quản lý công việc? Nữ: Một phần mềm quản lý dự án trực tuyến, nhiệm vụ và hạn chót của mỗi người nhìn là thấy ngay.","qs":[["团队每天早上做什么？","Sáng nào đội cũng làm gì?",["开十分钟视频会议","一起吃早饭","写报告"]],["他们用什么管理任务？","Họ quản lý công việc bằng gì?",["在线项目管理软件","纸和笔","电子邮件"]]]},{"l":6,"s":6,"k":"Đoạn văn","t":"很多人认为年纪大了就学不了新东西。其实，大脑具有很强的可塑性，只要坚持学习，无论什么年龄都可以掌握新技能。学习新东西还能延缓大脑衰老，让人保持年轻的心态。","vi":"Nhiều người cho rằng có tuổi rồi thì không học được gì mới. Thật ra não bộ có tính dẻo rất cao, chỉ cần kiên trì học, ở tuổi nào cũng có thể nắm được kỹ năng mới. Học điều mới còn làm chậm lão hóa não, giúp giữ tâm thế trẻ trung.","qs":[["作者认为大脑有什么特点？","Tác giả cho rằng não bộ có đặc điểm gì?",["具有很强的可塑性","年纪大就不能用","只能学一种东西"]],["学习新东西有什么好处？","Học điều mới có lợi gì?",["延缓大脑衰老，保持年轻心态","让人变累","浪费时间"]]]},{"l":6,"s":7,"k":"Hội thoại","t":"女：这次失败对你打击大吗？男：说不难过是假的，但我已经想通了。女：接下来有什么打算？男：先总结经验，找出问题所在，然后重新出发。失败只是暂时的，放弃才是真正的失败。","vi":"Nữ: Lần thất bại này có làm anh suy sụp không? Nam: Nói không buồn là nói dối, nhưng tôi đã thông suốt rồi. Nữ: Tiếp theo anh định làm gì? Nam: Trước hết rút kinh nghiệm, tìm ra vấn đề, rồi làm lại từ đầu. Thất bại chỉ là tạm thời, bỏ cuộc mới là thất bại thật sự.","qs":[["男的接下来打算怎么做？","Tiếp theo người nam định làm gì?",["总结经验，重新出发","放弃","休息一年"]],["男的认为什么才是真正的失败？","Người nam cho rằng điều gì mới là thất bại thật sự?",["放弃","失败一次","被别人批评"]]]},{"l":6,"s":7,"k":"Đoạn văn","t":"中国菜讲究“色、香、味”俱全，不同地区的菜系各有特色：川菜麻辣，粤菜清淡，鲁菜注重原汁原味，苏菜偏甜。饮食文化不仅反映了各地的气候和物产，也体现了当地人的生活方式。","vi":"Món Trung Quốc chú trọng đủ cả “sắc, hương, vị”, các trường phái ẩm thực mỗi vùng có nét riêng: món Tứ Xuyên cay tê, món Quảng Đông thanh đạm, món Sơn Đông giữ nguyên vị, món Giang Tô thiên ngọt. Văn hóa ẩm thực không chỉ phản ánh khí hậu và sản vật mỗi vùng, mà còn thể hiện lối sống của người dân.","qs":[["川菜有什么特点？","Món Tứ Xuyên có đặc điểm gì?",["麻辣","清淡","偏甜"]],["饮食文化反映了什么？","Văn hóa ẩm thực phản ánh điều gì?",["各地的气候、物产和生活方式","只是口味","只是历史"]]]},{"l":6,"s":7,"k":"Hội thoại","t":"男：你为什么总是随身带着笔记本？女：我习惯把突然想到的点子记下来，很多好主意都是一闪而过的。男：用手机记不是更方便吗？女：手写能让我思考得更深入，而且不会被消息打扰。","vi":"Nam: Sao bạn lúc nào cũng mang theo sổ tay? Nữ: Mình quen ghi lại những ý tưởng chợt nảy ra, nhiều ý hay chỉ lóe lên trong khoảnh khắc. Nam: Ghi bằng điện thoại chẳng tiện hơn sao? Nữ: Viết tay giúp mình suy nghĩ sâu hơn, lại không bị tin nhắn làm phiền.","qs":[["女的为什么随身带笔记本？","Vì sao người nữ luôn mang sổ tay?",["记下突然想到的点子","写日记","记账"]],["女的认为手写有什么好处？","Người nữ cho rằng viết tay có lợi gì?",["思考更深入，不被打扰","更快","更好看"]]]},{"l":6,"s":7,"k":"Đoạn văn","t":"范仲淹是北宋著名的政治家和文学家，他在《岳阳楼记》中写道：“先天下之忧而忧，后天下之乐而乐。”这句话表达了他把国家和人民放在第一位的崇高理想，激励了一代又一代的中国人。","vi":"Phạm Trọng Yêm là chính trị gia và văn học gia nổi tiếng thời Bắc Tống. Trong “Nhạc Dương lâu ký”, ông viết: “Lo trước cái lo của thiên hạ, vui sau cái vui của thiên hạ.” Câu này thể hiện lý tưởng cao cả đặt đất nước và nhân dân lên hàng đầu, cổ vũ bao thế hệ người Trung Quốc.","qs":[["“先天下之忧而忧，后天下之乐而乐”出自哪篇文章？","Câu “lo trước thiên hạ…” xuất phát từ tác phẩm nào?",["《岳阳楼记》","《论语》","《史记》"]],["这句话表达了什么理想？","Câu này thể hiện lý tưởng gì?",["把国家和人民放在第一位","追求个人快乐","隐居山林"]]]},{"l":6,"s":7,"k":"Hội thoại","t":"女：你学了这么多年中文，最大的收获是什么？男：不只是会说一门语言，更重要的是理解了另一种思维方式和文化。女：这会影响你的生活吗？男：会，我看问题的角度更多了，也更懂得包容不同的想法。","vi":"Nữ: Học tiếng Trung nhiều năm vậy, thu hoạch lớn nhất của anh là gì? Nam: Không chỉ biết nói thêm một ngôn ngữ, quan trọng hơn là hiểu được một cách tư duy và một nền văn hóa khác. Nữ: Điều đó có ảnh hưởng đến cuộc sống của anh không? Nam: Có, tôi nhìn vấn đề từ nhiều góc độ hơn, cũng biết bao dung với những suy nghĩ khác biệt.","qs":[["男的最大的收获是什么？","Thu hoạch lớn nhất của người nam là gì?",["理解了另一种思维方式和文化","找到了工作","去了中国旅游"]],["学中文对男的生活有什么影响？","Học tiếng Trung ảnh hưởng thế nào đến cuộc sống người nam?",["看问题角度更多，更包容","没有影响","更忙了"]]]},{"l":6,"s":8,"k":"Đoạn văn","t":"庄子在《逍遥游》中描绘了一只能飞九万里的大鹏，而小麻雀却嘲笑它飞得太远。庄子借这个寓言告诉人们，眼界的大小决定了一个人对世界的理解，不能用自己狭隘的眼光去评判别人。","vi":"Trong “Tiêu dao du”, Trang Tử tả con chim bằng bay xa chín vạn dặm, còn con chim sẻ nhỏ lại chê nó bay quá xa. Qua ngụ ngôn này Trang Tử muốn nói tầm nhìn quyết định cách một người hiểu thế giới, không thể lấy cái nhìn hạn hẹp của mình để đánh giá người khác.","qs":[["小麻雀嘲笑大鹏什么？","Chim sẻ chê chim bằng điều gì?",["飞得太远","飞得太低","长得太大"]],["这个寓言告诉人们什么？","Ngụ ngôn này nói với ta điều gì?",["不能用狭隘的眼光评判别人","要努力飞高","麻雀很聪明"]]]},{"l":6,"s":8,"k":"Hội thoại","t":"男：你们研究所最近在攻关什么项目？女：一种可降解的新型材料，用来代替塑料包装。男：难度大吗？女：最大的难点是在保证强度的同时降低成本，我们已经连续实验了上百次。","vi":"Nam: Viện các chị dạo này đang dồn sức vào dự án gì? Nữ: Một loại vật liệu mới phân hủy được, dùng thay bao bì nhựa. Nam: Khó lắm không? Nữ: Khó nhất là vừa đảm bảo độ bền vừa giảm giá thành, chúng tôi đã thử nghiệm liên tục hơn trăm lần.","qs":[["研究所在研究什么？","Viện đang nghiên cứu gì?",["可降解的新型材料","新型手机","新药"]],["最大的难点是什么？","Khó khăn lớn nhất là gì?",["保证强度的同时降低成本","找不到人","没有资金"]]]},{"l":6,"s":8,"k":"Đoạn văn","t":"越南和中国山水相连，两国的文化交流源远流长。越南语中有大量的汉越词，约占词汇总量的百分之六十以上。因此，越南人学习汉语时，往往能借助汉越词更快地理解词义。","vi":"Việt Nam và Trung Quốc núi sông liền kề, giao lưu văn hóa hai nước có lịch sử lâu đời. Tiếng Việt có rất nhiều từ Hán Việt, chiếm khoảng hơn sáu mươi phần trăm vốn từ. Vì vậy người Việt học tiếng Trung thường có thể nhờ từ Hán Việt mà hiểu nghĩa từ nhanh hơn.","qs":[["汉越词约占越南语词汇的多少？","Từ Hán Việt chiếm khoảng bao nhiêu vốn từ tiếng Việt?",["百分之六十以上","百分之十","一半以下"]],["汉越词对越南人学汉语有什么帮助？","Từ Hán Việt giúp gì cho người Việt học tiếng Trung?",["更快地理解词义","发音更准","写字更快"]]]},{"l":6,"s":8,"k":"Hội thoại","t":"女：我总觉得时间不够用，每天都很忙，却不知道忙了些什么。男：你试过记录自己一天的时间吗？女：没有。男：试一个星期，你会发现很多时间被浪费在不重要的事情上，然后才能有针对性地调整。","vi":"Nữ: Mình luôn thấy không đủ thời gian, ngày nào cũng bận mà chẳng biết bận gì. Nam: Bạn đã thử ghi lại thời gian trong một ngày chưa? Nữ: Chưa. Nam: Thử một tuần đi, bạn sẽ thấy nhiều thời gian bị lãng phí vào việc không quan trọng, rồi mới điều chỉnh có mục tiêu được.","qs":[["女的有什么困扰？","Người nữ đang phiền não điều gì?",["很忙却不知道忙什么","没有工作","睡不着"]],["男的建议她做什么？","Người nam khuyên cô ấy làm gì?",["记录一个星期的时间","辞职","早点睡觉"]]]},{"l":6,"s":8,"k":"Đoạn văn","t":"所谓“蝴蝶效应”，是指一个微小的变化，可能在一个复杂的系统中引起巨大的连锁反应。比如，一只蝴蝶扇动翅膀，可能在遥远的地方引发一场风暴。这个理论提醒我们，不要忽视细节的力量。","vi":"Cái gọi là “hiệu ứng cánh bướm” là chỉ một thay đổi nhỏ có thể gây ra phản ứng dây chuyền khổng lồ trong một hệ thống phức tạp. Ví dụ, một con bướm vỗ cánh có thể gây ra cơn bão ở nơi rất xa. Lý thuyết này nhắc ta đừng xem nhẹ sức mạnh của chi tiết.","qs":[["“蝴蝶效应”是指什么？","“Hiệu ứng cánh bướm” là gì?",["微小变化可能引起巨大的连锁反应","蝴蝶会引起风暴","天气变化很快"]],["这个理论提醒我们什么？","Lý thuyết này nhắc ta điều gì?",["不要忽视细节的力量","保护蝴蝶","注意天气"]]]},{"l":6,"s":8,"k":"Hội thoại","t":"男：你觉得城市里还有必要保留老街区吗？女：当然有必要，老街区承载着一座城市的记忆和文化。男：可是很多老房子条件很差。女：可以在保护原貌的基础上改善设施，让老街区既有历史感，又适合居住。","vi":"Nam: Bạn thấy trong thành phố có cần giữ lại khu phố cổ không? Nữ: Tất nhiên cần, phố cổ mang ký ức và văn hóa của thành phố. Nam: Nhưng nhiều nhà cũ điều kiện rất kém. Nữ: Có thể cải thiện tiện nghi trên cơ sở giữ nguyên diện mạo, để phố cổ vừa có cảm giác lịch sử vừa thích hợp để ở.","qs":[["女的认为老街区承载着什么？","Người nữ cho rằng phố cổ mang gì?",["城市的记忆和文化","商业价值","交通功能"]],["女的建议怎么处理老房子？","Người nữ đề nghị xử lý nhà cũ thế nào?",["保护原貌的基础上改善设施","全部拆掉","不用管"]]]},{"l":6,"s":8,"k":"Đoạn văn","t":"郑和是明朝著名的航海家，他曾经七次下西洋，最远到达了非洲东海岸。他的船队规模庞大，带去了丝绸和瓷器，带回了各地的特产，促进了中国与亚非国家的交流。","vi":"Trịnh Hòa là nhà hàng hải nổi tiếng thời Minh, từng bảy lần xuống Tây Dương, xa nhất đến bờ biển phía đông châu Phi. Đội thuyền của ông quy mô khổng lồ, mang theo tơ lụa và đồ sứ, mang về đặc sản các nơi, thúc đẩy giao lưu giữa Trung Quốc với các nước Á Phi.","qs":[["郑和一共下了几次西洋？","Trịnh Hòa xuống Tây Dương mấy lần?",["七次","三次","十次"]],["郑和的航行促进了什么？","Các chuyến đi của Trịnh Hòa thúc đẩy điều gì?",["中国与亚非国家的交流","战争","移民"]]]},{"l":6,"s":8,"k":"Hội thoại","t":"女：我发现你最近很少抱怨了，有什么秘诀吗？男：我每天睡前写三件让自己感恩的小事，哪怕只是同事帮我倒了杯水。女：这样做有用吗？男：坚持了几个月，我发现自己更容易注意到生活中美好的一面。","vi":"Nữ: Mình thấy dạo này bạn ít than phiền hẳn, có bí quyết gì không? Nam: Mỗi tối trước khi ngủ mình viết ra ba điều nhỏ khiến mình biết ơn, dù chỉ là đồng nghiệp rót giúp cốc nước. Nữ: Có tác dụng không? Nam: Kiên trì mấy tháng, mình thấy dễ nhận ra mặt tốt đẹp của cuộc sống hơn.","qs":[["男的每天睡前做什么？","Mỗi tối trước khi ngủ người nam làm gì?",["写三件感恩的小事","看书","运动"]],["坚持几个月后男的有什么变化？","Kiên trì mấy tháng người nam thay đổi gì?",["更容易注意到生活中美好的一面",

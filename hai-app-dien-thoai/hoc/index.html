"更爱抱怨","睡得更晚"]]]},{"l":6,"s":8,"k":"Đoạn văn","t":"指南针、造纸术、印刷术和火药被称为中国古代的“四大发明”。它们不仅推动了中国社会的发展，还通过各种途径传到世界各地，对人类文明的进步产生了深远的影响。","vi":"La bàn, kỹ thuật làm giấy, kỹ thuật in và thuốc súng được gọi là “bốn phát minh lớn” của Trung Quốc cổ đại. Chúng không chỉ thúc đẩy xã hội Trung Quốc phát triển mà còn lan ra khắp thế giới qua nhiều con đường, ảnh hưởng sâu rộng đến tiến bộ văn minh nhân loại.","qs":[["中国古代的“四大发明”不包括什么？","Bốn phát minh lớn không gồm thứ nào?",["地动仪","指南针","造纸术"]],["四大发明对世界有什么影响？","Bốn phát minh lớn ảnh hưởng thế nào đến thế giới?",["对人类文明进步产生深远影响","只影响中国","没有影响"]]]},{"l":6,"s":8,"k":"Hội thoại","t":"男：你们的直播带货为什么能吸引那么多观众？女：我们不只是卖东西，还会讲产品背后的故事，比如茶叶是怎么种出来的、手艺人是怎么做的。男：观众喜欢听？女：对，有温度的内容更能打动人。","vi":"Nam: Sao livestream bán hàng của các bạn thu hút nhiều người xem vậy? Nữ: Chúng tôi không chỉ bán hàng, mà còn kể câu chuyện đằng sau sản phẩm, như lá trà được trồng thế nào, người thợ làm ra sao. Nam: Người xem thích nghe à? Nữ: Đúng, nội dung có hơi ấm con người dễ chạm đến lòng người hơn.","qs":[["女的直播有什么特点？","Livestream của người nữ có đặc điểm gì?",["讲产品背后的故事","价格最低","时间最长"]],["女的认为什么内容更能打动人？","Người nữ cho rằng nội dung nào dễ chạm lòng người?",["有温度的内容","搞笑的内容","很短的内容"]]]},{"l":6,"s":9,"k":"Hội thoại","t":"男：听说你们公司开始实行四天工作制了？女：是的，试行半年，员工满意度明显提高，工作效率也没有下降。男：老板不担心吗？女：老板说，衡量工作的标准应该是成果，而不是时间。","vi":"Nam: Nghe nói công ty bạn bắt đầu làm việc bốn ngày một tuần? Nữ: Đúng vậy, thử nghiệm nửa năm, mức hài lòng của nhân viên tăng rõ, hiệu suất cũng không giảm. Nam: Sếp không lo sao? Nữ: Sếp nói thước đo công việc phải là kết quả, chứ không phải thời gian.","qs":[["实行四天工作制后有什么变化？","Làm bốn ngày một tuần có thay đổi gì?",["员工满意度提高，效率没下降","效率下降","员工更累"]],["老板认为衡量工作的标准是什么？","Sếp cho rằng thước đo công việc là gì?",["成果","时间","态度"]]]},{"l":6,"s":9,"k":"Hội thoại","t":"女：你觉得要不要让孩子早点儿接触电子产品？男：完全禁止不现实，关键是要引导。女：怎么引导呢？男：规定使用时间，选择有教育意义的内容，父母自己也要以身作则，少玩手机。","vi":"Nữ: Bạn thấy có nên cho trẻ tiếp xúc sớm với thiết bị điện tử không? Nam: Cấm hoàn toàn thì không thực tế, quan trọng là hướng dẫn. Nữ: Hướng dẫn thế nào? Nam: Quy định thời gian dùng, chọn nội dung có tính giáo dục, cha mẹ cũng phải làm gương, bớt chơi điện thoại.","qs":[["男的对孩子接触电子产品的态度是什么？","Người nam có thái độ thế nào?",["关键是要引导","完全禁止","随便玩"]],["男的提到父母应该怎么做？","Người nam nói cha mẹ nên làm gì?",["以身作则，少玩手机","买更多电子产品","不管孩子"]]]},{"l":6,"s":9,"k":"Đoạn văn","t":"研究人员发现，森林不仅能吸收二氧化碳、释放氧气，还能调节气候、保持水土。据估算，一棵大树一年可以吸收几十公斤的二氧化碳。保护森林，就是保护人类自己的家园。","vi":"Các nhà nghiên cứu phát hiện rừng không chỉ hấp thụ CO2, thải ra oxy mà còn điều hòa khí hậu, giữ đất giữ nước. Theo ước tính, một cây lớn mỗi năm có thể hấp thụ vài chục kilôgam CO2. Bảo vệ rừng chính là bảo vệ ngôi nhà của chính loài người.","qs":[["森林有哪些作用？","Rừng có những tác dụng gì?",["吸收二氧化碳、调节气候、保持水土","只能提供木材","只是风景好"]],["作者认为保护森林就是什么？","Tác giả cho rằng bảo vệ rừng là gì?",["保护人类自己的家园","保护动物","发展经济"]]]},{"l":6,"s":9,"k":"Hội thoại","t":"男：这次创业失败，你最大的教训是什么？女：太急于扩张了。产品还没站稳脚跟，就开了太多分店，资金链一下子就断了。男：下次会怎么做？女：先把一件事做好、做精，再考虑做大。","vi":"Nam: Lần khởi nghiệp thất bại này, bài học lớn nhất của bạn là gì? Nữ: Quá vội mở rộng. Sản phẩm chưa đứng vững đã mở quá nhiều chi nhánh, dòng tiền đứt gãy ngay. Nam: Lần sau bạn sẽ làm thế nào? Nữ: Trước hết làm tốt, làm tinh một việc, rồi mới tính làm lớn.","qs":[["女的创业失败的主要原因是什么？","Nguyên nhân chính khởi nghiệp thất bại là gì?",["太急于扩张，资金链断了","产品太贵","员工不好"]],["女的下次打算怎么做？","Lần sau người nữ định làm gì?",["先把一件事做好做精再做大","不再创业","马上开更多店"]]]},{"l":6,"s":9,"k":"Đoạn văn","t":"很多人都有拖延的习惯，明明知道事情很重要，却总是想“明天再做”。心理学家认为，拖延往往不是因为懒，而是因为害怕失败或者觉得任务太大。把大任务分成几个小步骤，是克服拖延的有效方法。","vi":"Nhiều người có thói quen trì hoãn, biết rõ việc quan trọng mà cứ nghĩ “để mai làm”. Các nhà tâm lý học cho rằng trì hoãn thường không phải vì lười, mà vì sợ thất bại hoặc thấy nhiệm vụ quá lớn. Chia nhiệm vụ lớn thành vài bước nhỏ là cách hiệu quả để vượt qua trì hoãn.","qs":[["心理学家认为拖延往往是因为什么？","Trì hoãn thường là do đâu?",["害怕失败或觉得任务太大","太懒","太忙"]],["克服拖延的有效方法是什么？","Cách hiệu quả để vượt qua trì hoãn là gì?",["把大任务分成小步骤","明天再做","请别人做"]]]},{"l":6,"s":9,"k":"Hội thoại","t":"女：这次的产品发布会准备得怎么样了？男：场地、设备都没问题，就是演讲稿还要再改改。女：哪里需要改？男：内容太专业了，我想加几个生活中的例子，让普通观众也能听懂。","vi":"Nữ: Buổi ra mắt sản phẩm lần này chuẩn bị đến đâu rồi? Nam: Địa điểm, thiết bị đều ổn, chỉ có bài phát biểu cần sửa thêm. Nữ: Sửa chỗ nào? Nam: Nội dung quá chuyên môn, tôi muốn thêm vài ví dụ đời thường để khán giả bình thường cũng hiểu.","qs":[["发布会还有什么需要准备？","Buổi ra mắt còn cần chuẩn bị gì?",["演讲稿要再改改","场地","设备"]],["男的打算怎么改演讲稿？","Người nam định sửa bài phát biểu thế nào?",["加生活中的例子","删掉一半","换人来讲"]]]},{"l":6,"s":9,"k":"Đoạn văn","t":"黄河是中华民族的母亲河，全长五千四百多公里。它流经的地区孕育了古老的中华文明。然而，由于黄河携带大量泥沙，历史上曾多次改道，给两岸人民带来了严重的水灾。","vi":"Hoàng Hà là sông mẹ của dân tộc Trung Hoa, dài hơn năm nghìn bốn trăm cây số. Vùng đất nó chảy qua đã nuôi dưỡng nền văn minh Trung Hoa cổ xưa. Tuy nhiên do mang theo lượng phù sa lớn, trong lịch sử Hoàng Hà nhiều lần đổi dòng, gây lũ lụt nghiêm trọng cho người dân hai bờ.","qs":[["黄河被称为什么？","Hoàng Hà được gọi là gì?",["中华民族的母亲河","最长的河","最清的河"]],["黄河为什么历史上多次改道？","Vì sao Hoàng Hà nhiều lần đổi dòng?",["携带大量泥沙","人们挖河道","地震"]]]},{"l":6,"s":9,"k":"Hội thoại","t":"男：你是怎么做到工作和家庭兼顾的？女：说实话，很难完全平衡。我的原则是，在公司就专心工作，回家就放下手机陪孩子。男：遇到加班怎么办？女：提前和家人沟通，得到他们的理解很重要。","vi":"Nam: Làm sao chị cân bằng được công việc và gia đình? Nữ: Thật lòng mà nói rất khó cân bằng hoàn toàn. Nguyên tắc của tôi là ở công ty thì chuyên tâm làm việc, về nhà thì bỏ điện thoại xuống chơi với con. Nam: Gặp lúc tăng ca thì sao? Nữ: Trao đổi trước với gia đình, được họ thông cảm rất quan trọng.","qs":[["女的原则是什么？","Nguyên tắc của người nữ là gì?",["在公司专心工作，回家陪孩子","一直工作","不加班"]],["遇到加班女的怎么做？","Gặp tăng ca người nữ làm gì?",["提前和家人沟通","不回家","辞职"]]]},{"l":6,"s":9,"k":"Đoạn văn","t":"竹子是中国文化中重要的象征。它“未出土时先有节，及凌云处尚虚心”，象征着气节和谦虚。古代文人喜欢画竹、写竹，把竹子和梅、兰、菊一起称为“四君子”。","vi":"Cây tre là biểu tượng quan trọng trong văn hóa Trung Quốc. “Chưa nhú khỏi đất đã có đốt, vươn đến tầng mây vẫn rỗng lòng”, tượng trưng cho khí tiết và khiêm tốn. Văn nhân xưa thích vẽ tre, viết về tre, gọi tre cùng mai, lan, cúc là “tứ quân tử”.","qs":[["竹子在中国文化中象征什么？","Tre trong văn hóa Trung Quốc tượng trưng cho gì?",["气节和谦虚","财富","长寿"]],["“四君子”是哪四种植物？","“Tứ quân tử” là bốn loài nào?",["梅、兰、竹、菊","松、竹、梅、兰","桃、李、梅、菊"]]]},{"l":6,"s":10,"k":"Hội thoại","t":"女：你们的翻译软件已经很准确了，为什么还要请人工翻译？男：机器翻译适合日常交流，但在法律合同、文学作品这类领域，一个词的偏差就可能带来严重后果。女：所以还是需要人来把关。男：没错，人机结合才是最好的方式。","vi":"Nữ: Phần mềm dịch của các anh đã rất chính xác, sao còn thuê người dịch? Nam: Dịch máy hợp với giao tiếp hằng ngày, nhưng ở lĩnh vực như hợp đồng pháp lý, tác phẩm văn học, lệch một từ có thể gây hậu quả nghiêm trọng. Nữ: Vậy vẫn cần người kiểm soát. Nam: Đúng, kết hợp người và máy mới là cách tốt nhất.","qs":[["机器翻译适合什么？","Dịch máy phù hợp với gì?",["日常交流","法律合同","文学作品"]],["男的认为最好的方式是什么？","Người nam cho rằng cách tốt nhất là gì?",["人机结合","只用机器","只用人工"]]]},{"l":6,"s":10,"k":"Đoạn văn","t":"中国古代有“愚公移山”的故事：一位九十岁的老人决心把挡在家门前的两座大山移走。别人笑他愚蠢，他却说：“我死了还有儿子，儿子死了还有孙子，子子孙孙是没有穷尽的。”这个故事赞扬了坚持不懈的精神。","vi":"Trung Quốc cổ có chuyện “Ngu Công dời núi”: một ông lão chín mươi tuổi quyết tâm dời hai ngọn núi chắn trước cửa nhà. Người khác cười ông ngốc, ông lại nói: “Ta chết còn con, con chết còn cháu, con cháu đời đời không bao giờ hết.” Câu chuyện ca ngợi tinh thần kiên trì bền bỉ.","qs":[["愚公想做什么？","Ngu Công muốn làm gì?",["把家门前的两座大山移走","去山里住","爬到山顶"]],["这个故事赞扬了什么精神？","Câu chuyện ca ngợi tinh thần gì?",["坚持不懈","聪明机智","勤俭节约"]]]},{"l":6,"s":10,"k":"Hội thoại","t":"男：最近大家都在讨论“终身学习”，你怎么理解？女：我觉得就是学习不应该在毕业时结束。技术变化这么快，不学习就会落后。男：可是工作那么忙，哪有时间学？女：每天抽出半小时，一年下来也是不小的积累。","vi":"Nam: Dạo này mọi người bàn nhiều về “học tập suốt đời”, bạn hiểu thế nào? Nữ: Mình nghĩ là việc học không nên dừng khi tốt nghiệp. Công nghệ thay đổi nhanh vậy, không học sẽ tụt hậu. Nam: Nhưng công việc bận thế, lấy đâu thời gian? Nữ: Mỗi ngày dành ra nửa tiếng, một năm cũng tích lũy được không ít.","qs":[["女的怎么理解“终身学习”？","Người nữ hiểu “học tập suốt đời” thế nào?",["学习不应该在毕业时结束","一直上学","只学一种技能"]],["女的建议怎么解决没时间的问题？","Người nữ gợi ý giải quyết chuyện thiếu thời gian thế nào?",["每天抽出半小时学习","辞职去学习","周末学一整天"]]]},{"l":6,"s":10,"k":"Đoạn văn","t":"心理学上有一个概念叫“延迟满足”，指的是为了更大的长远利益，放弃眼前较小的诱惑。研究表明，能够延迟满足的孩子，长大后往往在学业和事业上更容易取得成功。","vi":"Tâm lý học có khái niệm “trì hoãn sự thỏa mãn”, tức là từ bỏ cám dỗ nhỏ trước mắt vì lợi ích lâu dài lớn hơn. Nghiên cứu cho thấy những đứa trẻ biết trì hoãn sự thỏa mãn khi lớn lên thường dễ thành công hơn trong học tập và sự nghiệp.","qs":[["“延迟满足”是指什么？","“Trì hoãn sự thỏa mãn” là gì?",["为了长远利益放弃眼前的诱惑","马上得到满足","不要任何东西"]],["能延迟满足的孩子长大后怎么样？","Trẻ biết trì hoãn thỏa mãn lớn lên thế nào?",["更容易取得成功","更不快乐","更胆小"]]]},{"l":6,"s":10,"k":"Hội thoại","t":"女：你为什么喜欢在旧书店买书？男：旧书店里常常能找到已经绝版的好书，而且价格便宜。女：书上有别人的笔记，不会影响阅读吗？男：恰恰相反，看到前一位读者的想法，就像和他隔着时空对话一样，很有意思。","vi":"Nữ: Sao bạn thích mua sách ở tiệm sách cũ? Nam: Ở đó thường tìm được sách hay đã tuyệt bản, giá lại rẻ. Nữ: Sách có ghi chú của người khác, không ảnh hưởng việc đọc sao? Nam: Ngược lại, đọc được suy nghĩ của người đọc trước giống như trò chuyện với họ xuyên thời gian, rất thú vị.","qs":[["男的为什么喜欢在旧书店买书？","Vì sao người nam thích mua sách cũ?",["能找到绝版好书，价格便宜","书更新","环境好"]],["男的怎么看书上别人的笔记？","Người nam nhìn ghi chú của người khác thế nào?",["像隔着时空对话，很有意思","很讨厌","影响阅读"]]]},{"l":6,"s":10,"k":"Đoạn văn","t":"中国的高铁网络已经覆盖了大部分大中城市，时速可达三百多公里。高铁不仅缩短了城市之间的距离，也改变了人们的生活方式，比如有人住在一个城市，却在另一个城市上班。","vi":"Mạng lưới tàu cao tốc Trung Quốc đã phủ phần lớn các thành phố lớn và vừa, tốc độ đạt hơn ba trăm cây số mỗi giờ. Tàu cao tốc không chỉ rút ngắn khoảng cách giữa các thành phố mà còn thay đổi lối sống, chẳng hạn có người sống ở thành phố này nhưng đi làm ở thành phố khác.","qs":[["中国高铁的时速可达多少？","Tàu cao tốc Trung Quốc đạt tốc độ bao nhiêu?",["三百多公里","一百公里","一千公里"]],["高铁改变了人们的什么？","Tàu cao tốc thay đổi điều gì của con người?",["生活方式","饮食习惯","语言"]]]},{"l":6,"s":10,"k":"Hội thoại","t":"男：这部纪录片拍了多长时间？女：整整三年。我们跟拍了一群候鸟，从北方的繁殖地一直到南方的越冬地。男：最难的是什么？女：要耐心等待，有时候在野外守了十几天，才拍到几秒钟的画面。","vi":"Nam: Bộ phim tài liệu này quay mất bao lâu? Nữ: Tròn ba năm. Chúng tôi theo chân một đàn chim di cư, từ nơi sinh sản ở phương Bắc đến nơi trú đông ở phương Nam. Nam: Khó nhất là gì? Nữ: Phải kiên nhẫn chờ đợi, có khi canh ngoài trời mười mấy ngày mới quay được vài giây.","qs":[["纪录片拍的是什么？","Phim tài liệu quay về gì?",["一群候鸟的迁徙","一个城市","一群学生"]],["拍摄最难的是什么？","Khó nhất khi quay là gì?",["要耐心等待","天气太热","设备太重"]]]},{"l":6,"s":10,"k":"Đoạn văn","t":"“知己知彼，百战不殆”出自《孙子兵法》，意思是了解对手也了解自己，打多少次仗都不会失败。今天，这句话被广泛应用于商业竞争、体育比赛甚至日常生活中。","vi":"“Biết người biết ta, trăm trận không nguy” xuất phát từ “Binh pháp Tôn Tử”, nghĩa là hiểu đối thủ và hiểu chính mình thì đánh bao nhiêu trận cũng không thua. Ngày nay câu này được áp dụng rộng rãi trong cạnh tranh kinh doanh, thi đấu thể thao, thậm chí cuộc sống thường ngày.","qs":[["“知己知彼，百战不殆”出自哪本书？","Câu này xuất phát từ sách nào?",["《孙子兵法》","《论语》","《道德经》"]],["这句话的意思是什么？","Câu này nghĩa là gì?",["了解对手和自己就不会失败","要多打仗","不要相信别人"]]]},{"l":6,"s":10,"k":"Hội thoại","t":"女：你觉得一个好的领导最重要的是什么？男：我认为是愿意倾听。很多领导只喜欢发号施令，却听不进员工的意见。女：倾听真的那么重要吗？男：当然，员工觉得被尊重，才会真正投入工作。","vi":"Nữ: Anh thấy điều quan trọng nhất ở một người lãnh đạo giỏi là gì? Nam: Tôi cho là sẵn lòng lắng nghe. Nhiều lãnh đạo chỉ thích ra lệnh mà không nghe ý kiến nhân viên. Nữ: Lắng nghe thật sự quan trọng vậy sao? Nam: Tất nhiên, nhân viên thấy được tôn trọng mới thật sự dốc lòng làm việc.","qs":[["男的认为好领导最重要的是什么？","Theo người nam, điều quan trọng nhất ở lãnh đạo giỏi là gì?",["愿意倾听","能力强","很严格"]],["员工觉得被尊重会怎样？","Nhân viên được tôn trọng sẽ thế nào?",["真正投入工作","要求加薪","离开公司"]]]},{"l":6,"s":11,"k":"Hội thoại","t":"女：你为什么选择研究古代汉字？男：每一个古文字都像一扇窗户，透过它可以看到几千年前人们的生活和思想。女：这项工作很枯燥吧？男：有时候是，但每破解一个字，那种喜悦是无法用语言形容的。","vi":"Nữ: Sao anh chọn nghiên cứu chữ Hán cổ? Nam: Mỗi chữ cổ như một ô cửa sổ, qua đó thấy được cuộc sống và tư tưởng của người xưa mấy nghìn năm trước. Nữ: Công việc này khô khan lắm nhỉ? Nam: Đôi khi là vậy, nhưng mỗi lần giải mã được một chữ, niềm vui ấy không lời nào tả nổi.","qs":[["男的为什么研究古代汉字？","Vì sao người nam nghiên cứu chữ cổ?",["通过古文字可以了解古人的生活和思想","工资高","很简单"]],["破解一个字时男的感受如何？","Giải mã được một chữ, người nam thấy thế nào?",["有无法形容的喜悦","很累","很失望"]]]},{"l":6,"s":11,"k":"Đoạn văn","t":"老子说：“上善若水。”水滋润万物却不与万物相争，总是流向低处，却能汇成大海。这句话告诉我们，真正的强大不在于争强好胜，而在于谦虚包容、利他而不求回报。","vi":"Lão Tử nói: “Thượng thiện nhược thủy.” Nước tưới mát vạn vật mà không tranh với vạn vật, luôn chảy về chỗ thấp mà lại hợp thành biển cả. Câu này cho ta biết sức mạnh thật sự không nằm ở hiếu thắng, mà ở khiêm tốn bao dung, vì người khác mà không cầu đền đáp.","qs":[["老子说“上善若水”中，水有什么特点？","Trong câu “thượng thiện nhược thủy”, nước có đặc điểm gì?",["滋润万物而不相争","很冷","流得很快"]],["这句话告诉我们真正的强大在于什么？","Theo câu này sức mạnh thật sự nằm ở đâu?",["谦虚包容、利他","争强好胜","力量大"]]]},{"l":6,"s":11,"k":"Hội thoại","t":"男：听说你要去越南当中文老师了？女：是的，那里学中文的人越来越多，很多企业都需要会中文的员工。男：你会越南语吗？女：会一点儿。我打算一边教中文，一边学越南语，这样更能理解学生的困难。","vi":"Nam: Nghe nói bạn sắp sang Việt Nam dạy tiếng Trung? Nữ: Đúng vậy, ở đó người học tiếng Trung ngày càng nhiều, nhiều doanh nghiệp cần nhân viên biết tiếng Trung. Nam: Bạn biết tiếng Việt không? Nữ: Biết một chút. Mình định vừa dạy tiếng Trung vừa học tiếng Việt, như vậy hiểu khó khăn của học trò hơn.","qs":[["女的要去越南做什么？","Người nữ sang Việt Nam làm gì?",["当中文老师","旅游","开公司"]],["女的为什么打算学越南语？","Vì sao người nữ định học tiếng Việt?",["更能理解学生的困难","为了考试","为了找工作"]]]},{"l":6,"s":11,"k":"Hội thoại","t":"女：恭喜你通过了汉语水平考试六级！男：谢谢！准备了整整两年，终于没有白费。女：接下来有什么计划？男：我想用中文写一本书，把越南的故事介绍给中国读者，让两国人民更加了解彼此。","vi":"Nữ: Chúc mừng bạn đỗ HSK cấp 6! Nam: Cảm ơn! Chuẩn bị tròn hai năm, cuối cùng không uổng công. Nữ: Kế hoạch tiếp theo là gì? Nam: Mình muốn viết một cuốn sách bằng tiếng Trung, giới thiệu câu chuyện Việt Nam đến độc giả Trung Quốc, để nhân dân hai nước hiểu nhau hơn.","qs":[["男的准备了多长时间？","Người nam chuẩn bị bao lâu?",["两年","半年","一个月"]],["男的接下来想做什么？","Tiếp theo người nam muốn làm gì?",["用中文写一本书介绍越南","出国旅游","换工作"]]]},{"l":6,"s":11,"k":"Đoạn văn","t":"中秋节是中国人团圆的节日。这一天，人们赏月、吃月饼，思念远方的亲人。苏轼“但愿人长久，千里共婵娟”的诗句，表达了即使不能相聚，也希望共享一轮明月的美好愿望。","vi":"Tết Trung Thu là ngày đoàn viên của người Trung Quốc. Ngày này người ta ngắm trăng, ăn bánh trung thu, nhớ về người thân phương xa. Câu thơ của Tô Thức “Chỉ mong người mãi bên nhau, nghìn dặm cùng chung ánh trăng” thể hiện ước mong dù không thể sum họp vẫn cùng chung một vầng trăng sáng.","qs":[["中秋节人们会做什么？","Trung Thu người ta làm gì?",["赏月、吃月饼","划龙舟","放鞭炮"]],["“但愿人长久，千里共婵娟”表达了什么？","Câu thơ của Tô Thức thể hiện điều gì?",["不能相聚也希望共享明月的愿望","喜欢旅游","月亮很大"]]]},{"l":6,"s":11,"k":"Hội thoại","t":"男：退休后很多人会觉得失落，你父亲适应得怎么样？女：一开始不太习惯，后来他参加了社区的老年大学，学摄影、学书法，生活比上班时还充实。男：真好。女：他说，人生的每个阶段都有新的风景。","vi":"Nam: Nghỉ hưu nhiều người thấy hụt hẫng, bố bạn thích nghi thế nào? Nữ: Ban đầu chưa quen lắm, sau ông tham gia đại học người cao tuổi ở khu dân cư, học chụp ảnh, học thư pháp, cuộc sống còn phong phú hơn lúc đi làm. Nam: Hay quá. Nữ: Ông nói mỗi chặng đường đời đều có phong cảnh mới.","qs":[["女的父亲退休后做了什么？","Bố người nữ nghỉ hưu làm gì?",["参加社区老年大学","继续上班","一直在家看电视"]],["父亲认为人生的每个阶段怎么样？","Ông cho rằng mỗi chặng đời thế nào?",["都有新的风景","越来越无聊","很辛苦"]]]},{"l":6,"s":11,"k":"Đoạn văn","t":"人工智能的发展引发了许多伦理问题，例如：机器做出的决定出了错，应该由谁负责？个人数据被用来训练模型，是否侵犯了隐私？科技的进步需要法律和道德的同步跟进。","vi":"Sự phát triển của trí tuệ nhân tạo đặt ra nhiều vấn đề đạo đức, ví dụ: quyết định của máy sai thì ai chịu trách nhiệm? Dữ liệu cá nhân bị dùng để huấn luyện mô hình có xâm phạm quyền riêng tư không? Tiến bộ khoa học cần pháp luật và đạo đức theo kịp đồng thời.","qs":[["人工智能引发了什么问题？","AI đặt ra vấn đề gì?",["伦理问题","交通问题","天气问题"]],["作者认为科技进步需要什么？","Tác giả cho rằng tiến bộ khoa học cần gì?",["法律和道德同步跟进","停止发展","更多资金"]]]},{"l":6,"s":11,"k":"Hội thoại","t":"女：你这次参加马拉松，跑完全程了吗？男：跑完了，用了四个多小时。最后五公里差点儿坚持不下去。女：是什么让你坚持下来的？男：我告诉自己，再跑一公里就好，就这样一公里一公里地跑到了终点。","vi":"Nữ: Lần này chạy marathon bạn chạy hết cự ly chứ? Nam: Hết rồi, mất hơn bốn tiếng. Năm cây số cuối suýt nữa không trụ nổi. Nữ: Điều gì giúp bạn kiên trì? Nam: Mình tự nhủ chạy thêm một cây số nữa thôi, cứ thế từng cây số một mà chạy đến đích.","qs":[["男的跑完马拉松用了多长时间？","Người nam chạy marathon mất bao lâu?",["四个多小时","两个小时","六个小时"]],["男的是怎么坚持下来的？","Người nam kiên trì bằng cách nào?",["告诉自己再跑一公里","有人推他","停下来休息很久"]]]}],"gram":[{"id":"g101","l":1,"n":"是","name":"Câu chữ 是","f":"A + 是 + B · phủ định: A + 不是 + B","e":"Dùng 是 để nói A là B (danh tính, nghề nghiệp, quốc tịch). Không dùng 是 trước tính từ.","ex":[["我|是|学生|。",1,"有/在/很","Tôi là học sinh."],["他|不|是|老师|。",2,"没/有/在","Anh ấy không phải giáo viên."]]},{"id":"g102","l":1,"n":"吗","name":"Câu hỏi với 吗","f":"Câu trần thuật + 吗？","e":"Thêm 吗 vào cuối câu trần thuật để tạo câu hỏi có/không.","ex":[["你|是|中国人|吗|？",3,"呢/吧/的","Bạn là người Trung Quốc phải không?"],["你|喜欢|喝|茶|吗|？",4,"呢/了/的","Bạn có thích uống trà không?"]]},{"id":"g103","l":1,"n":"呢","name":"Hỏi lại với 呢","f":"…，你呢？ · Danh từ + 呢？","e":"呢 dùng để hỏi lại “còn… thì sao?” hoặc hỏi vị trí “… đâu?”.","ex":[["我|很|好|，|你|呢|？",5,"吗/了/的","Tôi khỏe, còn bạn?"],["我的|书|呢|？",2,"吗/了/的","Sách của tôi đâu rồi?"]]},{"id":"g104","l":1,"n":"很","name":"Câu vị ngữ tính từ","f":"Chủ ngữ + 很 + Tính từ","e":"Tính từ làm vị ngữ thường có 很 đứng trước, không dùng 是.","ex":[["今天|很|热|。",1,"是/有/在","Hôm nay rất nóng."],["她|很|漂亮|。",1,"是/的/在","Cô ấy rất xinh."]]},{"id":"g105","l":1,"n":"的","name":"Sở hữu với 的","f":"Danh từ/Đại từ + 的 + Danh từ","e":"的 nối người sở hữu với vật được sở hữu, giống “của”.","ex":[["这|是|我|的|书|。",3,"了/是/很","Đây là sách của tôi."],["他|是|我|的|朋友|。",3,"了/很/在","Anh ấy là bạn của tôi."]]},{"id":"g106","l":1,"n":"不","name":"Phủ định với 不","f":"不 + Động từ/Tính từ","e":"不 phủ định thói quen, ý muốn, hiện tại và tương lai.","ex":[["我|不|喝|咖啡|。",1,"没/很/也","Tôi không uống cà phê."],["今天|不|冷|。",1,"没/是/有","Hôm nay không lạnh."]]},{"id":"g107","l":1,"n":"没有","name":"Phủ định với 没(有)","f":"没有 + Danh từ · 没 + Động từ","e":"没有 phủ định 有 (không có) và việc chưa/không xảy ra trong quá khứ.","ex":[["我|没有|钱|。",1,"不/是/很","Tôi không có tiền."],["他|昨天|没|来|。",2,"不是/很/是","Hôm qua anh ấy không đến."]]},{"id":"g108","l":1,"n":"也","name":"Phó từ 也","f":"Chủ ngữ + 也 + Động từ","e":"也 nghĩa là “cũng”, luôn đứng sau chủ ngữ, trước động từ.","ex":[["我|也|是|学生|。",1,"很/的/在","Tôi cũng là học sinh."],["他|也|喜欢|猫|。",1,"很/是/的","Anh ấy cũng thích mèo."]]},{"id":"g109","l":1,"n":"都","name":"Phó từ 都","f":"Chủ ngữ số nhiều + 都 + Động từ","e":"都 nghĩa là “đều”, đứng sau chủ ngữ số nhiều, trước động từ.","ex":[["我们|都|是|老师|。",1,"很/在/的","Chúng tôi đều là giáo viên."],["他们|都|喜欢|中国菜|。",1,"很/是/的","Họ đều thích món Trung Quốc."]]},{"id":"g110","l":1,"n":"在","name":"在 chỉ nơi chốn","f":"Chủ ngữ + 在 + Nơi chốn (+ Động từ)","e":"在 nghĩa là “ở”, có thể đứng một mình làm động từ hoặc trước động từ chỉ nơi làm việc gì.","ex":[["我|在|学校|。",1,"是/有/很","Tôi ở trường."],["妈妈|在|家|做饭|。",1,"是/有/很","Mẹ nấu cơm ở nhà."]]},{"id":"g111","l":1,"n":"有","name":"Câu chữ 有","f":"A + 有 + B · Nơi chốn + 有 + Sự vật","e":"有 nghĩa là “có”: sở hữu hoặc tồn tại ở một nơi.","ex":[["我|有|一个|妹妹|。",1,"是/在/很","Tôi có một em gái."],["桌子|上|有|一本|书|。",2,"在/很/了","Trên bàn có một quyển sách."]]},{"id":"g112","l":1,"n":"个/本","name":"Số + lượng từ + danh từ","f":"Số từ + Lượng từ + Danh từ","e":"Giữa số và danh từ phải có lượng từ: 个 (chung), 本 (sách), 件 (áo), 张 (giấy, bàn)…","ex":[["我|有|三|个|朋友|。",3,"本/件/张","Tôi có ba người bạn."],["我|买|了|两|本|书|。",4,"件/只/张","Tôi đã mua hai quyển sách."]]},{"id":"g113","l":1,"n":"几/多少","name":"Hỏi số lượng","f":"几 + Lượng từ (số nhỏ) · 多少 (số lớn/giá tiền)","e":"几 hỏi số lượng nhỏ (thường dưới 10), 多少 hỏi số lớn hoặc giá tiền.","ex":[["你|家|有|几|口|人|？",3,"什么/哪/谁","Nhà bạn có mấy người?"],["这个|多少|钱|？",1,"几/什么/哪","Cái này bao nhiêu tiền?"]]},{"id":"g114","l":1,"n":"什么/哪儿","name":"Đại từ nghi vấn","f":"Đặt đại từ nghi vấn vào đúng vị trí cần hỏi","e":"Câu hỏi tiếng Trung giữ nguyên trật tự câu, chỉ thay phần cần hỏi bằng 什么/谁/哪儿/几.","ex":[["你|叫|什么|名字|？",2,"谁/哪儿/几","Bạn tên là gì?"],["你|去|哪儿|？",2,"什么/谁/几","Bạn đi đâu?"]]},{"id":"g115","l":1,"n":"时间词","name":"Trạng ngữ thời gian","f":"Chủ ngữ + Thời gian + Động từ","e":"Từ chỉ thời gian đứng trước động từ (trước hoặc sau chủ ngữ), không đặt cuối câu như tiếng Việt.","ex":[["我|明天|去|北京|。",1,"很/都/的","Ngày mai tôi đi Bắc Kinh."],["他|每天|八点|上班|。",1,"很/的/了","Ngày nào anh ấy cũng đi làm lúc tám giờ."]]},{"id":"g116","l":1,"n":"了","name":"了 hoàn thành","f":"Động từ + 了 (+ Tân ngữ) · Câu + 了","e":"了 cho biết hành động đã hoàn thành hoặc tình huống đã thay đổi.","ex":[["我|买|了|一个|手机|。",2,"的/吗/呢","Tôi đã mua một chiếc điện thoại."],["他|已经|走|了|。",3,"的/吗/呢","Anh ấy đi rồi."]]},{"id":"g117","l":1,"n":"会/能","name":"Động từ năng nguyện 会, 能","f":"会/能 + Động từ","e":"会: biết (qua học tập); 能: có thể, có khả năng/điều kiện.","ex":[["我|会|说|汉语|。",1,"是/在/有","Tôi biết nói tiếng Trung."],["你|明天|能|来|吗|？",2,"是/在/有","Ngày mai bạn đến được không?"]]},{"id":"g118","l":1,"n":"想","name":"Động từ năng nguyện 想","f":"想 + Động từ","e":"想 nghĩa là “muốn”, đứng trước động từ.","ex":[["我|想|喝|水|。",1,"是/在/有","Tôi muốn uống nước."],["你|想|去|哪儿|？",1,"是/在/有","Bạn muốn đi đâu?"]]},{"id":"g119","l":1,"n":"和","name":"Liên từ 和","f":"Danh từ + 和 + Danh từ","e":"和 nối hai danh từ, nghĩa “và”. Không dùng 和 nối hai mệnh đề.","ex":[["我|和|妈妈|去|商店|。",1,"也/都/很","Tôi và mẹ đi cửa hàng."],["苹果|和|香蕉|都|很|好吃|。",1,"也/很/都","Táo và chuối đều rất ngon."]]},{"id":"g120","l":1,"n":"太…了","name":"Cảm thán 太…了","f":"太 + Tính từ + 了","e":"太…了 diễn tả mức độ quá cao, thường để cảm thán.","ex":[["今天|太|热|了|！",1,"是/在/有","Hôm nay nóng quá!"],["这个|太|贵|了|。",1,"是/有/在","Cái này đắt quá."]]},{"id":"g201","l":2,"n":"正在…呢","name":"Hành động đang diễn ra","f":"(正)在 + Động từ (+ 呢)","e":"正在 cho biết hành động đang tiếp diễn, cuối câu thường có 呢.","ex":[["他|正在|看|书|呢|。",1,"已经/就/过","Anh ấy đang đọc sách."],["妈妈|正在|做饭|。",1,"已经/了/过","Mẹ đang nấu cơm."]]},{"id":"g202","l":2,"n":"过","name":"Trợ từ kinh nghiệm 过","f":"Động từ + 过","e":"过 diễn tả việc đã từng trải qua; phủ định: 没 + Động từ + 过.","ex":[["我|去|过|中国|。",2,"着/的/在","Tôi từng đến Trung Quốc."],["你|吃|过|北京烤鸭|吗|？",2,"着/在/的","Bạn đã từng ăn vịt quay Bắc Kinh chưa?"]]},{"id":"g203","l":2,"n":"着","name":"Trợ từ trạng thái 着","f":"Động từ + 着","e":"着 diễn tả trạng thái kéo dài hoặc cách thức của hành động khác.","ex":[["门|开|着|。",2,"过/的/在","Cửa đang mở."],["他|笑|着|说|。",2,"过/在/的","Anh ấy vừa cười vừa nói."]]},{"id":"g204","l":2,"n":"比","name":"So sánh với 比","f":"A + 比 + B + Tính từ","e":"比 dùng để so sánh hơn; không thêm 很/非常 trước tính từ.","ex":[["我|比|他|高|。",1,"跟/和/很","Tôi cao hơn anh ấy."],["今天|比|昨天|冷|。",1,"跟/和/很","Hôm nay lạnh hơn hôm qua."]]},{"id":"g205","l":2,"n":"要…了","name":"Sắp xảy ra","f":"(快/就)要 + Động từ + 了","e":"要…了 cho biết việc sắp xảy ra.","ex":[["火车|要|开|了|。",1,"正在/在/很","Tàu sắp chạy rồi."],["要|下雨|了|。",0,"正在/在/很","Sắp mưa rồi."]]},{"id":"g206","l":2,"n":"因为…所以…","name":"Quan hệ nhân quả","f":"因为 + Nguyên nhân，所以 + Kết quả","e":"因为 nêu nguyên nhân, 所以 nêu kết quả.","ex":[["因为|下雨|，|所以|我|没|去|。",3,"但是/如果/虽然","Vì trời mưa nên tôi không đi."],["因为|他|病|了|，|所以|没|来|上课|。",5,"但是/虽然/如果","Vì bị ốm nên anh ấy không đi học."]]},{"id":"g207","l":2,"n":"虽然…但是…","name":"Quan hệ nhượng bộ","f":"虽然 + A，但是 + B","e":"Dù A nhưng vẫn B; vế sau thường có 但是/可是.","ex":[["虽然|很|累|，|但是|我|很|高兴|。",4,"所以/因为/如果","Tuy rất mệt nhưng tôi rất vui."],["虽然|他|很|小|，|但是|很|聪明|。",5,"所以/因为/如果","Tuy còn nhỏ nhưng cậu ấy rất thông minh."]]},{"id":"g208","l":2,"n":"就","name":"Phó từ 就 (sớm, ngay)","f":"Thời gian + 就 + Động từ","e":"就 nhấn mạnh việc xảy ra sớm, nhanh hoặc ngay lập tức.","ex":[["我|一会儿|就|来|。",2,"很/的/都","Tôi đến ngay đây."],["他|八点|就|到|了|。",2,"很/都/的","Tám giờ anh ấy đã đến rồi."]]},{"id":"g209","l":2,"n":"得","name":"Bổ ngữ trình độ","f":"Động từ + 得 + (很) + Tính từ","e":"得 nối động từ với bổ ngữ đánh giá mức độ của hành động.","ex":[["他|跑|得|很|快|。",2,"的/地/了","Anh ấy chạy rất nhanh."],["你|说|得|很|好|。",2,"的/地/了","Bạn nói rất hay."]]},{"id":"g210","l":2,"n":"一下","name":"Động từ + 一下","f":"Động từ + 一下","e":"一下 làm nhẹ giọng, nghĩa “thử, một chút”.","ex":[["请|等|一下|。",2,"一个/一本/一张","Xin đợi một chút."],["你|来|一下|。",2,"一个/一本/一张","Bạn lại đây một chút."]]},{"id":"g211","l":2,"n":"还是","name":"Câu hỏi lựa chọn 还是","f":"A + 还是 + B？","e":"还是 dùng trong câu hỏi lựa chọn “A hay B?” (câu trần thuật dùng 或者).","ex":[["你|喝|茶|还是|咖啡|？",3,"或者/和/也","Bạn uống trà hay cà phê?"],["你|今天|去|还是|明天|去|？",3,"或者/和/也","Bạn đi hôm nay hay ngày mai?"]]},{"id":"g212","l":2,"n":"从…到…","name":"Từ… đến…","f":"从 + A + 到 + B","e":"Chỉ điểm bắt đầu và kết thúc của thời gian hoặc không gian.","ex":[["从|北京|到|上海|要|五个小时|。",0,"在/往/对","Từ Bắc Kinh đến Thượng Hải mất năm tiếng."],["我|从|早上|到|晚上|都|在|工作|。",1,"在/往/对","Tôi làm việc từ sáng đến tối."]]},{"id":"g213","l":2,"n":"离","name":"Khoảng cách với 离","f":"A + 离 + B + 近/远","e":"离 chỉ khoảng cách giữa hai nơi hoặc hai thời điểm.","ex":[["我家|离|学校|很|近|。",1,"从/在/到","Nhà tôi cách trường rất gần."],["机场|离|这儿|远|吗|？",1,"从/在/到","Sân bay cách đây có xa không?"]]},{"id":"g214","l":2,"n":"可以","name":"Cho phép với 可以","f":"可以 + Động từ","e":"可以 diễn tả sự cho phép hoặc có thể làm gì.","ex":[["这里|可以|拍照|吗|？",1,"是/在/有","Ở đây được chụp ảnh không?"],["你|可以|用|我|的|电脑|。",1,"是/在/有","Bạn có thể dùng máy tính của tôi."]]},{"id":"g215","l":2,"n":"每…都","name":"Mỗi… đều…","f":"每 + Lượng từ/Danh từ + 都 + Động từ","e":"每 thường đi với 都 để nhấn mạnh “không có ngoại lệ”.","ex":[["他|每天|都|跑步|。",2,"很/在/是","Ngày nào anh ấy cũng chạy bộ."],["每个人|都|喜欢|她|。",1,"很/在/是","Ai cũng thích cô ấy."]]},{"id":"g216","l":2,"n":"已经…了","name":"Đã… rồi","f":"已经 + Động từ + 了","e":"已经…了 nhấn mạnh việc đã hoàn thành.","ex":[["我|已经|吃|饭|了|。",1,"正在/在/很","Tôi ăn cơm rồi."],["他|已经|到|了|。",1,"正在/在/很","Anh ấy đã đến rồi."]]},{"id":"g217","l":2,"n":"一边…一边…","name":"Vừa… vừa…","f":"一边 + Động từ 1，一边 + Động từ 2","e":"Hai hành động diễn ra đồng thời.","ex":[["他|一边|吃饭|，|一边|看|电视|。",4,"一起/一样/一下","Anh ấy vừa ăn cơm vừa xem tivi."],["我们|一边|走|一边|聊天|。",3,"一起/一样/一下","Chúng tôi vừa đi vừa trò chuyện."]]},{"id":"g218","l":2,"n":"完/懂","name":"Bổ ngữ kết quả","f":"Động từ + 完/懂/到/好","e":"Bổ ngữ kết quả cho biết kết quả của hành động: 完 (xong), 懂 (hiểu), 到 (được).","ex":[["我|听|懂|了|。",2,"得/着/过","Tôi nghe hiểu rồi."],["作业|写|完|了|吗|？",2,"得/着/过","Bài tập viết xong chưa?"]]},{"id":"g301","l":3,"n":"把","name":"Câu chữ 把","f":"Chủ ngữ + 把 + Tân ngữ + Động từ + Thành phần khác","e":"把 đưa tân ngữ lên trước động từ để nhấn mạnh tác động lên nó; sau động từ phải có thành phần khác.","ex":[["请|把|门|关上|。",1,"被/让/给","Hãy đóng cửa lại."],["我|把|作业|做|完|了|。",1,"被/让/给","Tôi đã làm xong bài tập."]]},{"id":"g302","l":3,"n":"被","name":"Câu bị động 被","f":"Đối tượng + 被 + (Người làm) + Động từ + Thành phần khác","e":"被 diễn tả bị động, thường mang sắc thái không mong muốn.","ex":[["我的|钱包|被|偷|了|。",2,"把/对/向","Ví của tôi bị trộm rồi."],["杯子|被|他|打破|了|。",1,"把/对/向","Cái cốc bị anh ấy làm vỡ."]]},{"id":"g303","l":3,"n":"越来越","name":"Ngày càng","f":"越来越 + Tính từ/Động từ tâm lý","e":"越来越 diễn tả mức độ tăng dần theo thời gian.","ex":[["天气|越来越|热|了|。",1,"一点儿/有点儿/一边","Thời tiết ngày càng nóng."],["她的|汉语|越来越|好|。",2,"一点儿/有点儿/一边","Tiếng Trung của cô ấy ngày càng tốt."]]},{"id":"g304","l":3,"n":"越…越…","name":"Càng… càng…","f":"越 + A + 越 + B","e":"B thay đổi theo A.","ex":[["雨|越|下|越|大|。",3,"很/最/更","Mưa càng lúc càng to."],["我|越|学|越|喜欢|汉语|。",3,"很/最/更","Tôi càng học càng thích tiếng Trung."]]},{"id":"g305","l":3,"n":"除了…以外","name":"Ngoài… ra","f":"除了 + A (+ 以外)，都/也/还…","e":"除了…都: loại trừ A; 除了…还/也: bao gồm cả A.","ex":[["除了|小王|以外|，|大家|都|来|了|。",0,"因为/虽然/如果","Ngoài Tiểu Vương ra, mọi người đều đến."],["除了|英语|，|他|还|会|说|法语|。",0,"因为/虽然/如果","Ngoài tiếng Anh, anh ấy còn biết tiếng Pháp."]]},{"id":"g306","l":3,"n":"一…就…","name":"Hễ… là…","f":"一 + Động từ 1 + 就 + Động từ 2","e":"Hành động 2 xảy ra ngay sau hành động 1.","ex":[["我|一|到|家|就|睡觉|了|。",4,"才/还/都","Tôi vừa về đến nhà là đi ngủ."],["他|一|看|就|懂|了|。",3,"才/还/都","Anh ấy vừa nhìn là hiểu."]]},{"id":"g307","l":3,"n":"才","name":"Phó từ 才 (muộn, mới)","f":"Thời gian + 才 + Động từ","e":"才 nhấn mạnh việc xảy ra muộn hoặc khó khăn (trái nghĩa với 就).","ex":[["他|昨天|晚上|十二点|才|睡觉|，|太|晚|了|。",4,"就/都/还","Tối qua mười hai giờ anh ấy mới ngủ, muộn quá."],["等|了|一个|小时|，|他|才|来|。",6,"就/都/也","Đợi một tiếng đồng hồ anh ấy mới đến."]]},{"id":"g308","l":3,"n":"是…的","name":"Câu nhấn mạnh 是…的","f":"是 + Thông tin cần nhấn mạnh + Động từ + 的","e":"Nhấn mạnh thời gian, nơi chốn, cách thức của việc đã xảy ra.","ex":[["我|是|坐|飞机|来|的|。",5,"了/吗/呢","Tôi đến bằng máy bay."],["你|是|什么时候|到|的|？",4,"了/吗/呢","Bạn đến lúc nào vậy?"]]},{"id":"g309","l":3,"n":"又…又…","name":"Vừa… vừa… (tính chất)","f":"又 + Tính từ + 又 + Tính từ","e":"Nêu hai đặc điểm cùng tồn tại.","ex":[["这个|苹果|又|大|又|甜|。",4,"也/还/很","Quả táo này vừa to vừa ngọt."],["她|又|聪明|又|漂亮|。",3,"也/还/很","Cô ấy vừa thông minh vừa xinh đẹp."]]},{"id":"g310","l":3,"n":"如果…就…","name":"Câu điều kiện","f":"如果 + Điều kiện，(就) + Kết quả","e":"如果 nêu giả thiết, vế sau thường có 就.","ex":[["如果|明天|下雨|，|我们|就|不|去|了|。",5,"才/都/还","Nếu mai mưa thì chúng ta không đi nữa."],["如果|你|有|时间|，|就|来|我家|吧|。",5,"才/都/也","Nếu bạn có thời gian thì đến nhà tôi nhé."]]},{"id":"g311","l":3,"n":"比…多了","name":"So sánh mức độ","f":"A + 比 + B + Tính từ + 多了/一点儿","e":"Trong câu 比, dùng 多了 (hơn nhiều), 一点儿 (hơn một chút) sau tính từ.","ex":[["他|比|我|高|多了|。",4,"很/非常/真","Anh ấy cao hơn tôi nhiều."],["今天|比|昨天|冷|一点儿|。",4,"很/非常/有点儿","Hôm nay lạnh hơn hôm qua một chút."]]},{"id":"g312","l":3,"n":"跟…一样","name":"So sánh ngang bằng","f":"A + 跟 + B + 一样 (+ Tính từ)","e":"跟…一样 diễn tả A giống B.","ex":[["我|跟|他|一样|高|。",3,"比/很/非常","Tôi cao bằng anh ấy."],["这|本|书|跟|那|本|一样|有意思|。",6,"比/很/更","Quyển sách này hay như quyển kia."]]},{"id":"g313","l":3,"n":"只要…就…","name":"Chỉ cần… là…","f":"只要 + Điều kiện，就 + Kết quả","e":"Điều kiện đủ: chỉ cần A thì sẽ B.","ex":[["只要|努力|，|就|能|成功|。",3,"才/都/也","Chỉ cần cố gắng là có thể thành công."],["只要|你|喜欢|，|就|买|吧|。",4,"才/都/也","Chỉ cần bạn thích thì mua đi."]]},{"id":"g314","l":3,"n":"连…都/也…","name":"Ngay cả… cũng…","f":"连 + A + 都/也 + Động từ","e":"Nhấn mạnh trường hợp cực đoan.","ex":[["他|连|饭|都|没|吃|。",1,"跟/和/把","Anh ấy ngay cả cơm cũng chưa ăn."],["这|个|问题|连|孩子|都|知道|。",3,"跟/和/把","Câu hỏi này ngay cả trẻ con cũng biết."]]},{"id":"g315","l":3,"n":"不但…而且…","name":"Không những… mà còn…","f":"不但 + A，而且 + B","e":"Quan hệ tăng tiến: B ở mức cao hơn A.","ex":[["他|不但|会|说|汉语|，|而且|说|得|很|好|。",6,"但是/所以/因为","Anh ấy không những biết nói tiếng Trung mà còn nói rất giỏi."],["这里|不但|便宜|，|而且|很|干净|。",4,"但是/所以/因为","Ở đây không những rẻ mà còn rất sạch."]]},{"id":"g316","l":3,"n":"为了","name":"Mục đích với 为了","f":"为了 + Mục đích，…","e":"为了 nêu mục đích của hành động.","ex":[["为了|学|好|汉语|，|他|每天|练习|。",0,"因为/所以/如果","Để học tốt tiếng Trung, ngày nào anh ấy cũng luyện tập."],["我|为了|身体|健康|，|每天|跑步|。",1,"对/跟/从","Vì sức khỏe, ngày nào tôi cũng chạy bộ."]]},{"id":"g317","l":3,"n":"有点儿","name":"有点儿 + Tính từ","f":"有点儿 + Tính từ (không như ý)","e":"有点儿 đứng trước tính từ, thường mang ý không hài lòng; 一点儿 đứng sau tính từ.","ex":[["今天|有点儿|冷|。",1,"一点儿/多了/一下","Hôm nay hơi lạnh."],["这|件|衣服|有点儿|贵|。",3,"一点儿/多了/一下","Cái áo này hơi đắt."]]},{"id":"g318","l":3,"n":"先…然后…","name":"Trình tự hành động","f":"先 + A，然后/再 + B","e":"Nêu thứ tự trước sau của hành động.","ex":[["我们|先|吃饭|，|然后|去|看|电影|。",4,"所以/但是/因为","Chúng ta ăn cơm trước rồi đi xem phim."],["你|先|洗手|，|再|吃饭|。",4,"又/还/也","Con rửa tay trước rồi ăn cơm."]]},{"id":"g319","l":3,"n":"下来/进来","name":"Bổ ngữ xu hướng","f":"Động từ + 上/下/进/出 + 来/去","e":"来 hướng về người nói, 去 hướng ra xa người nói.","ex":[["他|从|楼上|走|下来|了|。",4,"上来/上去/进去","Anh ấy từ trên lầu đi xuống."],["外面|太|冷|了|，|快|进来|吧|。",6,"出去/下去/上去","Ngoài trời lạnh quá, mau vào đi."]]},{"id":"g320","l":3,"n":"V不懂","name":"Bổ ngữ khả năng","f":"Động từ + 得/不 + Bổ ngữ","e":"V得… (làm được), V不… (không làm được).","ex":[["他|说|得|太|快|，|我|听|不|懂|。",8,"没/别/很","Anh ấy nói nhanh quá, tôi nghe không hiểu."],["黑板|上|的|字|太|小|，|我|看|不|清楚|。",9,"没/别/很","Chữ trên bảng nhỏ quá, tôi nhìn không rõ."]]},{"id":"g401","l":4,"n":"V起来","name":"起来: bắt đầu một trạng thái","f":"Động từ/Tính từ + 起来","e":"起来 sau động từ hoặc tính từ diễn tả hành động, trạng thái bắt đầu và tiếp diễn.","ex":[["她|突然|哭|了|起来|。",4,"下去/上来/出来","Cô ấy bỗng òa khóc."],["天气|渐渐|暖和|起来|了|。",3,"下去/上来/出去","Thời tiết dần ấm lên."]]},{"id":"g402","l":4,"n":"看起来","name":"看起来: đánh giá qua cảm nhận","f":"看/听/吃/用 + 起来 + Nhận xét","e":"Dùng để nêu nhận xét dựa trên cảm nhận khi nhìn, nghe, ăn, dùng thử.","ex":[["这件|衣服|看起来|不错|。",2,"看下去/看出来/看过来","Cái áo này trông được đấy."],["这个|主意|听起来|很|好|。",2,"听下去/听出来/听过来","Ý tưởng này nghe hay đấy."]]},{"id":"g403","l":4,"n":"就是…也…","name":"Dù… cũng…","f":"就是 + Giả thiết，也 + Kết quả","e":"就是…也… nêu giả thiết nhượng bộ: dù điều đó xảy ra thì kết quả vẫn không đổi.","ex":[["就是|下雪|，|我们|也|要|去|。",0,"因为/所以/只有","Dù có tuyết rơi chúng tôi cũng phải đi."],["就是|你|不|说|，|我|也|知道|。",0,"因为/所以/只有","Dù bạn không nói tôi cũng biết."]]},{"id":"g404","l":4,"n":"不是…就是…","name":"Không phải… thì là…","f":"不是 + A，就是 + B","e":"Chỉ có hai khả năng, không A thì B.","ex":[["这|几天|不是|刮风|，|就是|下雨|。",5,"但是/所以/因为","Mấy hôm nay không gió thì mưa."],["周末|他|不是|看书|，|就是|睡觉|。",5,"但是/所以/因为","Cuối tuần anh ấy không đọc sách thì ngủ."]]},{"id":"g405","l":4,"n":"反而","name":"反而: trái lại","f":"…，(Chủ ngữ) + 反而 + Kết quả ngược","e":"反而 diễn tả kết quả trái với dự đoán thông thường.","ex":[["吃|了|药|，|他的|病|反而|更|重|了|。",6,"而且/一边/一下","Uống thuốc rồi, bệnh anh ấy trái lại còn nặng hơn."],["我|帮|了|他|，|他|反而|生气|了|。",6,"而且/一边/一下","Tôi giúp anh ấy, vậy mà anh ấy lại giận."]]},{"id":"g406","l":4,"n":"否则","name":"否则: nếu không thì","f":"Điều kiện cần làm，否则 + Hậu quả","e":"否则 nối vế sau, nêu hậu quả nếu không làm theo vế trước.","ex":[["快|走|吧|，|否则|要|迟到|了|。",4,"但是/因为/虽然","Đi nhanh thôi, nếu không sẽ muộn."],["你|必须|努力|，|否则|考|不|上|大学|。",4,"但是/因为/虽然","Bạn phải cố gắng, nếu không sẽ không đỗ đại học."]]},{"id":"g407","l":4,"n":"几乎","name":"几乎: hầu như, suýt","f":"几乎 + Động từ/Cụm từ","e":"几乎 nghĩa là “hầu như” hoặc “suýt nữa”.","ex":[["他|几乎|每天|都|加班|。",1,"一点儿/有点儿/一下","Hầu như ngày nào anh ấy cũng tăng ca."],["这|件|事|几乎|没有|人|知道|。",3,"一点儿/有点儿/一下","Chuyện này hầu như không ai biết."]]},{"id":"g408","l":4,"n":"尽量","name":"尽量: cố hết sức","f":"尽量 + Động từ","e":"尽量 diễn tả cố gắng đạt mức cao nhất có thể.","ex":[["我|会|尽量|早点儿|回来|。",2,"一下/一点儿/有点儿","Tôi sẽ cố về sớm."],["请|尽量|说|汉语|。",1,"一下/一点儿/有点儿","Hãy cố gắng nói tiếng Trung."]]},{"id":"g409","l":4,"n":"按照","name":"按照: theo, dựa theo","f":"按照 + Quy định/Kế hoạch + Động từ","e":"按照 nêu căn cứ để làm việc gì.","ex":[["请|按照|老师|的|要求|做|。",1,"对于/关于/由于","Hãy làm theo yêu cầu của thầy."],["我们|按照|计划|出发|。",1,"对于/关于/由于","Chúng tôi xuất phát theo kế hoạch."]]},{"id":"g410","l":4,"n":"毕竟","name":"毕竟: dù sao thì, rốt cuộc","f":"…，毕竟 + Lý do/Sự thật","e":"毕竟 nhấn mạnh một sự thật quan trọng cần được xét đến.","ex":[["他|毕竟|是|孩子|，|别|生气|了|。",1,"一下/正在/一起","Dù sao nó cũng là trẻ con, đừng giận nữa."],["这|毕竟|不是|你的|错|。",1,"一下/正在/一起","Dù sao đây cũng không phải lỗi của bạn."]]},{"id":"g411","l":4,"n":"干脆","name":"干脆: dứt khoát, cứ thế mà","f":"…，干脆 + Quyết định","e":"干脆 diễn tả quyết định thẳng thắn, dứt khoát.","ex":[["太|晚|了|，|干脆|别|回去|了|。",4,"因为/虽然/而且","Muộn quá rồi, thôi đừng về nữa."],["既然|买|不到|票|，|干脆|开车|去|吧|。",5,"因为/虽然/而且","Đã không mua được vé thì cứ lái xe đi luôn."]]},{"id":"g501","l":5,"n":"何况","name":"何况: huống hồ","f":"A 都…，何况 + B (呢)？","e":"何况 dùng để suy rộng: A còn vậy, huống hồ B.","ex":[["大人|都|搬|不|动|，|何况|孩子|呢|？",6,"因为/所以/而且","Người lớn còn không khiêng nổi, huống hồ trẻ con?"],["这|个|字|老师|都|不|认识|，|何况|我|呢|？",8,"因为/所以/而且","Chữ này thầy còn không biết, huống hồ tôi?"]]},{"id":"g502","l":5,"n":"既…又…","name":"既…又…: vừa… vừa…","f":"既 + A + 又/也 + B","e":"Nêu hai đặc điểm hoặc hai mặt cùng tồn tại.","ex":[["她|既|聪明|又|努力|。",1,"也/还/很","Cô ấy vừa thông minh vừa chăm chỉ."],["这个|办法|既|省钱|又|省时间|。",2,"也/还/很","Cách này vừa tiết kiệm tiền vừa tiết kiệm thời gian."]]},{"id":"g503","l":5,"n":"罢了","name":"罢了: chỉ… mà thôi","f":"(只是/不过) + … + 罢了","e":"罢了 ở cuối câu làm nhẹ ý, nghĩa “chỉ vậy thôi”.","ex":[["我|只是|开|个|玩笑|罢了|。",5,"了/吗/呢","Tôi chỉ đùa thôi mà."],["他|不过|是|个|孩子|罢了|。",5,"吗/呢/着","Nó chỉ là một đứa trẻ mà thôi."]]},{"id":"g504","l":5,"n":"趁","name":"趁: nhân lúc","f":"趁 + Thời cơ + Động từ","e":"趁 nghĩa là tận dụng thời cơ, điều kiện thuận lợi.","ex":[["趁|天|还|没|黑|，|我们|快|回|家|吧|。",0,"从/在/离","Nhân lúc trời chưa tối, chúng ta mau về nhà."],["你|趁|热|吃|吧|。",1,"从/在/离","Bạn ăn lúc còn nóng đi."]]},{"id":"g505","l":5,"n":"迟早","name":"迟早: sớm muộn","f":"迟早 + 会 + Động từ","e":"迟早 nghĩa là sớm hay muộn thì việc đó cũng xảy ra.","ex":[["这|件|事|迟早|会|被|发现|的|。",3,"已经/正在/曾经","Chuyện này sớm muộn cũng bị phát hiện."],["你|迟早|会|明白|的|。",1,"已经/正在/曾经","Sớm muộn gì bạn cũng sẽ hiểu."]]},{"id":"g506","l":5,"n":"简直","name":"简直: quả thực là","f":"简直 + Cụm từ (mang tính cường điệu)","e":"简直 nhấn mạnh mức độ gần như tuyệt đối, có ý cường điệu.","ex":[["这里|的|风景|简直|太|美|了|！",3,"几乎/差不多/一点儿","Phong cảnh ở đây quả thực đẹp quá!"],["他|简直|像|个|孩子|。",1,"一点儿/一下/一边","Anh ấy quả thực như một đứa trẻ."]]},{"id":"g507","l":5,"n":"反正","name":"反正: đằng nào cũng","f":"反正 + Sự thật không đổi","e":"反正 nhấn mạnh trong mọi trường hợp kết quả vẫn vậy.","ex":[["反正|没|事|，|我|陪|你|去|吧|。",0,"虽然/但是/而且","Đằng nào cũng rảnh, tôi đi cùng bạn."],["不管|你|信|不|信|，|反正|我|信|了|。",6,"虽然/但是/而且","Dù bạn tin hay không, dù sao tôi cũng tin rồi."]]},{"id":"g508","l":5,"n":"果然","name":"果然: quả nhiên","f":"(Dự đoán)，果然 + Kết quả đúng như vậy","e":"果然 cho biết sự việc xảy ra đúng như dự đoán.","ex":[["天气|预报|说|有|雨|，|果然|下|雨|了|。",6,"虽然/但是/如果","Dự báo nói có mưa, quả nhiên trời mưa."],["他|说|要|来|，|果然|来|了|。",5,"虽然/但是/如果","Anh ấy nói sẽ đến, quả nhiên đến thật."]]},{"id":"g509","l":5,"n":"好在","name":"好在: may mà","f":"Tình huống bất lợi，好在 + Điều may","e":"好在 nêu điều kiện thuận lợi giúp giảm bớt khó khăn.","ex":[["雨|下|得|很|大|，|好在|我|带|了|伞|。",6,"虽然/如果/即使","Mưa rất to, may mà tôi mang ô."],["路|很|远|，|好在|有|车|。",4,"虽然/如果/即使","Đường rất xa, may mà có xe."]]},{"id":"g510","l":5,"n":"难怪","name":"难怪: thảo nào","f":"Nguyên nhân，难怪 + Hiện tượng","e":"难怪 diễn tả hiểu ra nguyên nhân nên không còn thấy lạ.","ex":[["下|雪|了|，|难怪|这么|冷|。",4,"虽然/如果/即使","Tuyết rơi rồi, thảo nào lạnh thế."],["他|是|北京人|，|难怪|普通话|说|得|这么|好|。",4,"虽然/如果/即使","Anh ấy là người Bắc Kinh, thảo nào nói tiếng phổ thông hay vậy."]]},{"id":"g601","l":6,"n":"鉴于","name":"鉴于: xét thấy","f":"鉴于 + Tình hình，Quyết định","e":"鉴于 nêu căn cứ cho một quyết định, thường dùng trong văn viết.","ex":[["鉴于|天气|原因|，|比赛|推迟|了|。",0,"对于/关于/至于","Do thời tiết, trận đấu bị hoãn."],["鉴于|他|的|表现|，|公司|决定|给|他|升职|。",0,"对于/关于/至于","Xét thành tích của anh ấy, công ty quyết định thăng chức."]]},{"id":"g602","l":6,"n":"本着","name":"本着: dựa trên tinh thần","f":"本着 + Nguyên tắc/Tinh thần + Động từ","e":"本着 nêu nguyên tắc chỉ đạo cho hành động.","ex":[["我们|本着|互利|的|原则|合作|。",1,"对着/朝着/向着","Chúng tôi hợp tác trên nguyên tắc cùng có lợi."],["本着|负责|的|态度|，|他|重新|检查|了|一遍|。",0,"对着/朝着/向着","Với thái độ trách nhiệm, anh ấy kiểm tra lại một lượt."]]},{"id":"g603","l":6,"n":"从而","name":"从而: từ đó","f":"Nguyên nhân/Biện pháp，从而 + Kết quả","e":"从而 nối vế kết quả, đạt được nhờ biện pháp ở vế trước.","ex":[["他|改进|了|方法|，|从而|提高|了|效率|。",5,"因为/虽然/如果","Anh ấy cải tiến phương pháp, nhờ đó nâng cao hiệu suất."],["政府|加大|投入|，|从而|改善|了|环境|。",4,"因为/虽然/如果","Chính quyền tăng đầu tư, từ đó cải thiện môi trường."]]},{"id":"g604","l":6,"n":"不禁","name":"不禁: không kìm được","f":"(Tình huống)，Chủ ngữ + 不禁 + Động từ","e":"不禁 diễn tả phản ứng tự nhiên không kiềm chế được.","ex":[["听|到|这个|消息|，|她|不禁|哭|了|起来|。",6,"不必/不用/不要","Nghe tin này, cô ấy không kìm được bật khóc."],["看|着|老|照片|，|他|不禁|笑|了|。",6,"不必/不用/不要","Nhìn ảnh cũ, anh ấy bất giác mỉm cười."]]},{"id":"g605","l":6,"n":"不免","name":"不免: khó tránh khỏi","f":"(Tình huống)，不免 + Kết quả","e":"不免 nói một kết quả khó tránh khỏi trong hoàn cảnh đó.","ex":[["第一次|上台|，|不免|有些|紧张|。",3,"不必/不用/不要","Lần đầu lên sân khấu, khó tránh khỏi hơi hồi hộp."],["一个人|在|国外|，|不免|会|想|家|。",4,"不必/不用/不要","Một mình ở nước ngoài, khó tránh khỏi nhớ nhà."]]},{"id":"g606","l":6,"n":"顿时","name":"顿时: lập tức, bỗng chốc","f":"(Sự việc)，顿时 + Thay đổi","e":"顿时 diễn tả sự thay đổi xảy ra ngay lập tức, dùng cho việc đã qua.","ex":[["听|了|他|的|话|，|大家|顿时|安静|了|下来|。",7,"曾经/往往/一向","Nghe anh ấy nói, mọi người lập tức im lặng."],["灯|一|灭|，|房间|里|顿时|一片|漆黑|。",6,"曾经/往往/一向","Đèn vừa tắt, căn phòng bỗng chốc tối om."]]},{"id":"g607","l":6,"n":"姑且","name":"姑且: tạm thời cứ","f":"姑且 + Động từ","e":"姑且 nghĩa là tạm thời cứ <script>
const D=JSON.parse(document.getElementById("data").textContent);
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pickN=(a,n)=>shuffle(a.slice()).slice(0,n);
const today=()=>new Date().toLocaleDateString("sv");
/* ---------- dữ liệu ---------- */
const WORDS=D.words.map(([h,p,v,l,hv])=>({h,p,v,l,hv,k:h+p}));
const FIELDS=D.fields.map(f=>({...f,w:f.w.map(([h,p,v,hv])=>({h,p,v,hv,l:f.id,k:h+p}))}));
const GRAM=D.gram.map(g=>({...g,ex:g.ex.map(([z,b,d,v])=>{const t=z.split("|");return{t,b,d:d.split("/"),v,z:t.join("")}})}));
const PSG=D.psg.map((p,i)=>({...p,i}));
const LV=[1,2,3,4,5,6];
/* ---------- trạng thái ---------- */
const KEY="hoc-tieng-trung-v1";
const DEF={lv:1,src:"1",w:{},g:{},p:{},day:{d:"",n:0},streak:{last:"",days:0},goal:30,rate:.9,theme:"auto",ty:{n:0,ok:0},tone:{n:0,ok:0}};
let S;try{S=Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){S=structuredClone(DEF)}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const applyTheme=()=>{if(S.theme==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",S.theme)};applyTheme();
function tick(ok){if(S.day.d!==today()){S.day={d:today(),n:0}}if(ok)S.day.n++;if(S.streak.last!==today()){const y=new Date(Date.now()-864e5).toLocaleDateString("sv");S.streak.days=S.streak.last===y?S.streak.days+1:1;S.streak.last=today()}save()}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),2200)}
/* ---------- phát âm ---------- */
let zhVoice=null;function loadVoice(){const v=speechSynthesis.getVoices();zhVoice=v.find(x=>/zh[-_]CN/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang))||null}
if("speechSynthesis" in window){loadVoice();speechSynthesis.onvoiceschanged=loadVoice}
function speak(t,r){if(!("speechSynthesis" in window))return toast("Thiết bị không hỗ trợ đọc tiếng Trung");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";if(zhVoice)u.voice=zhVoice;u.rate=r||S.rate;speechSynthesis.speak(u)}
/* ---------- nguồn từ ---------- */
const srcWords=src=>{const f=FIELDS.find(x=>x.id===src);return f?f.w:WORDS.filter(w=>w.l===+src)};
const srcName=src=>{const f=FIELDS.find(x=>x.id===src);return f?f.n:"HSK"+src};
const ws=k=>S.w[k]||{s:0,d:0,c:0,x:0};
const learned=k=>ws(k).s>=3;
const INT=[10*60e3,864e5,3*864e5,7*864e5,14*864e5,30*864e5];
function grade(w,ok){const st=Object.assign({s:0,d:0,c:0,x:0},S.w[w.k]);if(ok){st.c++;st.s=Math.min(5,st.s+1)}else{st.x++;st.s=Math.max(0,st.s-2)}st.d=Date.now()+(ok?INT[st.s]:5*60e3);S.w[w.k]=st;tick(ok)}
function srcChips(cur,on){return`<div class="chips" role="group" aria-label="Chọn cấp độ">${LV.map(l=>`<button class="chip${cur==String(l)?" on":""}" data-src="${l}">HSK${l}</button>`).join("")}${FIELDS.map(f=>`<button class="chip${cur===f.id?" on":""}" data-src="${f.id}"><span class="zh">${f.zh}</span> ${esc(f.n)}</button>`).join("")}</div>`}
function bindSrc(fn){document.querySelectorAll("[data-src]").forEach(b=>b.onclick=()=>{S.src=b.dataset.src;if(LV.includes(+S.src))S.lv=+S.src;save();fn()})}
function lvChips(cur,fn){return`<div class="lvsel" role="group" aria-label="Chọn cấp HSK">${LV.map(l=>`<button class="lv${cur===l?" on":""}" data-lv="${l}">HSK${l}</button>`).join("")}</div>`}
function bindLv(fn){document.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{S.lv=+b.dataset.lv;S.src=String(S.lv);save();fn()})}
/* ---------- điều hướng ---------- */
let view="home",SES=null;
function go(v){view=v;SES=null;document.querySelectorAll("nav.tabs button").forEach(b=>{b.classList.toggle("on",b.dataset.v===v);b.setAttribute("aria-current",b.dataset.v===v?"page":"false")});speechSynthesis&&speechSynthesis.cancel();({home,vocab,gram,read,type,sound})[v]();window.scrollTo(0,0)}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>go(b.dataset.v));
const A=()=>$("app");
function hdr(t,sub){return`<header class="top"><div><h1>${t}</h1>${sub?`<p>${sub}</p>`:""}</div></header>`}
/* ---------- TRANG CHỦ ---------- */
function home(){const L=srcWords(String(S.lv)),wd=L[(new Date().getDate()*7+S.lv*13)%L.length],nl=L.filter(w=>learned(w.k)).length,
  G=GRAM.filter(g=>g.l===S.lv),ng=G.filter(g=>(S.g[g.id]||0)>=3).length,P=PSG.filter(p=>p.l===S.lv),np=P.filter(p=>S.p[p.i]).length,
  due=WORDS.filter(w=>S.w[w.k]&&S.w[w.k].d<=Date.now()&&S.w[w.k].s<5).length,dn=S.day.d===today()?S.day.n:0;
  A().innerHTML=`<section class="hero" aria-label="Từ của hôm nay"><div class="grid"><span class="zh">${esc([...wd.h][0])}</span></div>
   <div><h2 class="zh">${esc(wd.h)}</h2><div class="py">${esc(wd.p)}</div><p>${esc(wd.v)}${wd.hv?` · Hán Việt: ${esc(wd.hv)}`:""}</p>
   <div class="btns"><button class="btn" id="hSpk" aria-label="Nghe từ ${esc(wd.h)}">🔊 Nghe</button><button class="btn pri" id="hGo">${due?`Ôn ${due} từ đến hạn`:"Học từ mới"}</button></div></div></section>
  ${lvChips(S.lv)}
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>Hôm nay ${dn}/${S.goal} câu đúng</b><span class="muted small">Chuỗi ${S.streak.days} ngày</span></div><div class="bar"><i style="width:${Math.min(100,dn/S.goal*100)}%"></i></div></div>
  <div class="sec"><h3>Tiến độ HSK${S.lv}</h3><div class="rows">
   <button class="row" data-go="vocab"><span class="ic">词</span><span class="tx"><b>Từ vựng</b><small>Đã nhớ ${nl}/${L.length} từ</small><div class="bar"><i style="width:${nl/L.length*100}%"></i></div></span></button>
   <button class="row" data-go="gram"><span class="ic">法</span><span class="tx"><b>Ngữ pháp</b><small>Đã nắm ${ng}/${G.length} điểm ngữ pháp</small><div class="bar"><i style="width:${G.length?ng/G.length*100:0}%"></i></div></span></button>
   <button class="row" data-go="read"><span class="ic">读</span><span class="tx"><b>Đọc · Nghe</b><small>Đã làm đúng ${np}/${P.length} bài</small><div class="bar"><i style="width:${P.length?np/P.length*100:0}%"></i></div></span></button>
   <button class="row" data-go="type"><span class="ic">打</span><span class="tx"><b>Luyện gõ</b><small>Đã gõ đúng ${S.ty.ok}/${S.ty.n} lượt</small></span></button>
   <button class="row" data-go="sound"><span class="ic">音</span><span class="tx"><b>Phát âm</b><small>Thanh điệu, thanh mẫu, vận mẫu, 214 bộ thủ</small></span></button>
  </div></div>
  <div class="sec"><h3>Cài đặt</h3><div class="card">
   <label class="small" for="sGoal">Mục tiêu mỗi ngày</label><select id="sGoal" class="search">${[10,20,30,50,80].map(n=>`<option value="${n}"${S.goal===n?" selected":""}>${n} câu đúng</option>`).join("")}</select>
   <label class="small" for="sRate">Tốc độ đọc: <span id="sRateV">${S.rate.toFixed(1)}</span>×</label><input id="sRate" type="range" min=".5" max="1.3" step=".1" value="${S.rate}" style="width:100%;margin:6px 0 12px">
   <label class="small" for="sTheme">Giao diện</label><select id="sTheme" class="search"><option value="auto"${S.theme==="auto"?" selected":""}>Theo thiết bị</option><option value="light"${S.theme==="light"?" selected":""}>Sáng</option><option value="dark"${S.theme==="dark"?" selected":""}>Tối</option></select>
   <div class="btns"><button class="btn" id="sExp">Sao lưu tiến độ</button><button class="btn" id="sImp">Khôi phục</button><button class="btn" id="sReset">Xóa tiến độ</button></div>
   <p class="muted small" style="margin-bottom:0">Tiến độ lưu trên trình duyệt của thiết bị này. Dùng “Sao lưu tiến độ” để chuyển sang máy khác.</p></div></div>`;
  $("hSpk").onclick=()=>speak(wd.h);$("hGo").onclick=()=>{S.src=String(S.lv);go("vocab");startFlash()};bindLv(home);
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  $("sGoal").onchange=e=>{S.goal=+e.target.value;save();home()};$("sRate").oninput=e=>{S.rate=+e.target.value;$("sRateV").textContent=S.rate.toFixed(1);save()};$("sRate").onchange=()=>speak("你好");
  $("sTheme").onchange=e=>{S.theme=e.target.value;save();applyTheme()};
  $("sExp").onclick=async()=>{const t=btoa(unescape(encodeURIComponent(JSON.stringify(S))));try{await navigator.clipboard.writeText(t);toast("Đã sao chép mã sao lưu. Dán vào ghi chú để giữ lại")}catch(e){prompt("Sao chép mã sao lưu này:",t)}};
  $("sImp").onclick=()=>{const t=prompt("Dán mã sao lưu:");if(!t)return;try{S=Object.assign(structuredClone(DEF),JSON.parse(decodeURIComponent(escape(atob(t.trim())))));save();applyTheme();toast("Đã khôi phục tiến độ");home()}catch(e){toast("Mã sao lưu không hợp lệ")}};
  $("sReset").onclick=()=>{if(confirm("Xóa toàn bộ tiến độ trên thiết bị này?")){S=structuredClone(DEF);save();applyTheme();home();toast("Đã xóa tiến độ")}}}
/* ---------- TỪ VỰNG ---------- */
function vocab(){const L=srcWords(S.src),nl=L.filter(w=>learned(w.k)).length,due=L.filter(w=>S.w[w.k]&&S.w[w.k].d<=Date.now()&&S.w[w.k].s<5).length;
  A().innerHTML=hdr("Từ vựng",`${srcName(S.src)} · đã nhớ ${nl}/${L.length} từ`)+srcChips(S.src)+
  `<div class="rows"><button class="row" id="vFlash"><span class="ic">卡</span><span class="tx"><b>Thẻ ghi nhớ</b><small>${due?`${due} từ đến hạn ôn, `:""}nhắc lại theo lịch ngắt quãng</small></span></button>
   <button class="row" id="vQuiz"><span class="ic">考</span><span class="tx"><b>Kiểm tra 10 câu</b><small>Nghĩa, chữ Hán, pinyin, nghe, Hán Việt, thanh điệu</small></span></button>
   <button class="row" id="vList"><span class="ic">表</span><span class="tx"><b>Danh sách từ</b><small>Tra cứu, nghe phát âm</small></span></button></div>`;
  bindSrc(vocab);$("vFlash").onclick=startFlash;$("vQuiz").onclick=()=>startQuiz(srcWords(S.src));$("vList").onclick=wordList}
function startFlash(){const L=srcWords(S.src),now=Date.now(),due=shuffle(L.filter(w=>S.w[w.k]&&S.w[w.k].d<=now&&S.w[w.k].s<5)),fresh=L.filter(w=>!S.w[w.k]);
  const deck=due.slice(0,20).concat(fresh.slice(0,Math.max(0,20-due.length)).slice(0,10));if(!deck.length){toast("Đã ôn hết từ đến hạn. Hãy làm bài kiểm tra hoặc đổi cấp độ");return}
  SES={deck,i:0,ok:0};drawFlash()}
function drawFlash(){const s=SES,w=s.deck[s.i];
  A().innerHTML=hdr("Thẻ ghi nhớ",`${srcName(S.src)} · thẻ ${s.i+1}/${s.deck.length}`)+`<div class="card flash"><div class="gridrow${[...w.h].length>2?" s":""}">${[...w.h].map(c=>`<div class="grid"><span class="zh">${esc(c)}</span></div>`).join("")}</div>
   <div class="back" id="fBack"><button class="btn" id="fShow">Lật thẻ</button></div></div>

  if(sTab==="ini"||sTab==="fin")body=(sTab==="ini"?D.inits:D.fins).map(([g,items])=>`<div class="sec"><h3>${esc(g)}</h3><div class="ph">${items.map(x=>`<button class="phc" data-say="${esc(x[1])}" title="${esc(x[3])}"><b>${esc(x[0])}</b><span class="zh">${esc(x[1])}</span> <small class="muted">${esc(x[2])}</small></button>`).join("")}</div></div>`).join("")+`<p class="muted small">Chạm để nghe. Giữ con trỏ hoặc xem gợi ý bên dưới để biết cách phát âm.</p><div class="rows">${(sTab==="ini"?D.inits:D.fins).flatMap(([g,items])=>items).map(x=>`<div class="row"><span class="ic" style="font-family:var(--ui);font-size:16px">${esc(x[0])}</span><span class="tx"><small>${esc(x[3])}</small></span></div>`).join("")}</div>`;
  if(sTab==="rad")body=`<input class="search" id="rq" placeholder="Tìm bộ thủ theo chữ, Hán Việt hoặc nghĩa" aria-label="Tìm bộ thủ"><div class="rad" id="radG"></div><div class="card" id="radD" style="margin-top:12px" hidden></div>`;
  if(sTab==="quiz")body=`<div class="card" id="tq"></div>`;
  A().innerHTML=hdr("Phát âm","Nền tảng phát âm và chữ viết")+`<div class="chips">${tabs.map(([k,n])=>`<button class="chip${sTab===k?" on":""}" data-st="${k}">${n}</button>`).join("")}</div>`+body;
  document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{sTab=b.dataset.st;sound()});document.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say,.75));
  if(sTab==="rad"){const norm=s=>(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();let q="";const draw=()=>{const f=D.rads.filter(r=>!q||r.c.includes(q)||norm(r.hv).includes(norm(q))||norm(r.m).includes(norm(q))||String(r.n)===q);
      $("radG").innerHTML=f.map(r=>`<button class="radc" data-r="${r.n}"><span class="zh">${esc(r.c)}</span><small>${r.n} · ${esc(r.hv)}</small></button>`).join("")||`<p class="muted">Không có bộ thủ nào khớp.</p>`;
      document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const r=D.rads.find(x=>x.n===+b.dataset.r);const d=$("radD");d.hidden=false;d.innerHTML=`<div style="display:flex;gap:14px;align-items:center"><div class="grid" style="width:84px"><span class="zh" style="font-size:52px">${esc(r.c)}</span></div><div><b>Bộ ${esc(r.hv)} (số ${r.n})</b><div class="muted small">${esc(r.p)} · ${r.st} nét · ${esc(r.m)}</div>${r.ex?`<div class="zh" style="font-size:20px;margin-top:4px">Ví dụ: ${esc(r.ex)}</div>`:""}</div></div>`;speak(r.c);d.scrollIntoView({behavior:"smooth",block:"nearest"})})};
    $("rq").oninput=e=>{q=e.target.value.trim();draw()};draw()}
  if(sTab==="quiz")toneQuiz()}
function toneOf(p){for(const c of p){if(TM[c])return TM[c][1]+1}return 5}
function toneQuiz(){const L=WORDS.filter(w=>w.l<=2&&[...w.h].length===1&&toneOf(w.p)<5),w=L[Math.random()*L.length|0],t=toneOf(w.p);let lock=false;
  $("tq").innerHTML=`<div class="qhead"><span>Nghe rồi chọn thanh điệu</span><span>Đúng ${S.tone.ok}/${S.tone.n}</span></div><div class="prompt"><button class="btn pri" id="tqP">🔊 Nghe</button></div>
   <div class="opts">${[1,2,3,4].map(n=>`<button class="opt" data-t="${n}">Thanh ${n} <span aria-hidden="true">${["ˉ","ˊ","ˇ","ˋ"][n-1]}</span></button>`).join("")}</div><div class="fb" id="tqF"></div><div id="tqN"></div>`;
  speak(w.h,.7);$("tqP").onclick=()=>speak(w.h,.7);
  document.querySelectorAll("#tq [data-t]").forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const ok=+b.dataset.t===t;S.tone.n++;if(ok)S.tone.ok++;tick(ok);
    document.querySelectorAll("#tq [data-t]").forEach(x=>{x.disabled=true;if(+x.dataset.t===t)x.classList.add("ok")});if(!ok)b.classList.add("no");
    $("tqF").innerHTML=`<span class="${ok?"g":"r"}">${ok?"Chính xác":"Chưa đúng"}</span><div class="muted small" style="font-weight:400"><span class="zh">${esc(w.h)}</span> · ${esc(w.p)} · ${esc(w.v)}</div>`;
    $("tqN").innerHTML='<button class="btn pri wide">Câu tiếp</button>';$("tqN").firstChild.onclick=toneQuiz})}
go("home");

</script>

<style>
:root{--paper:#F6F8F7;--surface:#FFFFFF;--mist:#DFE7E4;--ink:#1E2B36;--soft:#5E6E78;--jade:#2E7D6B;--jade-2:#E3F0EC;--seal:#C0392B;--seal-2:#F8E6E3;--line:#D3DDD9;
  --zh:"Noto Serif SC","Songti SC","STSong","SimSun",serif;--ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#141D25;--surface:#1B2630;--mist:#24323D;--ink:#E7EEEC;--soft:#9AAAB2;--jade:#5DB49F;--jade-2:#1F3A35;--seal:#E06B5E;--seal-2:#3A2524;--line:#2E3E49;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#141D25;--surface:#1B2630;--mist:#24323D;--ink:#E7EEEC;--soft:#9AAAB2;--jade:#5DB49F;--jade-2:#1F3A35;--seal:#E06B5E;--seal-2:#3A2524;--line:#2E3E49;color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--ui);-webkit-font-smoothing:antialiased}
.zh{font-family:var(--zh)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
main{max-width:720px;margin:0 auto;padding:16px 16px 96px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
header.top h1{font-size:20px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.2px}
header.top p{margin:2px 0 0;color:var(--soft);font-size:13px}
.lvsel{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.lv{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600;min-height:40px}
.lv.on{border-color:var(--seal);color:var(--seal);background:var(--seal-2)}
.lv small{font-weight:500;color:var(--soft);margin-left:4px}
/* 米字格 */
.grid{position:relative;aspect-ratio:1;border:2px solid var(--seal);background:var(--surface);display:grid;place-items:center;border-radius:4px}
.grid::before,.grid::after{content:"";position:absolute;inset:0;pointer-events:none;background:
 linear-gradient(to right,transparent calc(50% - .5px),color-mix(in srgb,var(--seal) 38%,transparent) calc(50% - .5px),color-mix(in srgb,var(--seal) 38%,transparent) calc(50% + .5px),transparent calc(50% + .5px)),
 linear-gradient(to bottom,transparent calc(50% - .5px),color-mix(in srgb,var(--seal) 38%,transparent) calc(50% - .5px),color-mix(in srgb,var(--seal) 38%,transparent) calc(50% + .5px),transparent calc(50% + .5px))}
.grid::after{background:linear-gradient(45deg,transparent calc(50% - .4px),color-mix(in srgb,var(--seal) 22%,transparent) calc(50% - .4px),color-mix(in srgb,var(--seal) 22%,transparent) calc(50% + .4px),transparent calc(50% + .4px)),linear-gradient(-45deg,transparent calc(50% - .4px),color-mix(in srgb,var(--seal) 22%,transparent) calc(50% - .4px),color-mix(in srgb,var(--seal) 22%,transparent) calc(50% + .4px),transparent calc(50% + .4px))}
.grid .zh{position:relative;z-index:1;line-height:1;font-weight:700}
.gridrow{display:flex;justify-content:center;gap:0}.gridrow .grid{width:min(30vw,128px)}.gridrow .grid+.grid{border-left-width:0}
.gridrow .grid .zh{font-size:min(20vw,86px)}.gridrow.s .grid{width:min(18vw,78px)}.gridrow.s .grid .zh{font-size:min(12vw,52px)}
/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin:4px 0 20px}
.hero .grid{width:132px}.hero .grid .zh{font-size:84px}
.hero h2{font-size:28px;line-height:1.15;margin:0 0 4px;font-weight:700;letter-spacing:-.4px}
.hero .py{font-size:18px;color:var(--jade);font-weight:600}.hero p{margin:6px 0 10px;color:var(--soft)}
/* blocks */
.sec{margin:22px 0}.sec>h3{font-size:15px;margin:0 0 8px;color:var(--soft);font-weight:600}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:56px;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}.row .ic{width:40px;height:40px;flex:none;display:grid;place-items:center;font-family:var(--zh);font-size:22px;font-weight:700;border:1.5px solid var(--seal);color:var(--seal);border-radius:4px}
.row .tx{flex:1;min-width:0}.row .tx b{display:block;font-weight:600}.row .tx small{color:var(--soft);font-size:13px}
.row .meta{font-size:13px;color:var(--soft);text-align:right;white-space:nowrap}
.bar{height:6px;border-radius:999px;background:var(--mist);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--jade);border-radius:999px;transition:width .4s}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;min-height:44px}
.btn.pri{background:var(--jade);border-color:var(--jade);color:var(--surface)}.btn.wide{width:100%}.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.muted{color:var(--soft)}.small{font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px}.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--soft);margin-bottom:6px}
.qkind{display:inline-block;font-size:12px;font-weight:600;color:var(--jade);background:var(--jade-2);border-radius:6px;padding:2px 8px;margin-bottom:10px}
.prompt{text-align:center;margin:10px 0 14px}.prompt .big{font-family:var(--zh);font-size:56px;font-weight:700;line-height:1.15}.prompt .mid{font-size:22px;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opts.one{grid-template-columns:1fr}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;min-height:56px;font-size:17px;text-align:center}
.opt.zh{font-family:var(--zh);font-size:24px}.opt.ok{border-color:var(--jade);background:var(--jade-2)}.opt.no{border-color:var(--seal);background:var(--seal-2)}
.fb{min-height:24px;margin:10px 0;font-weight:600;text-align:center}.fb .g{color:var(--jade)}.fb .r{color:var(--seal)}
/* flashcard */
.flash{display:grid;justify-items:center;gap:10px;padding:18px 16px}.flash .back{text-align:center;min-height:96px}
.flash .back .py{font-size:22px;color:var(--jade);font-weight:600}.flash .back .vi{font-size:18px}.flash .back .hv{color:var(--soft);font-size:14px}
/* reading */
.ptext{font-family:var(--zh);font-size:22px;line-height:1.9;margin:0}.pvi{margin:10px 0 0;color:var(--soft);border-left:3px solid var(--mist);padding-left:10px}
.qblock{margin-top:16px}.qblock p{margin:0 0 8px;font-weight:600}.qblock p .zh{font-weight:700}
/* typing */
.tyin{width:100%;font-family:var(--zh);font-size:28px;text-align:center;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.tyin.ok{border-color:var(--jade)}.tyin.no{border-color:var(--seal)}
.hints{margin:10px 0;min-height:24px;text-align:center}.hints div{margin:2px 0}.hints small{color:var(--soft);margin-right:6px}
/* grammar */
details.gp{border-top:1px solid var(--line);padding:12px 14px}details.gp:first-child{border-top:0}details.gp summary{list-style:none;display:flex;gap:12px;align-items:center;cursor:pointer}details.gp summary::-webkit-details-marker{display:none}
.gpat{min-width:72px;font-family:var(--zh);font-size:20px;font-weight:700;color:var(--seal)}.gform{margin:10px 0 6px;font-weight:600;font-size:14px;padding:8px 10px;border-radius:8px;background:var(--mist)}
.gex{display:flex;gap:8px;align-items:flex-start;margin:8px 0}.gex .zh{font-size:19px}.gex mark{background:none;color:var(--seal);text-decoration:underline;text-underline-offset:4px}
.order{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:8px 0}
.order.ok{border-color:var(--jade);background:var(--jade-2)}.order.no{border-color:var(--seal)}.tile{font-family:var(--zh);font-size:20px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;min-height:44px}
.pick{font-family:var(--zh);font-size:20px;padding:2px 8px;border-radius:8px;background:var(--mist)}
/* sound */
.tones{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tone{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left}
.tone svg{width:100%;height:40px;display:block;margin-bottom:6px}.tone b{font-size:18px}.tone .zh{font-size:22px;margin-left:6px}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}.phc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;min-height:72px}
.phc b{display:block;font-size:20px}.phc .zh{font-size:18px;color:var(--soft)}
.rad{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}.radc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;min-height:64px}
.radc .zh{font-size:26px;display:block;line-height:1.2}.radc small{font-size:11px;color:var(--soft)}
/* word list */
.search{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;margin-bottom:10px}
.wl .row{min-height:52px}.wl .zh{font-size:22px;min-width:64px}.dot{width:8px;height:8px;border-radius:50%;background:var(--mist);flex:none}.dot.l1{background:#9CC5BA}.dot.l2{background:var(--jade)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{display:flex;width:100%;max-width:720px}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 6px;font-size:11px;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
nav.tabs .z{font-family:var(--zh);font-size:19px;font-weight:700;width:30px;height:30px;display:grid;place-items:center;border:1.5px solid transparent;border-radius:4px}
nav.tabs button.on{color:var(--ink);font-weight:600}nav.tabs button.on .z{border-color:var(--seal);color:var(--seal)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.hero .btns{justify-content:center}}
</style>
</head>

 viên, mẹ làm việc ở trường học.","qs":[["爸爸在哪儿工作？","Bố làm việc ở đâu?",["医院","学校","商店"]],["他家有几个人？","Nhà cậu ấy có mấy người?",["三个","四个","两个"]]]},{"l":2,"s":0,"k":"Đoạn văn","t":"小李每天早上六点起床，然后去跑步。他觉得运动对身体很好。今天下雨了，他不能出去，所以在家里看书。","vi":"Tiểu Lý mỗi sáng dậy lúc 6 giờ rồi đi chạy bộ. Cậu thấy vận động rất tốt cho sức khỏe. Hôm nay trời mưa, cậu không ra ngoài được nên ở nhà đọc sách.","qs":[["小李每天早上做什么？","Mỗi sáng Tiểu Lý làm gì?",["跑步","游泳","唱歌"]],["今天他为什么在家？","Vì sao hôm nay cậu ở nhà?",["因为下雨了","因为生病了","因为要上班"]]]},{"l":2,"s":1,"k":"Hội thoại","t":"男：服务员，这件衣服多少钱？女：五百块。男：太贵了，有便宜一点儿的吗？女：有，那件白色的三百块。男：好，我买白色的。","vi":"Nam: Chị ơi, cái áo này bao nhiêu tiền? Nữ: 500 tệ. Nam: Đắt quá, có cái nào rẻ hơn không? Nữ: Có, cái màu trắng kia 300 tệ. Nam: Được, tôi mua cái trắng.","qs":[["白色的衣服多少钱？","Áo màu trắng giá bao nhiêu?",["三百块","五百块","两百块"]],["男的觉得第一件衣服怎么样？","Người nam thấy cái áo đầu tiên thế nào?",["太贵了","很便宜","颜色不好"]]]},{"l":2,"s":2,"k":"Đoạn văn","t":"我的妹妹今年十八岁，她非常喜欢跳舞。她希望以后能去北京学习跳舞。我觉得她一定可以。","vi":"Em gái tôi năm nay 18 tuổi, em rất thích nhảy múa. Em hy vọng sau này có thể đến Bắc Kinh học múa. Tôi nghĩ em nhất định làm được.","qs":[["妹妹喜欢什么？","Em gái thích gì?",["跳舞","唱歌","踢足球"]],["妹妹希望去哪儿学习？","Em gái hy vọng đi đâu học?",["北京","上海","机场"]]]},{"l":2,"s":3,"k":"Hội thoại","t":"女：你什么时候去机场？男：我是下午三点的飞机，两点到机场。女：我送你去吧。男：谢谢，不用了，我坐出租车去。","vi":"Nữ: Khi nào anh ra sân bay? Nam: Máy bay của tôi lúc 3 giờ chiều, 2 giờ tôi đến sân bay. Nữ: Để em đưa anh đi nhé. Nam: Cảm ơn, không cần đâu, tôi đi taxi.","qs":[["男的是几点的飞机？","Máy bay của người nam lúc mấy giờ?",["三点","两点","四点"]],["男的怎么去机场？","Người nam đi sân bay bằng gì?",["坐出租车","坐公共汽车","女的送他"]]]},{"l":3,"s":0,"k":"Đoạn văn","t":"最近我的邻居养了一只小狗。它非常可爱，可是晚上总是叫，让我睡不好觉。我跟邻居说了这个问题，他们很热情地向我道歉，还说会照顾好小狗。现在晚上安静多了。","vi":"Gần đây hàng xóm tôi nuôi một chú chó nhỏ. Nó rất đáng yêu nhưng tối nào cũng sủa, làm tôi ngủ không ngon. Tôi nói chuyện này với hàng xóm, họ nhiệt tình xin lỗi và nói sẽ chăm sóc chú chó cẩn thận. Bây giờ buổi tối yên tĩnh hơn nhiều.","qs":[["我为什么睡不好觉？","Vì sao tôi ngủ không ngon?",["小狗晚上叫","邻居晚上唱歌","天气太热"]],["现在情况怎么样？","Bây giờ tình hình thế nào?",["晚上安静多了","小狗被送走了","我搬家了"]]]},{"l":3,"s":1,"k":"Hội thoại","t":"女：你周末打算做什么？男：我想去爬山，你有兴趣吗？女：当然有！不过听说周末会下雨。男：那我们先看看天气，如果下雨就去图书馆。","vi":"Nữ: Cuối tuần anh định làm gì? Nam: Tôi muốn đi leo núi, em có hứng thú không? Nữ: Tất nhiên rồi! Nhưng nghe nói cuối tuần sẽ mưa. Nam: Vậy mình xem thời tiết trước, nếu mưa thì đi thư viện.","qs":[["男的周末想做什么？","Cuối tuần người nam muốn làm gì?",["爬山","看电影","去超市"]],["如果下雨，他们会去哪儿？","Nếu mưa họ sẽ đi đâu?",["图书馆","超市","公园"]]]},{"l":3,"s":2,"k":"Đoạn văn","t":"我小时候数学成绩很差，每次考试都很担心。后来，一位新老师来到我们班。她讲课很清楚，也很关心我们。在她的帮助下，我的成绩提高了很多，现在我非常喜欢数学。","vi":"Hồi nhỏ tôi học toán rất kém, lần thi nào cũng lo lắng. Về sau, một cô giáo mới đến lớp tôi. Cô giảng bài rất rõ ràng và rất quan tâm đến chúng tôi. Nhờ sự giúp đỡ của cô, điểm của tôi tiến bộ nhiều, giờ tôi rất thích toán.","qs":[["我以前数学怎么样？","Trước đây tôi học toán thế nào?",["很差","很好","一般"]],["我的成绩为什么提高了？","Vì sao điểm của tôi tiến bộ?",["新老师的帮助","我去留学了","我换了学校"]]]},{"l":3,"s":3,"k":"Hội thoại","t":"男：你的行李箱怎么这么重？女：里面有很多书和礼物，是给我爷爷奶奶的。男：我帮你拿吧。女：太好了，谢谢你！我们坐电梯上楼吧。","vi":"Nam: Sao va li của em nặng thế? Nữ: Bên trong có nhiều sách và quà, là cho ông bà em. Nam: Để anh xách giúp. Nữ: Tốt quá, cảm ơn anh! Mình đi thang máy lên lầu nhé.","qs":[["行李箱里有什么？","Trong va li có gì?",["书和礼物","衣服和鞋","水果和饮料"]],["礼物是给谁的？","Quà dành cho ai?",["爷爷奶奶","爸爸妈妈","邻居"]]]},{"l":4,"s":0,"k":"Đoạn văn","t":"很多人认为，成功的关键是聪明。其实，坚持更加重要。一个人即使很聪明，如果遇到困难就放弃，也很难获得成功。相反，那些每天积极努力、从不放弃的人，往往能实现自己的理想。","vi":"Nhiều người cho rằng chìa khóa của thành công là thông minh. Thật ra kiên trì còn quan trọng hơn. Một người dù thông minh nhưng gặp khó khăn đã bỏ cuộc thì cũng khó thành công. Ngược lại, những người ngày nào cũng tích cực cố gắng, không bao giờ bỏ cuộc thường có thể thực hiện lý tưởng của mình.","qs":[["作者认为成功最重要的是什么？","Tác giả cho rằng điều quan trọng nhất để thành công là gì?",["坚持","聪明","运气"]],["遇到困难就放弃的人会怎么样？","Người gặp khó khăn liền bỏ cuộc sẽ thế nào?",["很难成功","很快成功","更加聪明"]]]},{"l":4,"s":1,"k":"Hội thoại","t":"女：听说你最近换工作了？男：是啊，以前的公司离家太远，每天堵车要两个小时。女：新工作怎么样？男：工资虽然低一点儿，但是压力小，而且走路十分钟就到了。","vi":"Nữ: Nghe nói dạo này anh đổi việc à? Nam: Ừ, công ty cũ xa nhà quá, ngày nào tắc đường cũng mất hai tiếng. Nữ: Công việc mới thế nào? Nam: Lương tuy thấp hơn một chút nhưng áp lực ít, hơn nữa đi bộ mười phút là tới.","qs":[["男的为什么换工作？","Vì sao người nam đổi việc?",["以前的公司离家太远","以前的工资太低","以前的压力太小"]],["关于新工作，哪个是对的？","Về công việc mới, câu nào đúng?",["离家很近","工资更高","压力很大"]]]},{"l":4,"s":2,"k":"Đoạn văn","t":"网上购物越来越流行。它的好处是方便，价格也比较便宜，不用出门就能买到需要的东西。但是，网上商品的质量不一定都好，有时候和图片上的样子差别很大。所以，购物时要仔细看看别人的评价。","vi":"Mua sắm trực tuyến ngày càng thịnh hành. Lợi ích là tiện lợi, giá cũng khá rẻ, không cần ra khỏi nhà cũng mua được thứ cần. Nhưng chất lượng hàng trên mạng không phải lúc nào cũng tốt, đôi khi khác xa hình ảnh. Vì vậy khi mua nên xem kỹ đánh giá của người khác.","qs":[["网上购物有什么好处？","Mua sắm trực tuyến có lợi ích gì?",["方便又便宜","质量都很好","可以试穿"]],["作者建议购物时怎么做？","Tác giả khuyên khi mua sắm nên làm gì?",["仔细看别人的评价","只买贵的东西","先去商店比较"]]]},{"l":5,"s":0,"k":"Đoạn văn","t":"中国有句古话：“读万卷书，行万里路。”意思是除了读书以外，还要多出去走走，亲自体验不同地方的生活。现在越来越多的年轻人利用假期去旅行，他们认为旅行不仅能放松心情，还能开阔眼界，增长见识。","vi":"Trung Quốc có câu nói cổ: “Đọc vạn quyển sách, đi vạn dặm đường.” Nghĩa là ngoài đọc sách còn phải ra ngoài nhiều, tự mình trải nghiệm cuộc sống ở những nơi khác nhau. Ngày nay ngày càng nhiều người trẻ tận dụng kỳ nghỉ để du lịch, họ cho rằng du lịch không chỉ giúp thư giãn mà còn mở mang tầm mắt, tăng hiểu biết.","qs":[["“读万卷书，行万里路”是什么意思？","Câu “đọc vạn quyển sách, đi vạn dặm đường” nghĩa là gì?",["既要读书，也要亲自体验生活","只要多读书就够了","旅行比读书更重要"]],["年轻人认为旅行有什么好处？","Người trẻ cho rằng du lịch có lợi ích gì?",["放松心情，开阔眼界","可以赚很多钱","能找到好工作"]]]},{"l":5,"s":1,"k":"Hội thoại","t":"女：小王，你的简历我看过了，你为什么想来我们公司？男：贵公司在这个行业很有名，而且我很欣赏你们的企业文化。女：你以前有相关的工作经验吗？男：我在大学期间在一家网络公司实习过半年，主要负责数据分析。","vi":"Nữ: Tiểu Vương, tôi đã xem sơ yếu lý lịch của anh, vì sao anh muốn vào công ty chúng tôi? Nam: Quý công ty rất nổi tiếng trong ngành, hơn nữa tôi rất thích văn hóa doanh nghiệp của công ty. Nữ: Trước đây anh có kinh nghiệm liên quan không? Nam: Thời đại học tôi từng thực tập nửa năm ở một công ty mạng, chủ yếu phụ trách phân tích dữ liệu.","qs":[["这段对话最可能发生在哪里？","Đoạn hội thoại này nhiều khả năng diễn ra ở đâu?",["面试中","商店里","医院里"]],["男的实习时主要做什么？","Khi thực tập người nam chủ yếu làm gì?",["数据分析","销售产品","设计网站"]]]},{"l":5,"s":2,"k":"Đoạn văn","t":"熬夜已经成为很多年轻人的生活习惯。有人熬夜工作，有人熬夜玩手机。专家指出，长期熬夜会影响人的记忆力，还会导致免疫力下降。因此，专家建议大家每天至少保证七个小时的睡眠，尽量在十一点以前睡觉。","vi":"Thức khuya đã trở thành thói quen của nhiều người trẻ. Có người thức khuya làm việc, có người thức khuya chơi điện thoại. Chuyên gia chỉ ra rằng thức khuya lâu dài sẽ ảnh hưởng trí nhớ và làm giảm sức đề kháng. Vì vậy chuyên gia khuyên mỗi ngày nên ngủ ít nhất bảy tiếng, cố gắng đi ngủ trước 11 giờ.","qs":[["长期熬夜会造成什么后果？","Thức khuya lâu dài gây hậu quả gì?",["记忆力变差","身材变苗条","工作效率提高"]],["专家建议每天至少睡多长时间？","Chuyên gia khuyên mỗi ngày ngủ ít nhất bao lâu?",["七个小时","五个小时","九个小时"]]]},{"l":5,"s":3,"k":"Hội thoại","t":"男：这套房子面积不小，阳台也很大，就是离地铁站有点儿远。女：不过附近环境很安静，房租也比较便宜。男：那我们再考虑一下交通的问题，要不周末再来看看？女：好，我先跟中介说一声。","vi":"Nam: Căn hộ này diện tích không nhỏ, ban công cũng rộng, chỉ có điều hơi xa ga tàu điện ngầm. Nữ: Nhưng môi trường xung quanh rất yên tĩnh, tiền thuê cũng khá rẻ. Nam: Vậy mình cân nhắc thêm vấn đề đi lại, hay cuối tuần lại đến xem? Nữ: Được, để em báo với bên môi giới trước.","qs":[["这套房子有什么缺点？","Căn hộ này có nhược điểm gì?",["离地铁站远","面积太小","房租太贵"]],["他们打算怎么做？","Họ định làm gì?",["周末再来看看","马上签合同","放弃这套房子"]]]},{"l":5,"s":5,"k":"Hội thoại","t":"女：你最近怎么总是失眠？男：公司在进行一个重要项目，压力特别大。女：你应该学会调整心态，适当运动一下，比如打太极拳。男：好主意，我明天就去公园试试。","vi":"Nữ: Sao dạo này anh hay mất ngủ thế? Nam: Công ty đang làm một dự án quan trọng, áp lực rất lớn. Nữ: Anh nên học cách điều chỉnh tâm lý, vận động vừa phải, ví dụ tập Thái cực quyền. Nam: Ý hay đấy, mai anh ra công viên thử.","qs":[["男的为什么失眠？","Vì sao người nam mất ngủ?",["工作压力大","身体生病了","邻居太吵"]],["女的建议男的做什么？","Người nữ khuyên người nam làm gì?",["运动，比如打太极拳","换一份工作","去医院看病"]]]},{"l":1,"s":0,"k":"Đoạn văn","t":"我是老师，我在学校工作。我有很多学生。","vi":"Tôi là giáo viên, tôi làm việc ở trường học. Tôi có rất nhiều học sinh.","qs":[["他在哪儿工作？","Anh ấy làm việc ở đâu?",["学校","医院","商店"]],["他是做什么的？","Anh ấy làm nghề gì?",["老师","医生","学生"]]]},{"l":1,"s":0,"k":"Hội thoại","t":"男：你叫什么名字？女：我叫李月。男：你是中国人吗？女：是，我是北京人。","vi":"Nam: Bạn tên gì? Nữ: Tôi tên Lý Nguyệt. Nam: Bạn là người Trung Quốc à? Nữ: Đúng, tôi là người Bắc Kinh.","qs":[["女的叫什么名字？","Người nữ tên gì?",["李月","王月","李小"]],["女的是哪儿人？","Người nữ là người ở đâu?",["北京人","不是中国人","不知道"]]]},{"l":1,"s":0,"k":"Đoạn văn","t":"今天很热。我想喝水，不想喝茶。","vi":"Hôm nay rất nóng. Tôi muốn uống nước, không muốn uống trà.","qs":[["今天天气怎么样？","Thời tiết hôm nay thế nào?",["很热","很冷","下雨"]],["我想喝什么？","Tôi muốn uống gì?",["水","茶","米饭"]]]},{"l":1,"s":0,"k":"Hội thoại","t":"女：这个杯子多少钱？男：八块。女：我买两个。","vi":"Nữ: Cái cốc này bao nhiêu tiền? Nam: Tám tệ. Nữ: Tôi mua hai cái.","qs":[["一个杯子多少钱？","Một cái cốc bao nhiêu tiền?",["八块","两块","十块"]],["女的买几个？","Người nữ mua mấy cái?",["两个","一个","八个"]]]},{"l":1,"s":1,"k":"Đoạn văn","t":"我家有一只猫和一只狗。猫很小，狗很大。我很喜欢它们。","vi":"Nhà tôi có một con mèo và một con chó. Mèo rất nhỏ, chó rất to. Tôi rất thích chúng.","qs":[["我家有什么？","Nhà tôi có gì?",["一只猫和一只狗","两只猫","两只狗"]],["狗怎么样？","Con chó thế nào?",["很大","很小","不漂亮"]]]},{"l":1,"s":1,"k":"Hội thoại","t":"男：你明天去哪儿？女：我去商店买东西。男：我和你一起去，好吗？女：好啊！","vi":"Nam: Mai bạn đi đâu? Nữ: Tôi đi cửa hàng mua đồ. Nam: Tôi đi cùng bạn nhé? Nữ: Được thôi!","qs":[["女的明天去哪儿？","Ngày mai người nữ đi đâu?",["商店","医院","学校"]],["女的去做什么？","Người nữ đi làm gì?",["买东西","看医生","工作"]]]},{"l":1,"s":1,"k":"Đoạn văn","t":"现在是上午十点。我在家里看书。下午我去朋友家。","vi":"Bây giờ là 10 giờ sáng. Tôi đang đọc sách ở nhà. Buổi chiều tôi đến nhà bạn.","qs":[["现在几点？","Bây giờ là mấy giờ?",["上午十点","下午十点","上午九点"]],["下午我去哪儿？","Buổi chiều tôi đi đâu?",["朋友家","学校","饭店"]]]},{"l":1,"s":1,"k":"Hội thoại","t":"女：你会说汉语吗？男：会一点儿。女：你在哪儿学习汉语？男：在北京的学校。","vi":"Nữ: Bạn biết nói tiếng Hán không? Nam: Biết một chút. Nữ: Bạn học tiếng Hán ở đâu? Nam: Ở một trường tại Bắc Kinh.","qs":[["男的会说汉语吗？","Người nam có biết nói tiếng Hán không?",["会一点儿","不会","说得很好"]],["男的在哪儿学汉语？","Người nam học tiếng Hán ở đâu?",["北京的学校","家里","饭店"]]]},{"l":1,"s":2,"k":"Đoạn văn","t":"星期天，我和爸爸妈妈去饭店吃饭。我们吃了米饭和很多菜。菜很好吃，我很高兴。","vi":"Chủ nhật, tôi cùng bố mẹ đi nhà hàng ăn cơm. Chúng tôi ăn cơm và rất nhiều món. Món ăn rất ngon, tôi rất vui.","qs":[["他们什么时候去饭店？","Khi nào họ đi nhà hàng?",["星期天","星期一","昨天上午"]],["菜怎么样？","Món ăn thế nào?",["很好吃","不好吃","太少了"]]]},{"l":1,"s":2,"k":"Hội thoại","t":"男：喂，你在哪儿？女：我在火车站。男：你几点回来？女：下午三点。","vi":"Nam: Alô, em đang ở đâu? Nữ: Em ở ga tàu hỏa. Nam: Mấy giờ em về? Nữ: Ba giờ chiều.","qs":[["女的在哪儿？","Người nữ đang ở đâu?",["火车站","飞机上","商店"]],["女的几点回来？","Mấy giờ người nữ về?",["下午三点","上午三点","下午四点"]]]},{"l":1,"s":2,"k":"Đoạn văn","t":"我的朋友叫大明，他今年二十岁。他是学生，很喜欢电影。他有很多中国电影。","vi":"Bạn tôi tên Đại Minh, năm nay 20 tuổi. Cậu ấy là học sinh, rất thích phim. Cậu ấy có rất nhiều phim Trung Quốc.","qs":[["大明多大？","Đại Minh bao nhiêu tuổi?",["二十岁","十二岁","二十二岁"]],["大明喜欢什么？","Đại Minh thích gì?",["电影","电脑","水果"]]]},{"l":1,"s":2,"k":"Hội thoại","t":"女：桌子上的书是谁的？男：是我的。女：我能看看吗？男：能，请看。","vi":"Nữ: Quyển sách trên bàn là của ai? Nam: Của tôi. Nữ: Tôi xem được không? Nam: Được, mời xem.","qs":[["书是谁的？","Sách là của ai?",["男的","女的","老师"]],["书在哪儿？","Sách ở đâu?",["桌子上","椅子上","电脑里"]]]},{"l":1,"s":3,"k":"Đoạn văn","t":"昨天下雨了，很冷。我没去学校，在家里看电视。晚上，我的同学打电话给我，说明天有汉语课。我想明天早上七点去学校。","vi":"Hôm qua trời mưa, rất lạnh. Tôi không đến trường mà ở nhà xem tivi. Buổi tối bạn học gọi điện cho tôi, nói ngày mai có tiết tiếng Hán. Tôi định 7 giờ sáng mai đến trường.","qs":[["昨天天气怎么样？","Hôm qua thời tiết thế nào?",["下雨，很冷","很热","不冷不热"]],["我明天几点去学校？","Mai mấy giờ tôi đến trường?",["七点","八点","九点"]]]},{"l":1,"s":3,"k":"Hội thoại","t":"男：你好，我想买一些水果。女：我们这儿的苹果很好吃。男：苹果多少钱一个？女：三块。男：好，我买五个。","vi":"Nam: Chào chị, tôi muốn mua ít hoa quả. Nữ: Táo ở đây rất ngon. Nam: Táo bao nhiêu tiền một quả? Nữ: Ba tệ. Nam: Được, tôi mua năm quả.","qs":[["男的想买什么？","Người nam muốn mua gì?",["水果","衣服","书"]],["男的要给多少钱？","Người nam phải trả bao nhiêu tiền?",["十五块","三块","五块"]]]},{"l":1,"s":3,"k":"Đoạn văn","t":"我住在北京。我家前面有一个商店，后面有一个医院。我爸爸在那个医院工作，他是医生。我妈妈不工作，她在家里做饭。","vi":"Tôi sống ở Bắc Kinh. Phía trước nhà tôi có một cửa hàng, phía sau có một bệnh viện. Bố tôi làm việc ở bệnh viện đó, ông là bác sĩ. Mẹ tôi không đi làm, mẹ nấu cơm ở nhà.","qs":[["医院在我家哪儿？","Bệnh viện ở đâu so với nhà tôi?",["后面","前面","里面"]],["妈妈工作吗？","Mẹ có đi làm không?",["不工作","在商店工作","在医院工作"]]]},{"l":1,"s":3,"k":"Hội thoại","t":"女：你的电脑是新的吗？男：不是，是我哥哥的。女：很漂亮！你喜欢这个电脑吗？男：很喜欢。我想明年买一个新的。","vi":"Nữ: Máy tính của anh mới à? Nam: Không, là của anh trai tôi. Nữ: Đẹp quá! Anh thích chiếc máy này không? Nam: Rất thích. Sang năm tôi định mua một cái mới.","qs":[["电脑是谁的？","Máy tính là của ai?",["男的的哥哥","男的","女的"]],["男的什么时候想买新电脑？","Khi nào người nam muốn mua máy mới?",["明年","明天","今年"]]]},{"l":2,"s":0,"k":"Đoạn văn","t":"我每天早上七点起床，然后吃鸡蛋、喝牛奶。八点我坐公共汽车去公司上班。","vi":"Mỗi sáng tôi dậy lúc 7 giờ, rồi ăn trứng, uống sữa. 8 giờ tôi đi xe buýt đến công ty làm việc.","qs":[["我早上吃什么？","Buổi sáng tôi ăn gì?",["鸡蛋和牛奶","米饭和茶","水果"]],["我怎么去公司？","Tôi đến công ty bằng gì?",["坐公共汽车","坐出租车","走路"]]]},{"l":2,"s":0,"k":"Hội thoại","t":"男：你的手机是新买的吗？女：是啊，昨天买的。男：多少钱？女：两千块，不太贵。","vi":"Nam: Điện thoại của em mới mua à? Nữ: Vâng, mua hôm qua. Nam: Bao nhiêu tiền? Nữ: Hai nghìn tệ, không đắt lắm.","qs":[["手机是什么时候买的？","Điện thoại mua khi nào?",["昨天","今天","去年"]],["女的觉得手机贵吗？","Người nữ thấy điện thoại có đắt không?",["不太贵","非常贵","很便宜"]]]},{"l":2,"s":0,"k":"Đoạn văn","t":"我的房间不大，但是很漂亮。房间里有一张桌子、两个椅子和很多书。","vi":"Phòng tôi không lớn nhưng rất đẹp. Trong phòng có một cái bàn, hai cái ghế và rất nhiều sách.","qs":[["我的房间怎么样？","Phòng của tôi thế nào?",["不大，但是很漂亮","很大很漂亮","不漂亮"]],["房间里有什么？","Trong phòng có gì?",["桌子、椅子和书","电视和电脑","猫和狗"]]]},{"l":2,"s":0,"k":"Hội thoại","t":"女：你等了多长时间了？男：二十分钟。女：对不起，路上车太多了。男：没关系。","vi":"Nữ: Anh đợi bao lâu rồi? Nam: Hai mươi phút. Nữ: Xin lỗi, trên đường xe đông quá. Nam: Không sao.","qs":[["男的等了多长时间？","Người nam đợi bao lâu?",["二十分钟","两个小时","十分钟"]],["女的为什么来晚了？","Vì sao người nữ đến muộn?",["路上车太多","起床晚了","她忘了"]]]},{"l":2,"s":1,"k":"Đoạn văn","t":"我哥哥非常喜欢运动。他每个星期踢两次足球，还常常去游泳。他说运动让他身体很好。","vi":"Anh trai tôi rất thích vận động. Mỗi tuần anh đá bóng hai lần, còn hay đi bơi. Anh nói vận động giúp anh khỏe mạnh.","qs":[["哥哥每个星期踢几次足球？","Mỗi tuần anh trai đá bóng mấy lần?",["两次","一次","三次"]],["哥哥为什么喜欢运动？","Vì sao anh trai thích vận động?",["运动让身体好","他想找朋友","他是老师"]]]},{"l":2,"s":1,"k":"Hội thoại","t":"男：你看见我的手表了吗？女：是不是在桌子上？男：不在，我找了很长时间。女：你看看椅子下面。男：找到了！谢谢你。","vi":"Nam: Em có thấy đồng hồ của anh không? Nữ: Có phải ở trên bàn không? Nam: Không có, anh tìm lâu lắm rồi. Nữ: Anh xem dưới ghế xem. Nam: Tìm thấy rồi! Cảm ơn em.","qs":[["男的在找什么？","Người nam đang tìm gì?",["手表","手机","钱"]],["手表最后在哪儿找到的？","Cuối cùng tìm thấy đồng hồ ở đâu?",["椅子下面","桌子上","房间外面"]]]},{"l":2,"s":1,"k":"Đoạn văn","t":"今天是妻子的生日。我下班以后去商店给她买了一件红色的衣服。她看到以后非常高兴，说这是她最喜欢的颜色。","vi":"Hôm nay là sinh nhật vợ tôi. Tan làm tôi ra cửa hàng mua cho cô ấy một chiếc áo màu đỏ. Cô ấy thấy rất vui, nói đây là màu cô thích nhất.","qs":[["我给妻子买了什么？","Tôi mua gì cho vợ?",["一件衣服","一个手表","一本书"]],["妻子最喜欢什么颜色？","Vợ thích màu gì nhất?",["红色","白色","黑色"]]]},{"l":2,"s":1,"k":"Hội thoại","t":"女：听说你去旅游了？男：对，我去了北京，玩了五天。女：天气怎么样？男：前三天都是晴天，后两天下雪了。","vi":"Nữ: Nghe nói anh đi du lịch à? Nam: Đúng, tôi đi Bắc Kinh, chơi năm ngày. Nữ: Thời tiết thế nào? Nam: Ba ngày đầu đều nắng, hai ngày sau có tuyết.","qs":[["男的在北京玩了几天？","Người nam chơi ở Bắc Kinh mấy ngày?",["五天","三天","两天"]],["后两天天气怎么样？","Hai ngày sau thời tiết thế nào?",["下雪了","晴天","下雨了"]]]},{"l":2,"s":2,"k":"Đoạn văn","t":"小王是饭店的服务员。他工作很忙，每天要工作十个小时。虽然很累，但是他觉得这个工作很有意思，因为可以认识很多新朋友。","vi":"Tiểu Vương là nhân viên phục vụ nhà hàng. Công việc rất bận, mỗi ngày phải làm 10 tiếng. Tuy mệt nhưng anh thấy công việc thú vị vì có thể quen nhiều bạn mới.","qs":[["小王每天工作多长时间？","Mỗi ngày Tiểu Vương làm bao lâu?",["十个小时","八个小时","六个小时"]],["小王为什么觉得工作有意思？","Vì sao Tiểu Vương thấy công việc thú vị?",["可以认识新朋友","钱很多","不累"]]]},{"l":2,"s":2,"k":"Hội thoại","t":"男：明天的考试你准备好了吗？女：还没有，有很多题我不懂。男：我帮你吧。女：太好了！晚上七点在教室见。","vi":"Nam: Bài thi ngày mai em chuẩn bị xong chưa? Nữ: Chưa, có nhiều câu em không hiểu. Nam: Để anh giúp em. Nữ: Tốt quá! 7 giờ tối gặp ở phòng học nhé.","qs":[["明天有什么事？","Ngày mai có việc gì?",["考试","生日","旅游"]],["他们晚上在哪儿见？","Buổi tối họ gặp ở đâu?",["教室","公司","机场"]]]},{"l":2,"s":2,"k":"Đoạn văn","t":"我妹妹今年六岁，她非常喜欢唱歌和跳舞。每天晚上吃完饭，她都要给我们唱一个歌。","vi":"Em gái tôi năm nay 6 tuổi, rất thích hát và nhảy múa. Tối nào ăn cơm xong em cũng hát cho chúng tôi nghe một bài.","qs":[["妹妹多大？","Em gái bao nhiêu tuổi?",["六岁","十六岁","八岁"]],["妹妹每天晚上做什么？","Tối nào em gái cũng làm gì?",["唱歌","看电视","写字"]]]},{"l":2,"s":2,"k":"Hội thoại","t":"女：这件衣服太大了，有小一点儿的吗？男：有，您试试这件。女：这件很好，多少钱？男：三百五十块。","vi":"Nữ: Cái áo này to quá, có cái nhỏ hơn không? Nam: Có, chị thử cái này xem. Nữ: Cái này vừa đẹp, bao nhiêu tiền? Nam: 350 tệ.","qs":[["女的觉得第一件衣服怎么样？","Người nữ thấy cái áo đầu tiên thế nào?",["太大了","太小了","太贵了"]],["第二件衣服多少钱？","Cái áo thứ hai giá bao nhiêu?",["三百五十块","三百块","五百三十块"]]]},{"l":2,"s":3,"k":"Đoạn văn","t":"我和丈夫都很忙。每个星期六我们不上班，一起带孩子出去玩。孩子最喜欢去看鱼，每次都很高兴。虽然我们很累，但是看到孩子笑，我们也很快乐。","vi":"Tôi và chồng đều rất bận. Thứ Bảy nào chúng tôi cũng không đi làm, cùng đưa con ra ngoài chơi. Con thích nhất là đi xem cá, lần nào cũng rất vui. Tuy chúng tôi mệt nhưng thấy con cười, chúng tôi cũng hạnh phúc.","qs":[["他们星期六做什么？","Thứ Bảy họ làm gì?",["带孩子出去玩","去公司上班","在家休息"]],["这段话主要说什么？","Đoạn văn chủ yếu nói gì?",["一家人星期六很快乐","孩子不喜欢鱼","丈夫工作很忙"]]]},{"l":2,"s":3,"k":"Hội thoại","t":"男：您好，我想去机场，怎么走比较好？女：您可以坐出租车，四十分钟就到了。男：有没有便宜一点儿的？女：坐公共汽车要一个半小时，但是只要两块钱。","vi":"Nam: Chào chị, tôi muốn ra sân bay, đi thế nào thì tốt? Nữ: Anh có thể đi taxi, 40 phút là tới. Nam: Có cách nào rẻ hơn không? Nữ: Đi xe buýt mất một tiếng rưỡi nhưng chỉ tốn hai tệ.","qs":[["坐出租车去机场要多长时间？","Đi taxi ra sân bay mất bao lâu?",["四十分钟","一个半小时","两个小时"]],["坐公共汽车有什么好处？","Đi xe buýt có lợi gì?",["很便宜","很快","很近"]]]},{"l":2,"s":3,"k":"Đoạn văn","t":"张先生以前每天坐公共汽车上班，路上要一个小时。去年他家搬到了公司旁边，现在他走路十分钟就能到公司，早上可以多睡一会儿，他觉得非常好。","vi":"Trước đây ông Trương ngày nào cũng đi xe buýt đi làm, trên đường mất một tiếng. Năm ngoái nhà ông chuyển đến cạnh công ty, giờ đi bộ mười phút là tới, buổi sáng ngủ thêm được một lúc, ông thấy rất tốt.","qs":[["张先生以前怎么上班？","Trước đây ông Trương đi làm bằng gì?",["坐公共汽车","走路","开车"]],["为什么现在张先生上班很快？","Vì sao bây giờ ông Trương đi làm rất nhanh?",["家离公司很近","他起床很早","他有新车"]]]},{"l":2,"s":3,"k":"Hội thoại","t":"女：你怎么了？眼睛这么红。男：昨天晚上我看书看到两点。女：你别太累了，身体最重要。男：我知道，可是下个星期就考试了。","vi":"Nữ: Anh sao thế? Mắt đỏ thế kia. Nam: Tối qua anh đọc sách đến 2 giờ. Nữ: Anh đừng mệt quá, sức khỏe là quan trọng nhất. Nam: Anh biết, nhưng tuần sau thi rồi.","qs":[["男的眼睛为什么红？","Vì sao mắt người nam đỏ?",["昨天睡得太晚","他生病了","他哭了"]],["男的为什么看书看得很晚？","Vì sao người nam đọc sách muộn?",["下个星期要考试","他喜欢看书","他不想睡觉"]]]},{"l":3,"s":0,"k":"Đoạn văn","t":"我的爱好是画画。每个周末，我都会带着笔记本去公园，画那里的花、草和树。画画让我觉得很安静。","vi":"Sở thích của tôi là vẽ. Cuối tuần nào tôi cũng mang sổ ra công viên vẽ hoa, cỏ và cây ở đó. Vẽ tranh khiến tôi thấy rất yên bình.","qs":[["我的爱好是什么？","Sở thích của tôi là gì?",["画画","唱歌","爬山"]],["画画让我觉得怎么样？","Vẽ tranh khiến tôi thấy thế nào?",["很安静","很着急","很难过"]]]},{"l":3,"s":0,"k":"Hội thoại","t":"男：你的头发变短了！女：是啊，天气太热了，短发更舒服。男：很漂亮，跟以前不一样了。","vi":"Nam: Tóc em ngắn rồi kìa! Nữ: Vâng, trời nóng quá, tóc ngắn dễ chịu hơn. Nam: Đẹp lắm, khác hẳn trước đây.","qs":[["女的为什么换短头发？","Vì sao người nữ để tóc ngắn?",["天气太热","她不喜欢长发","朋友让她换"]],["男的觉得她的头发怎么样？","Người nam thấy tóc cô ấy thế nào?",["很漂亮","不好看","和以前一样"]]]},{"l":3,"s":0,"k":"Đoạn văn","t":"我们学校的图书馆很大，一共有五层。一层可以借书，二层是电脑室，三层到五层都是安静的学习的地方。我经常在四层复习。","vi":"Thư viện trường tôi rất lớn, tổng cộng năm tầng. Tầng một có thể mượn sách, tầng hai là phòng máy tính, tầng ba đến tầng năm đều là nơi học yên tĩnh. Tôi thường ôn bài ở tầng bốn.","qs":[["图书馆一共有几层？","Thư viện có tổng cộng mấy tầng?",["五层","四层","三层"]],["在一层可以做什么？","Ở tầng một có thể làm gì?",["借书","用电脑","吃饭"]]]},{"l":3,"s":0,"k":"Hội thoại","t":"女：服务员，菜单上的这个菜辣吗？男：不辣，有点儿甜。女：那给我来一个，再要一碗米饭。","vi":"Nữ: Anh phục vụ ơi, món này trong thực đơn có cay không? Nam: Không cay, hơi ngọt. Nữ: Vậy cho tôi một phần, thêm một bát cơm.","qs":[["这个菜是什么味道？","Món này vị thế nào?",["有点儿甜","很辣","没有味道"]],["女的还要了什么？","Người nữ gọi thêm gì?",["一碗米饭","一杯啤酒","一个面包"]]]},{"l":3,"s":1,"k":"Đoạn văn","t":"我的邻居是一位老人，他的儿子在国外工作，很少回来。我经常帮他买东西、打扫房间。他也常常给我讲以前的故事。现在我们像一家人一样。","vi":"Hàng xóm tôi là một ông cụ, con trai ông làm việc ở nước ngoài, ít khi về. Tôi thường giúp ông mua đồ, dọn phòng. Ông cũng hay kể cho tôi chuyện ngày xưa. Giờ chúng tôi như người một nhà.","qs":[["老人的儿子在哪儿？","Con trai ông cụ ở đâu?",["国外","同一个城市","老人家里"]],["我和老人的关系怎么样？","Quan hệ giữa tôi và ông cụ thế nào?",["像一家人","不太熟悉","经常吵架"]]]},{"l":3,"s":1,"k":"Hội thoại","t":"男：下个月我要去上海参加一个比赛，你能帮我照顾一下我的猫吗？女：没问题，要几天？男：一个星期。女：好的，你把钥匙给我吧。","vi":"Nam: Tháng sau anh đi Thượng Hải dự một cuộc thi, em trông giúp anh con mèo được không? Nữ: Không vấn đề, mấy ngày? Nam: Một tuần. Nữ: Được, anh đưa chìa khóa cho em nhé.","qs":[["男的下个月去上海做什么？","Tháng sau người nam đi Thượng Hải làm gì?",["参加比赛","旅游","看朋友"]],["女的要帮男的做什么？","Người nữ sẽ giúp người nam việc gì?",["照顾猫","买东西","打扫房间"]]]},{"l":3,"s":1,"k":"Đoạn văn","t":"我刚来中国的时候，一句汉语也不会说，去超市买东西都很难。后来我每天跟中国朋友练习，三个月以后，我已经能用汉语和别人聊天了。","vi":"Hồi mới đến Trung Quốc, tôi không nói được câu tiếng Hán nào, đi siêu thị mua đồ cũng rất khó. Sau đó ngày nào tôi cũng luyện với bạn Trung Quốc, ba tháng sau tôi đã có thể nói chuyện với người khác bằng tiếng Hán.","qs":[["我刚来中国的时候怎么样？","Lúc mới đến Trung Quốc tôi thế nào?",["不会说汉语","汉语很好","有很多朋友"]],["我的汉语为什么提高了？","Vì sao tiếng Hán của tôi tiến bộ?",["每天跟中国朋友练习","去了学校","看电视"]]]},{"l":3,"s":1,"k":"Hội thoại","t":"女：你怎么又迟到了？男：对不起，地铁里人太多，我没上去。女：下次早点儿出门。会议已经开始十分钟了。男：好的，我一定注意。","vi":"Nữ: Sao anh lại đến muộn? Nam: Xin lỗi, tàu điện ngầm đông quá, tôi không lên được. Nữ: Lần sau ra khỏi nhà sớm hơn. Cuộc họp đã bắt đầu mười phút rồi. Nam: Vâng, tôi nhất định chú ý.","qs":[["男的为什么迟到？","Vì sao người nam đến muộn?",["地铁里人太多","起床晚了","路上堵车"]],["会议开始多长时间了？","Cuộc họp bắt đầu được bao lâu?",["十分钟","一个小时","半个小时"]]]},{"l":3,"s":2,"k":"Đoạn văn","t":"很多人觉得熊猫很胖，跑得很慢。其实，熊猫爬树爬得非常好，遇到危险的时候，它们会很快地爬到树上。熊猫一天中有一半的时间在吃东西，另一半的时间在睡觉。","vi":"Nhiều người nghĩ gấu trúc rất béo, chạy rất chậm. Thật ra gấu trúc leo cây rất giỏi, khi gặp nguy hiểm chúng sẽ nhanh chóng leo lên cây. Một ngày gấu trúc dành một nửa thời gian để ăn, nửa còn lại để ngủ.","qs":[["遇到危险时熊猫会怎么做？","Gặp nguy hiểm gấu trúc sẽ làm gì?",["爬到树上","跑到河里","躺在地上"]],["熊猫一天中做得最多的是什么？","Một ngày gấu trúc làm gì nhiều nhất?",["吃东西和睡觉","爬树","和别的动物玩"]]]},{"l":3,"s":2,"k":"Hội thoại","t":"男：我想买一台冰箱，你帮我选选吧。女：你家几口人？男：就我和我妻子。女：那不用买太大的，这个小一点儿的就够了，而且比较便宜。","vi":"Nam: Anh muốn mua một cái tủ lạnh, em chọn giúp anh nhé. Nữ: Nhà anh mấy người? Nam: Chỉ có anh và vợ. Nữ: Vậy không cần mua cái to quá, cái nhỏ này là đủ, lại khá rẻ.","qs":[["男的想买什么？","Người nam muốn mua gì?",["冰箱","空调","电视"]],["女的为什么建议买小的？","Vì sao người nữ khuyên mua cái nhỏ?",["家里人少","小的更漂亮","大的坏了"]]]},{"l":3,"s":2,"k":"Đoạn văn","t":"上个周末，我和朋友去爬山。山很高，我们爬了三个小时才到上面。虽然很累，但是从山上往下看，整个城市都在眼前，太美了！我们决定明年再来一次。","vi":"Cuối tuần trước tôi và bạn đi leo núi. Núi rất cao, chúng tôi leo ba tiếng mới lên tới đỉnh. Tuy mệt nhưng từ trên núi nhìn xuống, cả thành phố hiện ra trước mắt, đẹp quá! Chúng tôi quyết định sang năm sẽ đến lần nữa.","qs":[["他们爬了多长时间？","Họ leo mất bao lâu?",["三个小时","一个小时","一天"]],["他们明年打算做什么？","Sang năm họ định làm gì?",["再来爬这座山","去别的城市","不再爬山"]]]},{"l":3,"s":2,"k":"Hội thoại","t":"女：这本词典是你的吗？男：不是，是我从图书馆借的。女：什么时候要还？男：下个星期一。女：我也想借这本，你还了以后告诉我。","vi":"Nữ: Quyển từ điển này của anh à? Nam: Không, anh mượn ở thư viện. Nữ: Khi nào phải trả? Nam: Thứ Hai tuần sau. Nữ: Em cũng muốn mượn quyển này, anh trả rồi thì báo em nhé.","qs":[["词典是哪儿来的？","Quyển từ điển từ đâu ra?",["图书馆借的","男的买的","女的送的"]],["女的想做什么？","Người nữ muốn làm gì?",["也借这本词典","买一本词典","去图书馆工作"]]]},{"l":3,"s":3,"k":"Đoạn văn","t":"很多人认为，越贵的东西越好。其实，这种想法不一定对。比如有的衣服很贵，只是因为它很有名。所以买东西的时候，我们应该根据自己的需要来选择，而不是只看钱多少。","vi":"Nhiều người cho rằng đồ càng đắt càng tốt. Thật ra suy nghĩ này chưa chắc đúng. Ví dụ có những bộ quần áo rất đắt chỉ vì nó nổi tiếng. Vì vậy khi mua đồ, chúng ta nên chọn theo nhu cầu của mình chứ không chỉ nhìn vào giá tiền.","qs":[["作者觉得“越贵越好”这种想法怎么样？","Tác giả thấy suy nghĩ “càng đắt càng tốt” thế nào?",["不一定对","完全对","很有意思"]],["作者认为买东西应该怎么选择？","Tác giả cho rằng nên chọn đồ thế nào?",["根据自己的需要","选最贵的","选最有名的"]]]},{"l":3,"s":3,"k":"Hội thoại","t":"男：你决定好了吗？去北京还是留在这儿工作？女：我还没想清楚。北京机会多，但是离家太远了。男：我觉得你还年轻，应该出去看看。女：你说得对，我再跟爸爸妈妈说说。","vi":"Nam: Em quyết định chưa? Đi Bắc Kinh hay ở lại đây làm việc? Nữ: Em vẫn chưa nghĩ kỹ. Bắc Kinh nhiều cơ hội nhưng xa nhà quá. Nam: Anh thấy em còn trẻ, nên ra ngoài xem thế giới. Nữ: Anh nói đúng, em sẽ nói chuyện thêm với bố mẹ.","qs":[["女的为什么还没决定？","Vì sao người nữ vẫn chưa quyết định?",["北京离家太远","她不喜欢北京","工资太低"]],["男的建议女的怎么做？","Người nam khuyên người nữ thế nào?",["出去看看","留在这儿","回家"]]]},{"l":3,"s":3,"k":"Đoạn văn","t":"小明的爷爷今年八十岁了，身体还很健康。别人问他有什么办法，他笑着说：“每天早睡早起，多走路，少生气，吃饭只吃七分饱。”","vi":"Ông nội Tiểu Minh năm nay 80 tuổi, sức khỏe vẫn rất tốt. Người khác hỏi ông có bí quyết gì, ông cười nói: “Ngày nào cũng ngủ sớm dậy sớm, đi bộ nhiều, ít tức giận, ăn chỉ no bảy phần.”","qs":[["爷爷身体怎么样？","Sức khỏe ông nội thế nào?",["很健康","经常生病","不太好"]],["下面哪个不是爷爷的办法？","Điều nào KHÔNG phải bí quyết của ông?",["多吃肉","早睡早起","少生气"]]]},{"l":3,"s":3,"k":"Hội thoại","t":"女：你最近怎么瘦了这么多？男：我每天晚上都去锻炼，而且不吃甜的东西了。女：坚持多长时间了？男：快两个月了。开始很难，后来就习惯了。","vi":"Nữ: Sao dạo này anh gầy đi nhiều thế? Nam: Tối nào anh cũng đi tập, hơn nữa không ăn đồ ngọt nữa. Nữ: Kiên trì bao lâu rồi? Nam: Gần hai tháng. Lúc đầu rất khó, sau thì quen.","qs":[["男的为什么瘦了？","Vì sao người nam gầy đi?",["锻炼和不吃甜的","生病了","工作太忙"]],["男的觉得锻炼怎么样？","Người nam thấy việc tập luyện thế nào?",["开始难，后来习惯了","一直很难","一直很容易"]]]},{"l":4,"s":0,"k":"Đoạn văn","t":"我们公司规定，每天上午九点上班。一个月迟到超过三次，就拿不到这个月的奖金。所以大家都很注意按时上班。","vi":"Công ty chúng tôi quy định 9 giờ sáng bắt đầu làm việc. Một tháng đi muộn quá ba lần sẽ không được thưởng tháng đó. Vì vậy mọi người đều rất chú ý đi làm đúng giờ.","qs":[["公司几点上班？","Công ty mấy giờ vào làm?",["九点","八点","十点"]],["迟到超过三次会怎么样？","Đi muộn quá ba lần sẽ thế nào?",["拿不到奖金","被批评","要加班"]]]},{"l":4,"s":0,"k":"Hội thoại","t":"男：你好，我想办一张银行卡。女：请给我看一下您的护照。男：给您。女：请在这张表格上填一下您的地址和电话号码。","vi":"Nam: Chào chị, tôi muốn làm một thẻ ngân hàng. Nữ: Anh cho tôi xem hộ chiếu. Nam: Đây ạ. Nữ: Anh điền địa chỉ và số điện thoại vào tờ khai này.","qs":[["男的想做什么？","Người nam muốn làm gì?",["办银行卡","取钱","换钱"]],["表格上要填什么？","Trên tờ khai phải điền gì?",["地址和电话号码","年龄和性别","工作和收入"]]]},{"l":4,"s":0,"k":"Đoạn văn","t":"小李是个很马虎的人。上个星期他坐出租车时，把手机丢在了车上。好在司机很诚实，第二天就把手机送了回来。","vi":"Tiểu Lý là người rất đểnh đoảng. Tuần trước khi đi taxi, anh để quên điện thoại trên xe. May mà tài xế rất thật thà, hôm sau đã mang điện thoại trả lại.","qs":[["小李是个什么样的人？","Tiểu Lý là người thế nào?",["马虎","诚实","冷静"]],["手机最后怎么样了？","Cuối cùng chiếc điện thoại ra sao?",["司机送回来了","找不到了","坏了"]]]},{"l":4,"s":0,"k":"Hội thoại","t":"女：这个周末我们去郊区玩儿吧？男：好啊，听说那儿的森林很美，空气也新鲜。女：那我们周六早上八点出发。男：没问题，我负责准备吃的。","vi":"Nữ: Cuối tuần này mình ra ngoại ô chơi nhé? Nam: Được, nghe nói rừng ở đó rất đẹp, không khí cũng trong lành. Nữ: Vậy 8 giờ sáng thứ Bảy xuất phát. Nam: Không vấn đề, anh phụ trách chuẩn bị đồ ăn.","qs":[["他们打算去哪儿？","Họ định đi đâu?",["郊区","海边","博物馆"]],["男的负责什么？","Người nam phụ trách việc gì?",["准备吃的","开车","订房间"]]]},{"l":4,"s":1,"k":"Đoạn văn","t":"现在很多年轻人都喜欢用手机付款。出门的时候不用带钱包，也不用找零钱，非常方便。但是一些老年人还不太习惯，他们觉得用现金更放心。","vi":"Hiện nay nhiều người trẻ thích thanh toán bằng điện thoại. Ra ngoài không cần mang ví, cũng không cần thối tiền lẻ, rất tiện. Nhưng một số người già vẫn chưa quen, họ thấy dùng tiền mặt yên tâm hơn.","qs":[["用手机付款有什么好处？","Thanh toán bằng điện thoại có lợi gì?",["不用带钱包","可以打折","更安全"]],["一些老年人为什么用现金？","Vì sao một số người già dùng tiền mặt?",["觉得更放心","更便宜","更快"]]]},{"l":4,"s":1,"k":"Hội thoại","t":"男：经理，我想下周请两天假。女：有什么事吗？男：我母亲生病住院了，我想回去照顾她。女：没问题，你把工作安排好就行。希望她早点儿好起来。","vi":"Nam: Thưa giám đốc, tuần sau tôi muốn xin nghỉ hai ngày. Nữ: Có việc gì vậy? Nam: Mẹ tôi ốm phải nằm viện, tôi muốn về chăm sóc bà. Nữ: Không vấn đề, anh sắp xếp công việc ổn thỏa là được. Mong bà sớm khỏe lại.","qs":[["男的为什么请假？","Vì sao người nam xin nghỉ?",["照顾生病的母亲","去旅行","参加婚礼"]],["经理同意了吗？","Giám đốc có đồng ý không?",["同意了","不同意","还没决定"]]]},{"l":4,"s":1,"k":"Đoạn văn","t":"学习一门语言，最重要的不是记住多少词语，而是敢开口说。很多人害怕说错，所以不愿意说。其实，说错是学习过程中很正常的事情，只有多说，才能说得越来越流利。","vi":"Học một ngôn ngữ, quan trọng nhất không phải nhớ được bao nhiêu từ mà là dám mở miệng nói. Nhiều người sợ nói sai nên không muốn nói. Thật ra nói sai là chuyện rất bình thường trong quá trình học, chỉ có nói nhiều mới ngày càng lưu loát.","qs":[["作者认为学习语言最重要的是什么？","Tác giả cho rằng điều quan trọng nhất khi học ngôn ngữ là gì?",["敢开口说","记很多词语","学好语法"]],["作者怎么看说错？","Tác giả nhìn nhận việc nói sai thế nào?",["是很正常的事","说明没努力","应该尽量不说"]]]},{"l":4,"s":1,"k":"Hội thoại","t":"女：你昨天看的那个电影怎么样？男：内容一般，不过演员演得很精彩。女：那值得去看吗？男：如果你喜欢那个演员，可以去看看。","vi":"Nữ: Bộ phim hôm qua anh xem thế nào? Nam: Nội dung bình thường, nhưng diễn viên diễn rất đặc sắc. Nữ: Vậy có đáng đi xem không? Nam: Nếu em thích diễn viên đó thì có thể đi xem.","qs":[["男的觉得电影内容怎么样？","Người nam thấy nội dung phim thế nào?",["一般","很精彩","很差"]],["男的觉得什么很精彩？","Người nam thấy điều gì đặc sắc?",["演员的表演","电影的内容","电影的音乐"]]]},{"l":4,"s":2,"k":"Đoạn văn","t":"很多父母为了让孩子将来有好的发展，从小就让孩子学习各种东西，比如钢琴、画画、英语等。然而，教育专家认为，比起学多少东西，培养孩子的兴趣和好习惯更加重要。如果孩子对某件事没有兴趣，学得再多也没有效果。","vi":"Nhiều bậc cha mẹ, để con có tương lai tốt, từ nhỏ đã cho con học đủ thứ như piano, vẽ, tiếng Anh. Tuy nhiên chuyên gia giáo dục cho rằng so với việc học bao nhiêu thứ, bồi dưỡng hứng thú và thói quen tốt cho trẻ còn quan trọng hơn. Nếu trẻ không có hứng thú với việc gì thì học bao nhiêu cũng không hiệu quả.","qs":[["专家认为什么更重要？","Chuyên gia cho rằng điều gì quan trọng hơn?",["培养兴趣和好习惯","学很多东西","学好英语"]],["孩子没有兴趣会怎么样？","Trẻ không có hứng thú thì sẽ thế nào?",["学了也没有效果","学得更快","会更努力"]]]},{"l":4,"s":2,"k":"Hội thoại","t":"男：我的航班推迟了，要晚到三个小时。女：怎么回事？男：广播里说是因为天气不好。女：那我晚点儿再去机场接你，你降落以后给我打电话。","vi":"Nam: Chuyến bay của anh bị hoãn, sẽ đến muộn ba tiếng. Nữ: Sao vậy? Nam: Loa thông báo nói do thời tiết xấu. Nữ: Vậy em sẽ ra sân bay đón anh muộn hơn, anh hạ cánh thì gọi em.","qs":[["航班为什么推迟？","Vì sao chuyến bay bị hoãn?",["天气不好","飞机坏了","机场太忙"]],["女的让男的什么时候打电话？","Người nữ bảo người nam gọi khi nào?",["降落以后","起飞以前","现在"]]]},{"l":4,"s":2,"k":"Đoạn văn","t":"有一次，我在一家餐厅吃饭，服务员不小心把汤倒在了我的衣服上。她紧张得脸都红了，一直向我道歉。我知道她不是故意的，就笑着说没关系。后来，餐厅经理免费给我们换了一个菜，还送了一张打折卡。","vi":"Có lần tôi ăn ở một nhà hàng, cô phục vụ không cẩn thận làm đổ canh lên áo tôi. Cô căng thẳng đến đỏ cả mặt, liên tục xin lỗi. Tôi biết cô không cố ý nên cười nói không sao. Sau đó quản lý nhà hàng miễn phí đổi cho chúng tôi một món, còn tặng một thẻ giảm giá.","qs":[["服务员做错了什么？","Cô phục vụ đã làm sai điều gì?",["把汤倒在我衣服上","送错了菜","算错了钱"]],["经理是怎么做的？","Quản lý đã làm gì?",["免费换菜，送打折卡","批评了服务员","让我们多付钱"]]]},{"l":4,"s":2,"k":"Hội thoại","t":"女：听说你们公司要招聘新人？男：对，主要招翻译，要求汉语和英语都很流利。女：我朋友正好是学翻译专业的，我让她把简历发给你？男：好啊，我们下个星期一开始面试。","vi":"Nữ: Nghe nói công ty anh đang tuyển người mới? Nam: Đúng, chủ yếu tuyển phiên dịch, yêu cầu tiếng Hán và tiếng Anh đều lưu loát. Nữ: Bạn em vừa hay học chuyên ngành phiên dịch, em bảo cô ấy gửi sơ yếu lý lịch cho anh nhé? Nam: Được, thứ Hai tuần sau bắt đầu phỏng vấn.","qs":[["公司要招聘什么人？","Công ty muốn tuyển người làm gì?",["翻译","司机","律师"]],["面试什么时候开始？","Khi nào bắt đầu phỏng vấn?",["下个星期一","这个星期一","明天"]]]},{"l":4,"s":3,"k":"Đoạn văn","t":"人们常说“时间就是金钱”。其实，时间比金钱更重要，因为钱花完了还可以再赚，而时间过去了就再也回不来了。所以，我们应该好好安排自己的时间，不要把它浪费在无聊的事情上。","vi":"Người ta thường nói “thời gian là tiền bạc”. Thật ra thời gian còn quan trọng hơn tiền, vì tiền tiêu hết còn có thể kiếm lại, còn thời gian trôi qua thì không bao giờ quay lại. Vì vậy chúng ta nên sắp xếp thời gian thật tốt, đừng lãng phí vào những việc vô bổ.","qs":[["作者认为时间为什么比钱更重要？","Vì sao tác giả cho rằng thời gian quan trọng hơn tiền?",["时间过去就回不来了","时间可以赚钱","钱不重要"]],["这段话主要想告诉我们什么？","Đoạn văn chủ yếu muốn nói gì?",["不要浪费时间","要多赚钱","要多休息"]]]},{"l":4,"s":3,"k":"Hội thoại","t":"男：这次的任务很复杂，你觉得我们能按时完成吗？女：只要大家互相支持，应该没问题。男：可是小王下周要出差。女：那我们提前把他负责的部分做完，或者让他先把材料交给我。","vi":"Nam: Nhiệm vụ lần này rất phức tạp, em thấy chúng ta có hoàn thành đúng hạn được không? Nữ: Chỉ cần mọi người hỗ trợ nhau thì chắc không vấn đề. Nam: Nhưng tuần sau Tiểu Vương phải đi công tác. Nữ: Vậy chúng ta làm trước phần cậu ấy phụ trách, hoặc bảo cậu ấy giao tài liệu cho em trước.","qs":[["男的担心什么？","Người nam lo lắng điều gì?",["任务不能按时完成","小王不来上班","工资太低"]],["女的提出了什么办法？","Người nữ đưa ra cách gì?",["提前做完小王的部分","推迟任务","再招聘新人"]]]},{"l":4,"s":3,"k":"Đoạn văn","t":"研究发现，笑不仅能让人心情变好，还对身体健康有好处。笑的时候，人会放松，压力也会减少。所以，即使遇到烦恼，也不要忘了笑一笑。正如一句话说的：“笑一笑，十年少。”","vi":"Nghiên cứu phát hiện cười không chỉ khiến tâm trạng tốt hơn mà còn có lợi cho sức khỏe. Khi cười, con người thả lỏng, áp lực cũng giảm. Vì vậy dù gặp phiền muộn cũng đừng quên mỉm cười. Đúng như câu nói: “Một nụ cười bằng mười thang thuốc bổ (cười một cái trẻ ra mười tuổi).”","qs":[["根据研究，笑有什么好处？","Theo nghiên cứu, cười có lợi ích gì?",["让人放松，减少压力","让人变聪明","让人更有钱"]],["“笑一笑，十年少”是什么意思？","Câu “cười một cái, trẻ mười tuổi” nghĩa là gì?",["常笑让人年轻","笑十年才年轻","少笑比较好"]]]},{"l":4,"s":3,"k":"Hội thoại","t":"女：我们结婚十年了，你还记得我们第一次见面是在哪儿吗？男：当然记得，在图书馆。你那天穿着一条蓝色的裙子，在找一本小说。女：没想到你记得这么清楚！男：那天对我来说太重要了。","vi":"Nữ: Chúng ta cưới nhau mười năm rồi, anh còn nhớ lần đầu gặp nhau ở đâu không? Nam: Tất nhiên nhớ, ở thư viện. Hôm đó em mặc chiếc váy màu xanh lam, đang tìm một cuốn tiểu thuyết. Nữ: Không ngờ anh nhớ rõ thế! Nam: Ngày hôm đó quá quan trọng với anh.","qs":[["他们第一次在哪儿见面？","Lần đầu họ gặp nhau ở đâu?",["图书馆","餐厅","公园"]],["从对话中可以知道什么？","Từ đoạn hội thoại có thể biết điều gì?",["男的很重视那一天","女的忘了那天","他们刚结婚"]]]},{"l":5,"s":0,"k":"Đoạn văn","t":"我家附近新开了一家超市，开业第一周所有商品都打八折。消息传出后，很多居民排着长队去买东西，有的人甚至一次买了一个月的日用品。","vi":"Gần nhà tôi mới mở một siêu thị, tuần đầu khai trương mọi mặt hàng đều giảm 20%. Tin truyền ra, nhiều cư dân xếp hàng dài đi mua đồ, có người thậm chí mua một lần đồ dùng cho cả tháng.","qs":[["新超市开业时有什么优惠？","Siêu thị mới khai trương có ưu đãi gì?",["所有商品打八折","买一送一","免费送货"]],["居民们有什么反应？","Cư dân phản ứng thế nào?",["排队去买东西","不感兴趣","去别的超市"]]]},{"l":5,"s":0,"k":"Hội thoại","t":"女：你的感冒好点儿了吗？男：好多了，不过嗓子还有点儿疼。女：多喝点儿开水，别熬夜了。男：嗯，我今天打算早点儿休息。","vi":"Nữ: Anh đỡ cảm chưa? Nam: Đỡ nhiều rồi, nhưng cổ họng vẫn hơi đau. Nữ: Uống nhiều nước ấm vào, đừng thức khuya nữa. Nam: Ừ, hôm nay anh định nghỉ sớm.","qs":[["男的现在哪儿不舒服？","Người nam hiện khó chịu ở đâu?",["嗓子疼","头疼","肚子疼"]],["女的建议男的做什么？","Người nữ khuyên người nam làm gì?",["多喝水，别熬夜","去医院打针","多运动"]]]},{"l":5,"s":0,"k":"Đoạn văn","t":"小张是个很有礼貌的孩子。每次见到邻居，他都会主动问好。有一次，他在楼下捡到一个钱包，马上交给了保安。大家都称赞他是个诚实的好孩子。","vi":"Tiểu Trương là đứa trẻ rất lễ phép. Mỗi lần gặp hàng xóm cậu đều chủ động chào hỏi. Có lần cậu nhặt được một chiếc ví dưới nhà, lập tức giao cho bảo vệ. Mọi người đều khen cậu là đứa trẻ ngoan thật thà.","qs":[["小张捡到钱包后怎么做的？","Tiểu Trương nhặt được ví thì làm gì?",["交给了保安","自己留着","扔掉了"]],["大家怎么评价小张？","Mọi người đánh giá Tiểu Trương thế nào?",["诚实","马虎","害羞"]]]},{"l":5,"s":0,"k":"Hội thoại","t":"男：周末的婚礼你参加吗？女：当然参加，新娘是我大学同学。男：那我们一起去吧，我开车接你。女：太好了，那就麻烦你了。","vi":"Nam: Đám cưới cuối tuần em có đi không? Nữ: Tất nhiên rồi, cô dâu là bạn đại học của em. Nam: Vậy mình đi cùng nhé, anh lái xe đón em. Nữ: Tốt quá, vậy phiền anh nhé.","qs":[["女的和新娘是什么关系？","Người nữ và cô dâu có quan hệ gì?",["大学同学","姐妹","同事"]],["他们怎么去婚礼？","Họ đi đám cưới bằng cách nào?",["男的开车接女的","坐地铁","打车"]]]},{"l":5,"s":1,"k":"Đoạn văn","t":"很多人喜欢养宠物，因为宠物能给人带来快乐，让人不再感到寂寞。但是养宠物也需要承担责任，比如每天喂它、带它散步、定期带它去看医生。如果没有足够的时间和耐心，最好不要养。","vi":"Nhiều người thích nuôi thú cưng vì chúng mang lại niềm vui, khiến người ta không còn cô đơn. Nhưng nuôi thú cưng cũng phải gánh trách nhiệm, như cho ăn mỗi ngày, dắt đi dạo, định kỳ đưa đi khám. Nếu không đủ thời gian và kiên nhẫn thì tốt nhất đừng nuôi.","qs":[["宠物能给人带来什么？","Thú cưng mang lại gì cho con người?",["快乐，不再寂寞","很多钱","好的工作"]],["作者认为什么人最好不要养宠物？","Tác giả cho rằng ai tốt nhất đừng nuôi thú cưng?",["没有时间和耐心的人","年轻人","老年人"]]]},{"l":5,"s":1,"k":"Đoạn văn","t":"王老师已经退休了，但他仍然每天去社区的图书馆做志愿者，帮孩子们辅导作业。他说：“和孩子们在一起，我觉得自己也变年轻了。”","vi":"Thầy Vương đã nghỉ hưu nhưng ngày nào cũng đến thư viện khu dân cư làm tình nguyện viên, phụ đạo bài tập cho các em nhỏ. Thầy nói: “Ở bên lũ trẻ, tôi thấy mình cũng trẻ lại.”","qs":[["王老师退休后做什么？","Thầy Vương nghỉ hưu làm gì?",["在图书馆做志愿者","在家休息","去国外旅游"]],["王老师为什么喜欢这个工作？","Vì sao thầy Vương thích công việc này?",["觉得自己变年轻了","可以赚钱","想找朋友"]]]},{"l":5,"s":1,"k":"Hội thoại","t":"男：我的电脑突然开不了机了，里面还有很多重要文件。女：别着急，可能是电池没电了，你先充一下电试试。男：果然是这个原因，现在好了！","vi":"Nam: Máy tính anh đột nhiên không khởi động được, bên trong còn nhiều tài liệu quan trọng. Nữ: Đừng lo, có thể hết pin rồi, anh sạc thử xem. Nam: Đúng là vì thế thật, giờ được rồi!","qs":[["男的遇到了什么问题？","Người nam gặp vấn đề gì?",["电脑开不了机","文件丢了","手机坏了"]],["问题的原因是什么？","Nguyên nhân là gì?",["电池没电了","电脑有病毒","系统坏了"]]]},{"l":5,"s":2,"k":"Đoạn văn","t":"春节是中国最重要的传统节日。除夕晚上，一家人会坐在一起吃年夜饭，看电视节目，聊天。到了半夜十二点，人们会放鞭炮，迎接新年的到来。孩子们最高兴的是可以收到长辈给的红包。","vi":"Tết Nguyên đán là lễ truyền thống quan trọng nhất của Trung Quốc. Tối giao thừa cả nhà quây quần ăn cơm tất niên, xem tivi, trò chuyện. Đúng nửa đêm mọi người đốt pháo đón năm mới. Trẻ con vui nhất là được nhận lì xì từ người lớn.","qs":[["除夕晚上一家人一起做什么？","Tối giao thừa cả nhà cùng làm gì?",["吃年夜饭","去旅游","去上班"]],["孩子们最高兴的是什么？","Trẻ con vui nhất là điều gì?",["收到红包","放鞭炮","看电视"]]]},{"l":5,"s":2,"k":"Hội thoại","t":"女：你们公司的待遇怎么样？男：工资一般，但是每年有十五天带薪假期，还有免费的健身房。女：那挺不错的。男：是啊，最重要的是同事之间的关系很好。","vi":"Nữ: Đãi ngộ ở công ty anh thế nào? Nam: Lương bình thường, nhưng mỗi năm có 15 ngày nghỉ có lương, còn có phòng tập miễn phí. Nữ: Khá tốt đấy. Nam: Ừ, quan trọng nhất là quan hệ đồng nghiệp rất tốt.","qs":[["男的公司有什么福利？","Công ty người nam có phúc lợi gì?",["带薪假期和健身房","很高的工资","免费午饭"]],["男的认为最重要的是什么？","Người nam cho rằng điều gì quan trọng nhất?",["同事关系好","工资高","假期多"]]]},{"l":5,"s":2,"k":"Đoạn văn","t":"有一个农民在田里发现了一只受伤的鸟。他把鸟带回家，每天细心地照顾它。一个月后，鸟的伤好了，农民把它放回了天空。第二年春天，那只鸟竟然飞了回来，在他家门前的树上做了一个家。","vi":"Một người nông dân phát hiện một chú chim bị thương ngoài đồng. Ông mang chim về nhà, ngày ngày chăm sóc cẩn thận. Một tháng sau chim lành vết thương, ông thả nó về bầu trời. Mùa xuân năm sau, con chim ấy lại bay về, làm tổ trên cây trước cửa nhà ông.","qs":[["农民为什么把鸟带回家？","Vì sao người nông dân mang chim về nhà?",["鸟受伤了","想吃鸟","想卖鸟"]],["第二年春天发生了什么？","Mùa xuân năm sau xảy ra chuyện gì?",["鸟飞回来在树上安家","鸟死了","农民搬家了"]]]},{"l":5,"s":2,"k":"Hội thoại","t":"男：听说你被一家大公司录取了？女：是啊，不过我还在犹豫要不要去。男：为什么？女：那家公司在另一个城市，我舍不得离开父母。男：你可以先去试试，周末还能回来。","vi":"Nam: Nghe nói em được một công ty lớn nhận rồi à? Nữ: Vâng, nhưng em còn do dự có nên đi không. Nam: Sao vậy? Nữ: Công ty ở thành phố khác, em không nỡ xa bố mẹ. Nam: Em cứ thử đi xem, cuối tuần vẫn về được mà.","qs":[["女的为什么犹豫？","Vì sao người nữ do dự?",["舍不得离开父母","工资太低","不喜欢那家公司"]],["男的建议女的怎么做？","Người nam khuyên người nữ thế nào?",["先去试试","拒绝这份工作","带父母一起去"]]]},{"l":5,"s":3,"k":"Đoạn văn","t":"随着网络的发展，越来越多的人选择在家办公。在家工作可以节省上下班的时间，也能更自由地安排生活。然而，它也带来了一些问题：有的人很难把工作和生活分开，有的人因为缺少和同事的交流而感到孤单。","vi":"Cùng với sự phát triển của mạng, ngày càng nhiều người chọn làm việc tại nhà. Làm ở nhà tiết kiệm thời gian đi lại, sắp xếp cuộc sống tự do hơn. Tuy nhiên nó cũng gây ra vấn đề: có người khó tách bạch công việc và cuộc sống, có người thấy cô đơn vì thiếu giao lưu với đồng nghiệp.","qs":[["在家办公有什么好处？","Làm việc tại nhà có lợi gì?",["节省时间，安排自由","工资更高","同事更多"]],["在家办公可能带来什么问题？","Làm việc tại nhà có thể gây vấn đề gì?",["感到孤单","效率太高","上班时间更长"]]]},{"l":5,"s":3,"k":"Hội thoại","t":"女：这次比赛你们队输了，你是不是很失望？男：说不失望是假的。不过对手确实比我们强，我们还有很多需要改进的地方。女：你能这么想就对了。男：下次我们一定会表现得更好。","vi":"Nữ: Lần này đội anh thua, anh có thất vọng lắm không? Nam: Nói không thất vọng là nói dối. Nhưng đối thủ thật sự mạnh hơn, chúng tôi còn nhiều chỗ cần cải thiện. Nữ: Anh nghĩ được vậy là đúng. Nam: Lần sau chúng tôi nhất định thể hiện tốt hơn.","qs":[["男的队比赛结果怎么样？","Kết quả trận đấu của đội người nam ra sao?",["输了","赢了","平了"]],["男的对结果是什么态度？","Người nam có thái độ gì với kết quả?",["承认差距，继续努力","很生气","不在乎"]]]},{"l":5,"s":4,"k":"Đoạn văn","t":"近年来，“慢生活”越来越受到年轻人的欢迎。所谓慢生活，并不是做事慢，而是在忙碌的生活中放慢脚步，享受当下。比如，认真地吃一顿饭，在公园里散散步，或者关掉手机读一本书。","vi":"Những năm gần đây “sống chậm” ngày càng được giới trẻ ưa chuộng. Sống chậm không phải là làm việc chậm, mà là chậm lại giữa cuộc sống bận rộn để tận hưởng hiện tại. Ví dụ ăn một bữa cơm thật trọn vẹn, đi dạo trong công viên, hoặc tắt điện thoại đọc một cuốn sách.","qs":[["“慢生活”是什么意思？","“Sống chậm” nghĩa là gì?",["放慢脚步，享受当下","做事很慢","不工作"]],["下面哪个是慢生活的例子？","Đâu là ví dụ về sống chậm?",["关掉手机读书","加班到很晚","一边吃饭一边工作"]]]},{"l":5,"s":4,"k":"Hội thoại","t":"女：你最近在学什么？男：我在学摄影，每个周末都去参加培训。女：难不难？男：基本操作不难，但是想拍出有艺术感的照片，需要长期练习和观察。","vi":"Nữ: Dạo này anh học gì thế? Nam: Anh học nhiếp ảnh, cuối tuần nào cũng đi lớp. Nữ: Có khó không? Nam: Thao tác cơ bản không khó, nhưng muốn chụp ảnh có tính nghệ thuật thì cần luyện tập và quan sát lâu dài.","qs":[["男的最近在学什么？","Dạo này người nam học gì?",["摄影","画画","弹钢琴"]],["男的认为拍好照片需要什么？","Người nam cho rằng chụp ảnh đẹp cần gì?",["长期练习和观察","很贵的相机","好的天气"]]]},{"l":5,"s":4,"k":"Đoạn văn","t":"研究表明，每天阅读半个小时，不仅可以增加知识，还能减轻压力。阅读时，人的注意力集中在书中的世界，暂时忘掉生活中的烦恼。不过，专家提醒，阅读时最好选择纸质书，因为长时间看手机屏幕对眼睛不好。","vi":"Nghiên cứu cho thấy mỗi ngày đọc sách nửa tiếng không chỉ tăng hiểu biết mà còn giảm áp lực. Khi đọc, sự chú ý tập trung vào thế giới trong sách, tạm quên phiền muộn. Tuy nhiên chuyên gia nhắc nên chọn sách giấy, vì nhìn màn hình điện thoại lâu không tốt cho mắt.","qs":[["每天阅读有什么好处？","Đọc sách mỗi ngày có lợi gì?",["增加知识，减轻压力","让眼睛更好","让人更有钱"]],["专家建议选择什么书？","Chuyên gia khuyên chọn loại sách nào?",["纸质书","电子书","有声书"]]]},{"l":5,"s":4,"k":"Hội thoại","t":"男：您好，我上周在网上买的衣服质量有问题，想退货。女：请问您保留收据了吗？男：保留了，这是订单号。女：好的，我们会尽快为您办理，退款将在三个工作日内到账。","vi":"Nam: Chào chị, quần áo tôi mua trên mạng tuần trước có vấn đề chất lượng, tôi muốn trả hàng. Nữ: Anh còn giữ biên lai không? Nam: Còn, đây là mã đơn hàng. Nữ: Vâng, chúng tôi sẽ xử lý sớm nhất, tiền hoàn sẽ về trong ba ngày làm việc.","qs":[["男的为什么联系女的？","Vì sao người nam liên hệ người nữ?",["衣服有质量问题要退货","想买新衣服","收据丢了"]],["退款多久能到账？","Bao lâu tiền hoàn về tài khoản?",["三个工作日内","一个星期","当天"]]]},{"l":5,"s":5,"k":"Đoạn văn","t":"有些人总是抱怨自己运气不好，机会从来不会来到自己身上。其实，机会往往只留给有准备的人。如果平时不努力学习、积累经验，即使机会来了，也抓不住。","vi":"Có người luôn than vãn mình kém may mắn, cơ hội chẳng bao giờ đến với mình. Thật ra cơ hội thường chỉ dành cho người có chuẩn bị. Nếu ngày thường không chăm học, tích lũy kinh nghiệm thì dù cơ hội đến cũng không nắm được.","qs":[["作者认为机会留给什么样的人？","Tác giả cho rằng cơ hội dành cho ai?",["有准备的人","运气好的人","聪明的人"]],["平时不努力的人会怎么样？","Người ngày thường không cố gắng sẽ ra sao?",["机会来了也抓不住","机会更多","一定会成功"]]]},{"l":5,"s":5,"k":"Hội thoại","t":"女：你看这个新闻了吗？有个小伙子跳进河里救了一个孩子。男：看了，真了不起！听说他自己也不太会游泳。女：是啊，当时情况非常危险。男：他真是个英雄。","vi":"Nữ: Anh xem tin này chưa? Có chàng trai nhảy xuống sông cứu một đứa trẻ. Nam: Xem rồi, thật phi thường! Nghe nói bản thân anh ấy cũng không biết bơi giỏi. Nữ: Đúng thế, lúc đó rất nguy hiểm. Nam: Anh ấy đúng là anh hùng.","qs":[["新闻讲了什么事？","Bản tin kể chuyện gì?",["小伙子救了落水的孩子","孩子学会了游泳","河水被污染了"]],["关于小伙子，哪个是对的？","Về chàng trai, câu nào đúng?",["他不太会游泳","他是游泳运动员","他受伤了"]]]},{"l":5,"s":5,"k":"Đoạn văn","t":"中国的茶文化历史悠久。早在几千年前，中国人就开始喝茶了。不同地区的人喝茶的习惯也不一样：南方人喜欢喝绿茶，北方人更喜欢喝花茶。如今，喝茶已经成为很多人日常生活中不可缺少的一部分。","vi":"Văn hóa trà Trung Quốc có lịch sử lâu đời. Từ mấy nghìn năm trước người Trung Quốc đã uống trà. Thói quen uống trà mỗi vùng khác nhau: người miền Nam thích trà xanh, người miền Bắc thích trà hoa hơn. Ngày nay uống trà đã thành một phần không thể thiếu trong đời sống của nhiều người.","qs":[["南方人喜欢喝什么茶？","Người miền Nam thích uống trà gì?",["绿茶","花茶","红茶"]],["这段话主要介绍什么？","Đoạn văn chủ yếu giới thiệu gì?",["中国的茶文化","怎么做茶","茶的价格"]]]},{"l":5,"s":5,"k":"Hội thoại","t":"男：我最近总是忘记事情，昨天连钥匙都忘在办公室了。女：可能是你压力太大了。你最好把要做的事写在本子上。男：这个办法不错。女：另外，也要注意休息，别让自己太累。","vi":"Nam: Dạo này anh hay quên, hôm qua còn để quên cả chìa khóa ở văn phòng. Nữ: Có lẽ anh áp lực quá. Tốt nhất anh ghi việc cần làm vào sổ. Nam: Cách này hay đấy. Nữ: Ngoài ra cũng phải chú ý nghỉ ngơi, đừng để mình quá mệt.","qs":[["男的最近有什么问题？","Dạo này người nam gặp vấn đề gì?",["总是忘记事情","总是迟到","总是失眠"]],["女的建议男的怎么做？","Người nữ khuyên người nam làm gì?",["把事情写下来","去看医生","换工作"]]]},{"l":5,"s":6,"k":"Đoạn văn","t":"一位年轻人问智者：“怎样才能成功？”智者没有回答，而是带他来到河边，把他的头按进水里。年轻人拼命挣扎，终于抬起头来。智者问：“刚才你最想要的是什么？”“空气！”智者说：“当你像需要空气一样渴望成功时，你就会成功。”","vi":"Một chàng trai hỏi bậc hiền triết: “Làm sao để thành công?” Hiền triết không trả lời mà đưa cậu ra bờ sông, ấn đầu cậu xuống nước. Chàng trai vùng vẫy hết sức, cuối cùng ngẩng được đầu lên. Hiền triết hỏi: “Vừa rồi con muốn gì nhất?” “Không khí!” Hiền triết nói: “Khi con khao khát thành công như cần không khí, con sẽ thành công.”","qs":[["智者为什么把年轻人的头按进水里？","Vì sao hiền triết ấn đầu chàng trai xuống nước?",["让他体会强烈的渴望","惩罚他","让他学游泳"]],["这个故事的意思是什么？","Câu chuyện có ý nghĩa gì?",["成功需要强烈的愿望","空气很重要","要远离河边"]]]},{"l":5,"s":6,"k":"Hội thoại","t":"女：我们公司打算明年开发海外市场，你怎么看？男：这是个好机会，但风险也不小，不同国家的文化和法律都不一样。女：所以我们需要先做市场调查。男：对，还要找当地的合作伙伴。","vi":"Nữ: Công ty định năm sau phát triển thị trường nước ngoài, anh thấy sao? Nam: Đây là cơ hội tốt nhưng rủi ro cũng không nhỏ, văn hóa và luật pháp mỗi nước đều khác. Nữ: Vì thế cần khảo sát thị trường trước. Nam: Đúng, còn phải tìm đối tác địa phương.","qs":[["公司明年有什么计划？","Năm sau công ty có kế hoạch gì?",["开发海外市场","招聘新员工","降低价格"]],["男的认为需要注意什么？","Người nam cho rằng cần chú ý điều gì?",["文化和法律的差别","天气变化","员工工资"]]]},{"l":5,"s":6,"k":"Đoạn văn","t":"很多父母担心孩子玩电子游戏会影响学习。但也有研究发现，适当玩一些游戏可以提高孩子的反应能力和解决问题的能力。关键不在于玩不玩，而在于怎么玩、玩多长时间。父母应该和孩子一起制定规则，而不是简单地禁止。","vi":"Nhiều cha mẹ lo con chơi game sẽ ảnh hưởng học tập. Nhưng cũng có nghiên cứu cho thấy chơi game vừa phải có thể nâng cao khả năng phản xạ và giải quyết vấn đề của trẻ. Mấu chốt không nằm ở chơi hay không, mà ở chơi thế nào, chơi bao lâu. Cha mẹ nên cùng con đặt ra quy tắc thay vì cấm đoán đơn giản.","qs":[["研究发现适当玩游戏有什么好处？","Nghiên cứu thấy chơi game vừa phải có lợi gì?",["提高反应能力","提高考试成绩","让孩子更听话"]],["作者建议父母怎么做？","Tác giả khuyên cha mẹ làm gì?",["和孩子一起制定规则","完全禁止游戏","不管孩子"]]]},{"l":5,"s":6,"k":"Đoạn văn","t":"现代社会节奏越来越快，很多人一边吃饭一边看手机，一边走路一边打电话。人们以为这样可以节省时间，提高效率。可是心理学家发现，同时做几件事反而会降低效率，因为大脑需要不断地在不同任务之间转换。","vi":"Nhịp sống hiện đại ngày càng nhanh, nhiều người vừa ăn vừa xem điện thoại, vừa đi vừa gọi điện. Người ta tưởng như vậy tiết kiệm thời gian, nâng cao hiệu suất. Nhưng các nhà tâm lý học phát hiện làm nhiều việc cùng lúc lại giảm hiệu suất, vì não phải liên tục chuyển đổi giữa các nhiệm vụ.","qs":[["心理学家发现了什么？","Các nhà tâm lý học phát hiện điều gì?",["同时做几件事会降低效率","看手机能提高效率","大脑可以同时做很多事"]],["为什么效率会降低？","Vì sao hiệu suất giảm?",["大脑要不断转换任务","手机太好玩","吃饭太慢"]]]},{"l":5,"s":7,"k":"Đoạn văn","t":"有一位著名的画家，年轻时为了画好鸡蛋，每天都画几百个。他的老师告诉他，世界上没有两个完全相同的鸡蛋，即使是同一个鸡蛋，从不同的角度看，形状也不一样。正是这种耐心和细心的观察，为他后来的成就打下了坚实的基础。","vi":"Có một họa sĩ nổi tiếng, thời trẻ để vẽ đẹp quả trứng, mỗi ngày ông vẽ mấy trăm quả. Thầy ông bảo trên đời không có hai quả trứng giống hệt nhau, ngay cả cùng một quả, nhìn từ góc khác nhau hình dạng cũng khác. Chính sự kiên nhẫn và quan sát tỉ mỉ ấy đã đặt nền móng vững chắc cho thành tựu sau này của ông.","qs":[["画家年轻时每天做什么？","Thời trẻ họa sĩ mỗi ngày làm gì?",["画几百个鸡蛋","画风景","学写字"]],["这段话主要想说明什么？","Đoạn văn chủ yếu muốn nói gì?",["成功离不开基础练习和观察","鸡蛋很难画","老师很严格"]]]},{"l":5,"s":7,"k":"Hội thoại","t":"女：听说你辞职了？男：是的，我打算自己创业，开一家咖啡店。女：现在开咖啡店的人很多，竞争很激烈啊。男：我知道，所以我的店会有自己的特色，比如把书店和咖啡馆结合起来，让顾客可以安静地看书。女：听起来很有意思，祝你成功！","vi":"Nữ: Nghe nói anh nghỉ việc rồi? Nam: Đúng, anh định tự khởi nghiệp, mở một quán cà phê. Nữ: Giờ nhiều người mở quán cà phê lắm, cạnh tranh gay gắt đấy. Nam: Anh biết, nên quán anh sẽ có nét riêng, ví dụ kết hợp hiệu sách với quán cà phê để khách có thể yên tĩnh đọc sách. Nữ: Nghe thú vị đấy, chúc anh thành công!","qs":[["男的辞职后打算做什么？","Nghỉ việc rồi người nam định làm gì?",["开咖啡店","去旅游","找新工作"]],["男的店有什么特色？","Quán của người nam có nét đặc sắc gì?",["结合书店和咖啡馆","价格最便宜","二十四小时营业"]]]},{"l":5,"s":7,"k":"Đoạn văn","t":"竹子在最初的四年里，只长了三厘米，很多人以为它停止生长了。可是从第五年开始，它每天能长三十厘米，六周就能长到十五米高。原来，在前四年，竹子把根在土地里伸展了几百平方米。人生也是如此，那些看不见的积累，终将在某一天带来巨大的变化。","vi":"Trong bốn năm đầu cây tre chỉ cao được 3 cm, nhiều người tưởng nó ngừng lớn. Nhưng từ năm thứ năm, mỗi ngày nó cao thêm 30 cm, sáu tuần đã cao tới 15 mét. Thì ra trong bốn năm đầu, tre đã vươn rễ khắp mấy trăm mét vuông dưới đất. Đời người cũng vậy, những tích lũy không nhìn thấy rồi sẽ có ngày mang lại thay đổi to lớn.","qs":[["竹子前四年在做什么？","Bốn năm đầu cây tre làm gì?",["让根在地下伸展","停止生长","等待下雨"]],["作者用竹子说明什么道理？","Tác giả dùng cây tre để nói đạo lý gì?",["积累终会带来变化","竹子长得很快","要多种竹子"]]]},{"l":5,"s":7,"k":"Hội thoại","t":"男：我们的产品销量最近下降得很厉害，你觉得原因是什么？女：我做了调查，主要有两个原因：一是竞争对手推出了更便宜的产品，二是我们的广告已经很久没有更新了。男：那你有什么建议？女：我建议在保证质量的前提下适当降价，同时推出新的广告。","vi":"Nam: Doanh số sản phẩm gần đây giảm mạnh, em thấy nguyên nhân là gì? Nữ: Em đã khảo sát, chủ yếu có hai nguyên nhân: một là đối thủ tung ra sản phẩm rẻ hơn, hai là quảng cáo của ta lâu rồi không đổi mới. Nam: Vậy em có đề xuất gì? Nữ: Em đề nghị giảm giá hợp lý mà vẫn đảm bảo chất lượng, đồng thời ra quảng cáo mới.","qs":[["产品销量下降的原因有哪些？","Doanh số giảm vì những nguyên nhân nào?",["对手产品更便宜，广告没更新","质量变差","员工太少"]],["女的建议怎么做？","Người nữ đề xuất làm gì?",["适当降价，推出新广告","停止生产","提高价格"]]]},{"l":5,"s":7,"k":"Đoạn văn","t":"古人说：“学而不思则罔，思而不学则殆。”意思是只学习而不思考，就会感到迷惑；只思考而不学习，就会陷入危险。这句话告诉我们，学习和思考必须结合起来。在今天这个信息爆炸的时代，我们每天接受大量的信息，更需要独立思考，学会判断哪些是真实的、有价值的。","vi":"Người xưa nói: “Học mà không nghĩ thì mờ mịt, nghĩ mà không học thì nguy.” Nghĩa là chỉ học mà không suy nghĩ sẽ thấy mơ hồ; chỉ nghĩ mà không học sẽ rơi vào nguy hiểm. Câu này dạy ta học và nghĩ phải kết hợp. Trong thời đại bùng nổ thông tin hôm nay, mỗi ngày ta tiếp nhận lượng lớn thông tin, càng cần tư duy độc lập, biết phán đoán điều gì là thật và có giá trị.","qs":[["“学而不思则罔”的意思是什么？","“Học nhi bất tư tắc võng” nghĩa là gì?",["只学不思考会感到迷惑","只思考不学习会危险","学习没有用"]],["作者认为在信息时代我们更需要什么？","Tác giả cho rằng thời đại thông tin ta càng cần gì?",["独立思考和判断","接受更多信息","少看新闻"]]]},{"l":6,"s":0,"k":"Đoạn văn","t":"很多人在面对挫折时，第一反应是逃避。然而，挫折本身并不可怕，可怕的是失去面对它的勇气。一个人只有经历过失败，才能真正懂得成功的价值。","vi":"Nhiều người khi gặp trắc trở, phản ứng đầu tiên là trốn tránh. Tuy nhiên bản thân trắc trở không đáng sợ, đáng sợ là mất đi dũng khí đối mặt với nó. Một người chỉ khi trải qua thất bại mới thật sự hiểu giá trị của thành công.","qs":[["作者认为什么才是可怕的？","Tác giả cho rằng điều gì mới đáng sợ?",["失去面对挫折的勇气","挫折本身","成功来得太晚"]],["经历过失败的人能懂得什么？","Người từng thất bại sẽ hiểu được điều gì?",["成功的价值","怎样逃避","失败的原因"]]]},{"l":6,"s":0,"k":"Hội thoại","t":"女：听说你们公司要裁员了？男：是啊，最近经济不景气，公司的订单减少了一半。女：那你会受影响吗？男：我所在的是公司的骨干部门，应该问题不大，但大家心里都很紧张。","vi":"Nữ: Nghe nói công ty anh sắp cắt giảm nhân sự à? Nam: Ừ, gần đây kinh tế khó khăn, đơn hàng công ty giảm một nửa. Nữ: Vậy anh có bị ảnh hưởng không? Nam: Anh ở bộ phận nòng cốt nên chắc không sao, nhưng ai cũng căng thẳng.","qs":[["公司为什么要裁员？","Vì sao công ty cắt giảm nhân sự?",["经济不景气，订单减少","员工太懒","公司要搬家"]],["男的觉得自己会被裁吗？","Người nam nghĩ mình có bị cắt không?",["问题不大","一定会","已经被裁了"]]]},{"l":6,"s":0,"k":"Đoạn văn","t":"端午节是中国的传统节日之一，人们在这一天吃粽子、赛龙舟。据说，这个节日是为了纪念古代诗人屈原。如今，端午节不仅是纪念活动，更成为家人团聚的好机会。","vi":"Tết Đoan Ngọ là một trong những lễ truyền thống của Trung Quốc, ngày này người ta ăn bánh ú, đua thuyền rồng. Tương truyền lễ này để tưởng nhớ nhà thơ cổ đại Khuất Nguyên. Ngày nay Đoan Ngọ không chỉ là dịp tưởng niệm mà còn là cơ hội tốt để gia đình đoàn tụ.","qs":[["端午节人们做什么？","Tết Đoan Ngọ người ta làm gì?",["吃粽子、赛龙舟","放鞭炮","赏月亮"]],["这个节日最初是为了纪念谁？","Lễ này ban đầu để tưởng nhớ ai?",["诗人屈原","一位皇帝","一位将军"]]]},{"l":6,"s":0,"k":"Hội thoại","t":"男：这份合同的格式有问题，你再检查一下。女：哪里有问题？男：日期和金额的位置写反了，而且还没有盖章。女：不好意思，我马上更正。","vi":"Nam: Định dạng hợp đồng này có vấn đề, em kiểm tra lại đi. Nữ: Sai ở đâu ạ? Nam: Vị trí ngày tháng và số tiền viết ngược, hơn nữa còn chưa đóng dấu. Nữ: Xin lỗi, em sửa ngay.","qs":[["合同有什么问题？","Hợp đồng có vấn đề gì?",["日期和金额写反了，没盖章","金额太高","名字写错了"]],["女的打算怎么做？","Người nữ định làm gì?",["马上更正","重新签合同","去找经理"]]]},{"l":6,"s":0,"k":"Đoạn văn","t":"中医认为，人与自然是一个整体。季节变化时，人的饮食和作息也应该随之调整。比如，夏天天气炎热，应该多吃清淡的食物；冬天寒冷，则可以适当吃一些热量高的东西。","vi":"Đông y cho rằng con người và tự nhiên là một thể thống nhất. Khi mùa thay đổi, ăn uống và sinh hoạt cũng nên điều chỉnh theo. Ví dụ mùa hè nóng nực nên ăn thanh đạm; mùa đông lạnh thì có thể ăn thêm đồ nhiều năng lượng.","qs":[["中医认为人与自然是什么关系？","Đông y cho rằng người và tự nhiên có quan hệ gì?",["一个整体","互相对立","没有关系"]],["夏天应该吃什么样的食物？","Mùa hè nên ăn đồ ăn thế nào?",["清淡的","热量高的","很辣的"]]]},{"l":6,"s":1,"k":"Hội thoại","t":"女：你最近怎么总是无精打采的？男：我在准备硕士论文答辩，压力特别大。女：别把自己逼得太紧，适当放松一下，效率反而更高。男：你说得有道理，我周末去爬爬山。","vi":"Nữ: Sao dạo này anh lúc nào cũng uể oải thế? Nam: Anh đang chuẩn bị bảo vệ luận văn thạc sĩ, áp lực lắm. Nữ: Đừng ép mình quá, thư giãn hợp lý thì hiệu quả lại cao hơn. Nam: Em nói có lý, cuối tuần anh đi leo núi.","qs":[["男的最近在准备什么？","Dạo này người nam chuẩn bị gì?",["论文答辩","婚礼","搬家"]],["女的建议男的怎么做？","Người nữ khuyên người nam thế nào?",["适当放松","更加努力","放弃答辩"]]]},{"l":6,"s":1,"k":"Đoạn văn","t":"网络购物的普及给快递行业带来了巨大的机遇，但同时也产生了大量的包装垃圾。据统计，每年快递包装消耗的纸箱和塑料袋数量惊人。因此，越来越多的企业开始推广可回收的环保包装。","vi":"Mua sắm trực tuyến phổ biến mang lại cơ hội lớn cho ngành chuyển phát nhanh, nhưng cũng sinh ra lượng rác bao bì khổng lồ. Theo thống kê, số thùng giấy và túi ni lông tiêu tốn mỗi năm thật đáng kinh ngạc. Vì vậy ngày càng nhiều doanh nghiệp bắt đầu dùng bao bì thân thiện môi trường có thể tái chế.","qs":[["快递行业的发展带来了什么问题？","Sự phát triển ngành chuyển phát gây ra vấn đề gì?",["大量包装垃圾","物价上涨","交通堵塞"]],["企业采取了什么措施？","Doanh nghiệp áp dụng biện pháp gì?",["推广可回收包装","停止送快递","提高运费"]]]},{"l":6,"s":1,"k":"Hội thoại","t":"男：您好，我想咨询一下贷款的事。女：您是想买房还是创业？男：我想开一家小餐厅。女：创业贷款需要提供营业执照和详细的经营计划，审核大概需要两周。","vi":"Nam: Chào chị, tôi muốn hỏi về việc vay vốn. Nữ: Anh muốn mua nhà hay khởi nghiệp? Nam: Tôi muốn mở một nhà hàng nhỏ. Nữ: Vay khởi nghiệp cần giấy phép kinh doanh và kế hoạch kinh doanh chi tiết, xét duyệt mất khoảng hai tuần.","qs":[["男的贷款想做什么？","Người nam vay tiền để làm gì?",["开餐厅","买房","买车"]],["申请贷款需要提供什么？","Xin vay cần cung cấp gì?",["营业执照和经营计划","身份证和照片","银行卡"]]]},{"l":6,"s":1,"k":"Hội thoại","t":"女：你看今天的新闻了吗？那位科学家的研究成果获得了国际大奖。男：看了，他坚持研究了二十年，真不容易。女：听说他当初也遭到过很多人的质疑。男：正因为他没有半途而废，才有今天的成就。","vi":"Nữ: Anh xem tin hôm nay chưa? Thành quả nghiên cứu của nhà khoa học đó vừa đạt giải quốc tế. Nam: Xem rồi, ông kiên trì nghiên cứu hai mươi năm, thật không dễ. Nữ: Nghe nói lúc đầu ông cũng bị nhiều người nghi ngờ. Nam: Chính vì không bỏ dở giữa chừng nên mới có thành tựu hôm nay.","qs":[["科学家研究了多少年？","Nhà khoa học nghiên cứu bao nhiêu năm?",["二十年","十年","两年"]],["男的认为科学家成功的原因是什么？","Người nam cho rằng nhà khoa học thành công vì sao?",["没有半途而废","运气很好","有很多钱"]]]},{"l":6,"s":2,"k":"Đoạn văn","t":"“画蛇添足”的故事讲的是：几个人比赛画蛇，谁先画完谁就能喝酒。有个人最先画完，看别人还没画好，就得意地给蛇添上了脚。结果，另一个人说：“蛇本来没有脚，你画的不是蛇！”于是把酒拿走了。这个成语比喻做了多余的事，反而把事情弄糟。","vi":"Chuyện “vẽ rắn thêm chân”: mấy người thi vẽ rắn, ai vẽ xong trước được uống rượu. Có người vẽ xong đầu tiên, thấy người khác chưa xong liền đắc ý vẽ thêm chân cho rắn. Kết quả người khác nói: “Rắn vốn không có chân, anh vẽ không phải rắn!” rồi lấy mất bình rượu. Thành ngữ ví việc làm thừa thãi ngược lại làm hỏng việc.","qs":[["最先画完的人为什么没喝到酒？","Vì sao người vẽ xong trước không được uống rượu?",["他给蛇画了脚","他画得太慢","他不喜欢喝酒"]],["“画蛇添足”比喻什么？","“Vẽ rắn thêm chân” ví điều gì?",["做多余的事反而坏事","画画要认真","比赛要公平"]]]},{"l":6,"s":2,"k":"Hội thoại","t":"男：这次的项目策划，你们部门有什么意见？女：总体方向我们赞同，不过预算方面存在分歧。男：具体是哪一部分？女：宣传费用占的比重太大了，我们建议把一部分资金投入到产品研发中。","vi":"Nam: Về kế hoạch dự án lần này, bộ phận các chị có ý kiến gì? Nữ: Hướng tổng thể chúng tôi tán thành, nhưng về ngân sách còn bất đồng. Nam: Cụ thể là phần nào? Nữ: Chi phí quảng bá chiếm tỷ trọng quá lớn, chúng tôi đề nghị chuyển một phần vốn sang nghiên cứu phát triển sản phẩm.","qs":[["女的部门对哪方面有不同意见？","Bộ phận người nữ bất đồng về mặt nào?",["预算","总体方向","时间安排"]],["女的建议把资金投入到哪里？","Người nữ đề nghị đầu tư vốn vào đâu?",["产品研发","宣传","员工工资"]]]},{"l":6,"s":2,"k":"Đoạn văn","t":"近年来，越来越多的年轻人选择“断舍离”的生活方式，即放弃不需要的东西，摆脱对物质的过度依赖。他们认为，物品越少，生活反而越轻松，也能把更多精力放在真正重要的事情上。","vi":"Những năm gần đây ngày càng nhiều người trẻ chọn lối sống “đoạn xả ly”, tức là bỏ đi những thứ không cần, thoát khỏi sự lệ thuộc quá mức vào vật chất. Họ cho rằng đồ đạc càng ít, cuộc sống càng nhẹ nhõm, lại dồn được nhiều tâm sức cho những việc thật sự quan trọng.","qs":[["“断舍离”是什么样的生活方式？","“Đoạn xả ly” là lối sống thế nào?",["放弃不需要的东西","购买更多东西","离开城市"]],["年轻人认为这样做有什么好处？","Người trẻ cho rằng làm vậy có lợi gì?",["生活更轻松，专注重要的事","能赚更多钱","朋友更多"]]]},{"l":6,"s":2,"k":"Đoạn văn","t":"心理学研究发现，人们在做决策时，往往会受到“第一印象”的影响。比如，面试官常常在见面的最初几分钟就对应聘者形成了判断，之后的提问只是在寻找证据来证明自己的判断。因此，面试时良好的开场非常关键。","vi":"Nghiên cứu tâm lý học phát hiện khi ra quyết định, con người thường bị “ấn tượng đầu tiên” chi phối. Ví dụ người phỏng vấn thường hình thành nhận định về ứng viên trong vài phút đầu gặp mặt, các câu hỏi sau chỉ là tìm bằng chứng chứng minh nhận định đó. Vì vậy khi phỏng vấn, màn mở đầu tốt rất then chốt.","qs":[["面试官常常什么时候形成判断？","Người phỏng vấn thường hình thành nhận định khi nào?",["见面最初几分钟","面试结束后","看完简历后"]],["这段话告诉应聘者什么？","Đoạn văn nhắn nhủ ứng viên điều gì?",["良好的开场很关键","要多提问题","简历不重要"]]]},{"l":6,"s":3,"k":"Hội thoại","t":"男：你对人工智能的发展怎么看？女：它无疑会给社会带来巨大的变革，很多重复性的工作将被取代。男：那岂不是会造成大量失业？女：短期内可能会有冲击，但历史证明，每次技术革命都会创造出新的岗位。关键是人们要不断学习，适应变化。","vi":"Nam: Em nhìn nhận thế nào về sự phát triển của trí tuệ nhân tạo? Nữ: Chắc chắn nó sẽ mang lại biến đổi lớn cho xã hội, nhiều công việc lặp lại sẽ bị thay thế. Nam: Vậy chẳng phải sẽ gây thất nghiệp hàng loạt sao? Nữ: Ngắn hạn có thể bị tác động, nhưng lịch sử chứng minh mỗi cuộc cách mạng kỹ thuật đều tạo ra vị trí mới. Mấu chốt là con người phải không ngừng học hỏi, thích ứng với thay đổi.","qs":[["女的认为人工智能会取代什么样的工作？","Người nữ cho rằng AI sẽ thay thế loại công việc nào?",["重复性的工作","所有的工作","创造性的工作"]],["女的认为人们应该怎么应对？","Người nữ cho rằng con người nên ứng phó thế nào?",["不断学习，适应变化","反对技术发展","换个城市生活"]]]},{"l":6,"s":3,"k":"Đoạn văn","t":"庄子讲过一个故事：一位厨师为国王宰牛，动作熟练得像在跳舞。国王惊叹不已，问他技术为何如此高超。厨师说，他刚开始宰牛时，眼里看到的是整头牛；三年之后，他看到的已经是牛的结构，刀顺着骨节的空隙走，十九年来刀刃依然像新的一样。这就是成语“游刃有余”的来源。","vi":"Trang Tử kể chuyện một đầu bếp mổ bò cho nhà vua, động tác thuần thục như đang múa. Vua kinh ngạc hỏi vì sao tài nghệ cao siêu vậy. Đầu bếp nói lúc mới mổ bò, trong mắt ông là cả con bò; ba năm sau, ông đã nhìn thấy cấu trúc của nó, dao men theo khe hở giữa các khớp xương, mười chín năm lưỡi dao vẫn như mới. Đó là nguồn gốc thành ngữ “du nhận hữu dư”.","qs":[["厨师为什么技术高超？","Vì sao người đầu bếp tài nghệ cao siêu?",["了解了牛的结构","刀特别好","力气很大"]],["“游刃有余”现在比喻什么？","“Du nhận hữu dư” nay ví điều gì?",["做事熟练，轻松自如","刀很锋利","喜欢跳舞"]]]},{"l":6,"s":3,"k":"Hội thoại","t":"女：最近城里开始推行垃圾分类，你适应了吗？男：刚开始挺麻烦的，经常分不清厨余垃圾和其他垃圾。女：现在呢？男：社区工作人员耐心地给我们讲解，还贴了指南，现在已经养成习惯了。其实垃圾分类不仅能保护环境，还能让资源得到回收利用。","vi":"Nữ: Gần đây thành phố bắt đầu phân loại rác, anh quen chưa? Nam: Lúc đầu khá phiền, hay không phân biệt được rác nhà bếp với rác khác. Nữ: Còn bây giờ? Nam: Nhân viên khu dân cư kiên nhẫn giải thích, còn dán hướng dẫn, giờ đã thành thói quen. Thật ra phân loại rác không chỉ bảo vệ môi trường mà còn giúp tái chế tài nguyên.","qs":[["男的刚开始遇到什么困难？","Lúc đầu người nam gặp khó khăn gì?",["分不清垃圾种类","没有垃圾桶","工作太忙"]],["男的认为垃圾分类有什么意义？","Người nam cho rằng phân loại rác có ý nghĩa gì?",["保护环境，回收资源","可以赚钱","认识邻居"]]]},{"l":6,"s":3,"k":"Đoạn văn","t":"古人云：“千里之行，始于足下。”再远大的理想，也要从脚下的第一步开始。许多人空有抱负，却迟迟不肯行动，总想等到条件成熟再出发。殊不知，条件往往是在行动中逐步创造出来的。与其一味等待，不如立即着手，在实践中不断调整方向。","vi":"Người xưa nói: “Hành trình nghìn dặm bắt đầu từ dưới chân.” Lý tưởng lớn đến đâu cũng phải bắt đầu từ bước đầu tiên. Nhiều người ôm hoài bão suông mà chần chừ không hành động, cứ muốn đợi điều kiện chín muồi mới xuất phát. Họ không biết rằng điều kiện thường được tạo dần trong quá trình hành động. Thay vì cứ chờ đợi, chi bằng bắt tay ngay, vừa làm vừa điều chỉnh hướng đi.","qs":[["“千里之行，始于足下”是什么意思？","“Thiên lý chi hành, thủy ư túc hạ” nghĩa là gì?",["远大目标从第一步开始","走路要小心","要走得很远"]],["作者批评了什么样的人？","Tác giả phê phán kiểu người nào?",["有抱负却不行动的人","行动太快的人","没有理想的人"]]]},{"l":6,"s":3,"k":"Hội thoại","t":"男：作为一名企业家，您认为最重要的品质是什么？女：我认为是诚信。生意场上，信誉一旦失去，就很难再挽回。男：可是有些人靠投机取巧也赚了很多钱。女：那只是一时的。从长远来看，只有讲诚信、重质量的企业，才能赢得顾客的信任，走得更远。","vi":"Nam: Là một doanh nhân, bà cho rằng phẩm chất quan trọng nhất là gì? Nữ: Tôi cho là sự chính trực. Trên thương trường, uy tín một khi mất đi thì rất khó lấy lại. Nam: Nhưng có người nhờ đầu cơ mánh khóe cũng kiếm được nhiều tiền. Nữ: Đó chỉ là nhất thời. Về lâu dài, chỉ doanh nghiệp giữ chữ tín, coi trọng chất lượng mới giành được lòng tin khách hàng và đi xa hơn.","qs":[["女的认为企业家最重要的品质是什么？","Người nữ cho rằng phẩm chất quan trọng nhất là gì?",["诚信","聪明","运气"]],["女的怎么看投机取巧的人？","Người nữ nhìn nhận người đầu cơ mánh khóe thế nào?",["成功只是一时的","值得学习","一定会马上失败"]]]},{"l":1,"s":0,"k":"Đoạn văn","t":"我有一个哥哥和一个妹妹。哥哥是医生，妹妹是学生。我们都很爱妈妈。","vi":"Tôi có một anh trai và một em gái. Anh trai là bác sĩ, em gái là học sinh. Chúng tôi đều rất yêu mẹ.","qs":[["他有几个妹妹？","Anh ấy có mấy em gái?",["一个","两个","三个"]],["哥哥做什么工作？","Anh trai làm nghề gì?",["医生","老师","学生"]]]},{"l":1,"s":0,"k":"Hội thoại","t":"男：你叫什么名字？女：我叫李小月。男：你是哪国人？女：我是中国人。","vi":"Nam: Bạn tên là gì? Nữ: Tôi tên là Lý Tiểu Nguyệt. Nam: Bạn là người nước nào? Nữ: Tôi là người Trung Quốc.","qs":[["女的叫什么名字？","Người nữ tên là gì?",["李小月","王明","李月"]],["女的是哪国人？","Người nữ là người nước nào?",["中国人","越南人","美国人"]]]},{"l":1,"s":0,"k":"Đoạn văn","t":"今天是星期一。我八点去学校，十二点回家吃饭。下午我在家看书。","vi":"Hôm nay là thứ Hai. Tôi đến trường lúc tám giờ, mười hai giờ về nhà ăn cơm. Buổi chiều tôi ở nhà đọc sách.","qs":[["他几点去学校？","Anh ấy đến trường lúc mấy giờ?",["八点","十二点","两点"]],["下午他做什么？","Buổi chiều anh ấy làm gì?",["在家看书","去学校","去商店"]]]},{"l":1,"s":0,"k":"Hội thoại","t":"女：这是你的猫吗？男：是的，它叫小白。女：它几岁了？男：它三岁了。","vi":"Nữ: Đây là mèo của bạn à? Nam: Đúng vậy, nó tên là Tiểu Bạch. Nữ: Nó mấy tuổi rồi? Nam: Nó ba tuổi rồi.","qs":[["猫叫什么？","Con mèo tên là gì?",["小白","小黑","小猫"]],["猫几岁了？","Con mèo mấy tuổi?",["三岁","两岁","五岁"]]]},{"l":1,"s":0,"k":"Đoạn văn","t":"我爸爸今年五十岁。他喜欢喝茶，也喜欢看电视。他不喜欢喝咖啡。","vi":"Bố tôi năm nay năm mươi tuổi. Ông thích uống trà, cũng thích xem tivi. Ông không thích uống cà phê.","qs":[["爸爸多大了？","Bố bao nhiêu tuổi?",["五十岁","四十岁","六十岁"]],["爸爸不喜欢什么？","Bố không thích gì?",["喝咖啡","喝茶","看电视"]]]},{"l":1,"s":1,"k":"Hội thoại","t":"男：你好，这个杯子多少钱？女：二十块。男：太贵了，十五块，可以吗？女：好吧。","vi":"Nam: Chào cô, cái cốc này bao nhiêu tiền? Nữ: Hai mươi đồng. Nam: Đắt quá, mười lăm đồng được không? Nữ: Thôi được.","qs":[["杯子一开始多少钱？","Lúc đầu cái cốc giá bao nhiêu?",["二十块","十五块","十块"]],["男的最后用多少钱买杯子？","Cuối cùng người nam mua cốc giá bao nhiêu?",["十五块","二十块","五块"]]]},{"l":1,"s":1,"k":"Đoạn văn","t":"中午我和同学去饭店吃饭。我们吃了米饭和菜，还喝了很多水。饭菜很好吃。","vi":"Buổi trưa tôi cùng bạn học đi nhà hàng ăn cơm. Chúng tôi ăn cơm với thức ăn, còn uống rất nhiều nước. Đồ ăn rất ngon.","qs":[["他和谁去饭店？","Anh ấy đi nhà hàng với ai?",["同学","妈妈","老师"]],["饭菜怎么样？","Đồ ăn thế nào?",["很好吃","不好吃","太少了"]]]},{"l":1,"s":1,"k":"Hội thoại","t":"女：你想吃什么水果？男：我想吃苹果。女：商店里没有苹果了。男：那我们买别的吧。","vi":"Nữ: Bạn muốn ăn trái cây gì? Nam: Tôi muốn ăn táo. Nữ: Cửa hàng hết táo rồi. Nam: Vậy chúng ta mua thứ khác đi.","qs":[["男的想吃什么？","Người nam muốn ăn gì?",["苹果","米饭","菜"]],["商店里有苹果吗？","Cửa hàng còn táo không?",["没有了","有很多","有一个"]]]},{"l":1,"s":1,"k":"Đoạn văn","t":"星期天，妈妈去商店买东西。她买了三件衣服，一件是给我的，两件是给爸爸的。","vi":"Chủ nhật, mẹ đi cửa hàng mua đồ. Mẹ mua ba cái áo, một cái cho tôi, hai cái cho bố.","qs":[["妈妈买了几件衣服？","Mẹ mua mấy cái áo?",["三件","两件","一件"]],["给爸爸的衣服有几件？","Áo cho bố có mấy cái?",["两件","三件","一件"]]]},{"l":1,"s":1,"k":"Hội thoại","t":"男：你喜欢喝茶还是咖啡？女：我喜欢喝茶。男：我也是，我们去喝茶吧。","vi":"Nam: Bạn thích uống trà hay cà phê? Nữ: Tôi thích uống trà. Nam: Tôi cũng vậy, chúng ta đi uống trà đi.","qs":[["女的喜欢喝什么？","Người nữ thích uống gì?",["茶","咖啡","水"]],["他们要去做什么？","Họ định đi làm gì?",["喝茶","吃饭","看电影"]]]},{"l":1,"s":2,"k":"Đoạn văn","t":"今天天气很冷，下雨了。我不想出去，就在家里睡觉、看电视。","vi":"Hôm nay trời rất lạnh, lại mưa. Tôi không muốn ra ngoài, nên ở nhà ngủ, xem tivi.","qs":[["今天天气怎么样？","Hôm nay thời tiết thế nào?",["很冷，下雨了","很热","很好"]],["他为什么在家？","Vì sao anh ấy ở nhà?",["不想出去","他生病了","他要工作"]]]},{"l":1,"s":2,"k":"Hội thoại","t":"女：明天你去哪儿？男：我去北京看朋友。女：你怎么去？男：坐飞机去。","vi":"Nữ: Ngày mai bạn đi đâu? Nam: Tôi đi Bắc Kinh thăm bạn. Nữ: Bạn đi bằng gì? Nam: Đi máy bay.","qs":[["男的明天去哪儿？","Ngày mai người nam đi đâu?",["北京","学校","医院"]],["他怎么去？","Anh ấy đi bằng gì?",["坐飞机","坐出租车","开车"]]]},{"l":1,"s":2,"k":"Đoạn văn","t":"我家后面有一个很大的饭店，前面是一个小商店。我常常在那个商店买东西。","vi":"Phía sau nhà tôi có một nhà hàng rất lớn, phía trước là một cửa hàng nhỏ. Tôi thường mua đồ ở cửa hàng đó.","qs":[["饭店在哪儿？","Nhà hàng ở đâu?",["我家后面","我家前面","学校里"]],["他常常在哪儿买东西？","Anh ấy thường mua đồ ở đâu?",["小商店","大饭店","医院"]]]},{"l":1,"s":2,"k":"Hội thoại","t":"男：现在几点？女：八点五十五分。男：电影九点开始，我们快走吧！","vi":"Nam: Bây giờ mấy giờ? Nữ: Tám giờ năm mươi lăm. Nam: Phim bắt đầu lúc chín giờ, chúng ta đi nhanh thôi!","qs":[["现在几点？","Bây giờ là mấy giờ?",["八点五十五分","九点","九点五分"]],["电影几点开始？","Phim bắt đầu lúc mấy giờ?",["九点","八点","十点"]]]},{"l":1,"s":2,"k":"Đoạn văn","t":"我的朋友在医院工作，她是医生。她每天都很忙，很少有时间和我见面。","vi":"Bạn tôi làm việc ở bệnh viện, cô ấy là bác sĩ. Ngày nào cô ấy cũng rất bận, ít khi có thời gian gặp tôi.","qs":[["朋友在哪儿工作？","Bạn ấy làm việc ở đâu?",["医院","学校","饭店"]],["为什么她很少见我？","Vì sao cô ấy ít gặp tôi?",["她每天都很忙","她不喜欢我","她在北京"]]]},{"l":1,"s":3,"k":"Hội thoại","t":"女：喂，你在哪儿呢？男：我在火车站，我的火车下午三点开。女：好，到了给我打电话。","vi":"Nữ: Alô, bạn đang ở đâu? Nam: Tôi ở ga tàu, tàu của tôi chạy lúc ba giờ chiều. Nữ: Được, đến nơi thì gọi cho tôi.","qs":[["男的在哪儿？","Người nam đang ở đâu?",["火车站","飞机场","家里"]],["火车几点开？","Tàu chạy lúc mấy giờ?",["下午三点","上午三点","下午五点"]]]},{"l":1,"s":3,"k":"Đoạn văn","t":"我认识一个中国朋友，他叫大明。他会说汉语，也会说一点儿越南语。我们常常一起学习。","vi":"Tôi quen một người bạn Trung Quốc tên là Đại Minh. Anh ấy nói được tiếng Trung, cũng nói được một chút tiếng Việt. Chúng tôi thường học cùng nhau.","qs":[["大明会说什么？","Đại Minh nói được tiếng gì?",["汉语和一点儿越南语","只会汉语","英语"]],["他们常常一起做什么？","Họ thường cùng nhau làm gì?",["学习","吃饭","看电影"]]]},{"l":1,"s":3,"k":"Hội thoại","t":"男：你身体怎么样？女：不太好，我想去医院看看。男：我开车送你去吧。女：谢谢你！","vi":"Nam: Sức khỏe bạn thế nào? Nữ: Không tốt lắm, tôi muốn đi bệnh viện khám. Nam: Tôi lái xe đưa bạn đi nhé. Nữ: Cảm ơn bạn!","qs":[["女的身体怎么样？","Sức khỏe người nữ thế nào?",["不太好","很好","没问题"]],["男的怎么帮她？","Người nam giúp cô ấy thế nào?",["开车送她去医院","给她买水果","给她打电话"]]]},{"l":1,"s":3,"k":"Đoạn văn","t":"下个月是我妈妈的生日。我想给她买一件漂亮的衣服，再给她做好吃的饭。","vi":"Tháng sau là sinh nhật mẹ tôi. Tôi muốn mua cho mẹ một bộ quần áo đẹp, rồi nấu cho mẹ một bữa thật ngon.","qs":[["下个月是谁的生日？","Tháng sau là sinh nhật ai?",["妈妈","爸爸","他自己"]],["他想给妈妈买什么？","Anh ấy muốn mua gì cho mẹ?",["一件漂亮的衣服","一个杯子","水果"]]]},{"l":1,"s":3,"k":"Hội thoại","t":"女：你们学校有多少学生？男：有一千多个学生。女：老师呢？男：有八十多个老师。","vi":"Nữ: Trường bạn có bao nhiêu học sinh? Nam: Hơn một nghìn học sinh. Nữ: Còn giáo viên? Nam: Hơn tám mươi giáo viên.","qs":[["学校有多少学生？","Trường có bao nhiêu học sinh?",["一千多个","八十多个","一百个"]],["学校有多少老师？","Trường có bao nhiêu giáo viên?",["八十多个","一千多个","十个"]]]},{"l":2,"s":0,"k":"Đoạn văn","t":"我每天早上六点起床，先跑步半个小时，然后洗澡、吃早饭。跑步让我的身体越来越好。","vi":"Mỗi sáng tôi dậy lúc sáu giờ, chạy bộ nửa tiếng trước, rồi tắm và ăn sáng. Chạy bộ giúp sức khỏe tôi ngày càng tốt.","qs":[["他每天早上几点起床？","Mỗi sáng anh ấy dậy lúc mấy giờ?",["六点","七点","八点"]],["跑步以后他做什么？","Chạy bộ xong anh ấy làm gì?",["洗澡、吃早饭","睡觉","去上班"]]]},{"l":2,"s":0,"k":"Hội thoại","t":"女：你的新手机真漂亮，是在哪儿买的？男：是我生日的时候，姐姐送给我的。女：一定很贵吧？男：我也不知道。","vi":"Nữ: Điện thoại mới của bạn đẹp quá, mua ở đâu vậy? Nam: Chị gái tặng tôi hôm sinh nhật. Nữ: Chắc đắt lắm nhỉ? Nam: Tôi cũng không biết.","qs":[["手机是谁送的？","Ai tặng điện thoại?",["姐姐","妈妈","朋友"]],["男的为什么不知道价格？","Vì sao người nam không biết giá?",["是别人送的","他忘了","手机很便宜"]]]},{"l":2,"s":0,"k":"Đoạn văn","t":"这个房间不大，但是很干净。房间里有一张床、一张桌子和两把椅子。窗户旁边还有很多花。","vi":"Căn phòng này không lớn nhưng rất sạch. Trong phòng có một cái giường, một cái bàn và hai cái ghế. Cạnh cửa sổ còn có rất nhiều hoa.","qs":[["房间怎么样？","Căn phòng thế nào?",["不大，但是很干净","很大很脏","又大又新"]],["房间里有几把椅子？","Trong phòng có mấy cái ghế?",["两把","一把","三把"]]]},{"l":2,"s":0,"k":"Hội thoại","t":"男：外面下雪了，你出去的时候多穿点儿衣服。女：知道了。你帮我找一下我的白色帽子，好吗？男：在门旁边。","vi":"Nam: Bên ngoài tuyết rơi rồi, lúc ra n
